# Phase-start audit template
# Save to one of:
# - docs/plan/<plan-id>/mutl3y-artifacts/phase0/phase-start-audit.yaml
# - docs/plan/<plan-id>/mutl3y-artifacts/phase5/wave-<N>-start-audit.yaml

status: ok # ok | stall
phase: P0 # P0 | P5
cycle: gNN
wave: null # null for P0, integer for P5
expected_artifacts:
  - docs/plan/<plan-id>/mutl3y-artifacts/phase0/learning-context.yaml
present_artifacts: []
missing_artifacts: []
plan_pointer_matches_artifacts: true
next_dispatch_targets:
  - Scout-Typing
  - Scout-Ownership
  - Scout-ControlFlow
  - Scout-Graph
owned_file_sets: []
notes: >-
  Record why phase entry is valid, or why it is stalled.

