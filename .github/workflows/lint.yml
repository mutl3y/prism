---
name: Lint

on:  # yamllint disable-line rule:truthy
  push: null
  pull_request: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_BRANCH: main
  VALIDATE_ALL_CODEBASE: false
  FILTER_REGEX_EXCLUDE: >-
    (^|/)(docs/plan/|old_docs/|plugins/|\.github/skills/|\.local/|\.codex$|test_output\.log$)
  VALIDATE_BIOME_FORMAT: false
  VALIDATE_BIOME_LINT: false
  VALIDATE_CHECKOV: false
  VALIDATE_CSS: false
  VALIDATE_CSS_PRETTIER: false
  VALIDATE_ENV: false
  VALIDATE_GITLEAKS: false
  VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
  VALIDATE_HTML: false
  VALIDATE_HTML_PRETTIER: false
  VALIDATE_JAVASCRIPT_PRETTIER: false
  VALIDATE_JSCPD: false
  VALIDATE_JSON_PRETTIER: false
  VALIDATE_MARKDOWN: false
  VALIDATE_MARKDOWN_PRETTIER: false
  VALIDATE_NATURAL_LANGUAGE: false
  VALIDATE_PYTHON_BLACK: false
  VALIDATE_PYTHON_FLAKE8: false
  VALIDATE_PYTHON_ISORT: false
  VALIDATE_PYTHON_MYPY: false
  VALIDATE_PYTHON_PYLINT: false
  VALIDATE_PYTHON_RUFF_FORMAT: false
  VALIDATE_SPELL_CODESPELL: false
  VALIDATE_TYPESCRIPT_ES: false
  VALIDATE_TYPESCRIPT_PRETTIER: false
  VALIDATE_YAML_PRETTIER: false

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      repo_lint: ${{ steps.detect.outputs.repo_lint }}
      plugin_comment_highlighter: ${{ steps.detect.outputs.plugin_comment_highlighter }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
          else
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          fi

          printf 'Changed files:\n%s\n' "$CHANGED_FILES"

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(plugins/prism-comment-highlighter/|\.github/workflows/lint\.yml$)'; then
            echo "plugin_comment_highlighter=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugin_comment_highlighter=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Ev '^(docs/plan/|old_docs/|plugins/|\.github/skills/|\.local/|\.codex$|test_output\.log$|\.github/badges/)' | grep -q .; then
            echo "repo_lint=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_lint=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.repo_lint == 'true' }}

    permissions:
      # contents permission to clone the repository
      contents: read
      packages: read
      # issues and pull-requests permissions to write results as pull
      # request comments. Omit them if you don't need summary comments
      issues: write
      pull-requests: write
      # To report GitHub Actions status checks. Omit if you don't need
      # to update commit status
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        # v8.6.0
        uses: super-linter/super-linter@9e863354e3ff62e0727d37183162c4a88873df41
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-comment-highlighter:
    name: Plugin Comment Highlighter
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.plugin_comment_highlighter == 'true' }}

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/prism-comment-highlighter/package-lock.json

      - name: Install plugin dependencies
        working-directory: plugins/prism-comment-highlighter
        run: npm ci

      - name: Check plugin formatting
        working-directory: plugins/prism-comment-highlighter
        run: npm run format:check

      - name: Lint plugin sources
        working-directory: plugins/prism-comment-highlighter
        run: npm run lint

      - name: Typecheck plugin sources
        working-directory: plugins/prism-comment-highlighter
        run: npm run check

      - name: Test plugin
        working-directory: plugins/prism-comment-highlighter
        run: npm test
