name: Format
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  pull-requests: write
on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - ".github/badges/**"
      - "docs/plan/**"
      - "old_docs/**"
      - ".github/skills/**"
      - ".local/**"
      - "test_output.log"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto-format and enforce pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            tox.ini

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pre-commit

      - name: Run pre-commit (auto-fix)
        run: |
          pre-commit run --all-files || true

      - name: Commit & push formatting changes
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: apply automatic formatting via pre-commit" || echo "No changes to commit"
            git push origin "HEAD:${PR_HEAD_REF}"
            echo "Auto-formatted and pushed changes."
          else
            echo "No formatting changes needed."
          fi
