name: prism

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.14"
  TRIVY_VERSION: "0.69.3"

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/badges/**"
      - "docs/plan/**"
      - "old_docs/**"
      - ".github/skills/**"
      - ".local/**"
      - "test_output.log"
  pull_request:
    paths-ignore:
      - ".github/badges/**"
      - "docs/plan/**"
      - "old_docs/**"
      - ".github/skills/**"
      - ".local/**"
      - "test_output.log"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto-format and enforce pre-commit
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            tox.ini

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pre-commit

      - name: Run pre-commit (auto-fix)
        run: |
          pre-commit run --all-files || true

      - name: Commit & push formatting changes
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: apply automatic formatting via pre-commit" || echo "No changes to commit"
            git push origin "HEAD:${PR_HEAD_REF}"
            echo "Auto-formatted and pushed changes."
          else
            echo "No formatting changes needed."
          fi

  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      repo_lint: ${{ steps.detect.outputs.repo_lint }}
      repo_lint_files: ${{ steps.detect.outputs.repo_lint_files }}
      workflow_files: ${{ steps.detect.outputs.workflow_files }}
      plugin_comment_highlighter: ${{ steps.detect.outputs.plugin_comment_highlighter }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
          else
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          fi

          printf 'Changed files:\n%s\n' "$CHANGED_FILES"

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^plugins/prism-comment-highlighter/'; then
            echo "plugin_comment_highlighter=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugin_comment_highlighter=false" >> "$GITHUB_OUTPUT"
          fi

          REPO_LINT_FILES=$(
            printf '%s\n' "$CHANGED_FILES" |
              grep -Ev '^(docs/plan/|old_docs/|plugins/|\.github/skills/|\.local/|\.codex$|test_output\.log$|\.github/badges/)' ||
              true
          )
          WORKFLOW_FILES=$(printf '%s\n' "$REPO_LINT_FILES" | grep -E '^\.github/workflows/.*\.ya?ml$' || true)

          if [ -n "$REPO_LINT_FILES" ]; then
            echo "repo_lint=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_lint=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "repo_lint_files<<EOF"
            printf '%s\n' "$REPO_LINT_FILES"
            echo "EOF"
            echo "workflow_files<<EOF"
            printf '%s\n' "$WORKFLOW_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.repo_lint == 'true' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            .pre-commit-config.yaml

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pre-commit yamllint

      - name: Install actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          GOBIN="$HOME/.local/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8

      - name: Install Trivy
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          install -m 0755 /tmp/trivy "$HOME/.local/bin/trivy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: GITHUB_ACTIONS
        env:
          WORKFLOW_FILES: ${{ needs.changes.outputs.workflow_files }}
        run: |
          workflow_files_input=${WORKFLOW_FILES:-}
          mapfile -t workflow_files <<<"$workflow_files_input"
          existing_workflow_files=()

          for workflow_file in "${workflow_files[@]}"; do
            if [ -f "$workflow_file" ]; then
              existing_workflow_files+=("$workflow_file")
            fi
          done

          if [ "${#existing_workflow_files[@]}" -eq 0 ]; then
            echo "No existing changed workflow files to lint."
            exit 0
          fi

          actionlint "${existing_workflow_files[@]}"

      - name: GIT_MERGE_CONFLICT_MARKERS
        env:
          REPO_LINT_FILES: ${{ needs.changes.outputs.repo_lint_files }}
        run: |
          mapfile -t repo_files <<<"$REPO_LINT_FILES"

          if grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- "${repo_files[@]}"; then
            echo "Merge conflict markers detected."
            exit 1
          fi

      - name: YAML
        env:
          REPO_LINT_FILES: ${{ needs.changes.outputs.repo_lint_files }}
        run: |
          mapfile -t yaml_files < <(
            printf '%s\n' "$REPO_LINT_FILES" |
              grep -E '\.ya?ml$' |
              grep -Ev '^(src/prism/tests/roles/|debug_readmes/)' || true
          )

          if [ "${#yaml_files[@]}" -eq 0 ] || [ -z "${yaml_files[0]}" ]; then
            echo "No changed YAML files to lint."
            exit 0
          fi

          yamllint -f github "${yaml_files[@]}"

      - name: PRE_COMMIT
        env:
          REPO_LINT_FILES: ${{ needs.changes.outputs.repo_lint_files }}
        run: |
          mapfile -t repo_files <<<"$REPO_LINT_FILES"

          if [ "${#repo_files[@]}" -eq 0 ] || [ -z "${repo_files[0]}" ]; then
            echo "No changed files to lint with pre-commit."
            exit 0
          fi

          pre-commit run --files "${repo_files[@]}" --show-diff-on-failure

      - name: TRIVY
        run: trivy fs --exit-code 1 --no-progress --scanners vuln,misconfig,secret .

  plugin-comment-highlighter:
    name: Plugin Comment Highlighter
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.plugin_comment_highlighter == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/prism-comment-highlighter/package-lock.json

      - name: Install plugin dependencies
        working-directory: plugins/prism-comment-highlighter
        run: npm ci

      - name: Check plugin formatting
        working-directory: plugins/prism-comment-highlighter
        run: npm run format:check

      - name: Lint plugin sources
        working-directory: plugins/prism-comment-highlighter
        run: npm run lint

      - name: Typecheck plugin sources
        working-directory: plugins/prism-comment-highlighter
        run: npm run check

      - name: Test plugin
        working-directory: plugins/prism-comment-highlighter
        run: npm test

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            tox.ini

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run typecheck
        run: |
          tox -e typecheck

      - name: Run targeted runtime lint checks
        run: |
          tox -e lint-runtime-slices

      - name: Run targeted runtime typecheck
        run: |
          tox -e typecheck-runtime-slices

      - name: Run smoke imports
        run: |
          tox -e smoke-imports

  tests:
    runs-on: ubuntu-latest
    needs: quality-gates
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14"
            ansible-core-version: "2.17.*"
            coverage: "false"
          - python-version: "3.14"
            ansible-core-version: "2.18.*"
            coverage: "false"
          - python-version: "3.14"
            ansible-core-version: "2.19.*"
            coverage: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            tox.ini

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "ansible-core==${{ matrix.ansible-core-version }}"

      - name: Run tests
        run: |
          if [ "${{ matrix.coverage }}" = "true" ]; then
            python -m pytest -q --cov=src/prism --cov-report=xml:debug_readmes/coverage.xml --cov-fail-under=70
          else
            python -m pytest -q
          fi

      - name: Generate coverage badge
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.coverage == 'true' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          coverage_xml = Path("debug_readmes/coverage.xml")
          root = ET.parse(coverage_xml).getroot()
          pct = round(float(root.attrib.get("line-rate", "0")) * 100, 1)

          if pct >= 90:
              color = "#4c1"
          elif pct >= 80:
              color = "#97CA00"
          elif pct >= 70:
              color = "#a4a61d"
          elif pct >= 60:
              color = "#dfb317"
          elif pct >= 50:
              color = "#fe7d37"
          else:
              color = "#e05d44"

          label = "coverage"
          message = f"{pct:.1f}%"
          label_width = 74
          message_width = max(40, 10 * len(message) + 10)
          total_width = label_width + message_width

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{total_width}" height="20" role="img" aria-label="{label}: {message}">
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="{total_width}" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="{label_width}" height="20" fill="#555"/>
              <rect x="{label_width}" width="{message_width}" height="20" fill="{color}"/>
              <rect width="{total_width}" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="11">
              <text aria-hidden="true" x="{label_width / 2}" y="15" fill="#010101" fill-opacity=".3">{label}</text>
              <text x="{label_width / 2}" y="14">{label}</text>
              <text aria-hidden="true" x="{label_width + message_width / 2}" y="15" fill="#010101" fill-opacity=".3">{message}</text>
              <text x="{label_width + message_width / 2}" y="14">{message}</text>
            </g>
          </svg>
          '''

          badge_path = Path(".github/badges/coverage.svg")
          badge_path.parent.mkdir(parents=True, exist_ok=True)
          badge_path.write_text(svg, encoding="utf-8")
          PY

      - name: Publish coverage badge
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.coverage == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain .github/badges/coverage.svg)" ]; then
            REPO="${{ github.repository }}"
            BRANCH="badges"
            FILE=".github/badges/coverage.svg"

            if ! gh api "repos/$REPO/git/refs/heads/$BRANCH" > /dev/null 2>&1; then
              MAIN_SHA=$(gh api "repos/$REPO/git/refs/heads/${{ github.ref_name }}" --jq '.object.sha')
              gh api --method POST "repos/$REPO/git/refs" \
                -f "ref=refs/heads/$BRANCH" \
                -f "sha=$MAIN_SHA"
              echo "Created '$BRANCH' branch."
            fi

            FILE_SHA=$(gh api "repos/$REPO/contents/$FILE?ref=$BRANCH" --jq '.sha' 2>/dev/null || echo "")
            CONTENT=$(base64 -w0 "$FILE")

            if [ -n "$FILE_SHA" ]; then
              gh api --method PUT "repos/$REPO/contents/$FILE" \
                -f "message=docs: update coverage badge [skip ci]" \
                -f "content=$CONTENT" \
                -f "sha=$FILE_SHA" \
                -f "branch=$BRANCH"
            else
              gh api --method PUT "repos/$REPO/contents/$FILE" \
                -f "message=docs: update coverage badge [skip ci]" \
                -f "content=$CONTENT" \
                -f "branch=$BRANCH"
            fi
            echo "Coverage badge updated on '$BRANCH' branch."
          else
            echo "Coverage badge already up to date."
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate role docs
        run: |
          prism role src/prism/tests/roles/enhanced_mock_role --fail-on-yaml-like-task-annotations -o README.generated.md
