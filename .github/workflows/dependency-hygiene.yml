name: Dependency Hygiene

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install project and audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Build repo-local audit requirements
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          requirements = [
              *project.get("dependencies", []),
              *project.get("optional-dependencies", {}).get("dev", []),
          ]
          audit_requirements = Path(".local") / "pip-audit-requirements.txt"
          audit_requirements.parent.mkdir(parents=True, exist_ok=True)
          audit_requirements.write_text("\n".join(requirements) + "\n", encoding="utf-8")
          print(audit_requirements)
          PY

      - name: Audit Python dependencies
        run: |
          pip-audit --strict -r .local/pip-audit-requirements.txt
