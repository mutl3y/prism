# Ansible variable discovery ignored identifiers
# These are keywords, builtins, and reserved identifiers that should not be
# treated as user-defined variables during task annotation scanning.

ignored_identifiers:
  - absent
  - always
  - and
  - ansible_facts
  - apt
  - callable
  - changed
  - choices
  - cycler
  - default
  - defaults
  - defined
  - description
