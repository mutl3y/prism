  - example
  - failed
  - false
  - float
  - git
  - groups
  - hostvars
  - in
  - integer
  - inventory_hostname
  - iptables
  - is
  - iterable
  - item
  - joiner
  - key
  - keys
  - lipsum
  - lookup
  - loop
  - loop_var
  - lower
  - mapping
  - msg
  - name
  - names
  - namespace
