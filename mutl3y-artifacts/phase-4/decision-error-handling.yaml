validation_gates:
  - pytest -k "error or exception" src/prism/tests
  - full pytest suite (ensure no regressions)
  - mypy typecheck (exception types should have proper type annotations)
  - ruff check (lint for bare except patterns)

notes: |
  Memory: _RECOVERABLE_PHASE_ERRORS is a tuple[type[Exception], ...] = (PrismRuntimeError,)
  The scanner_context pattern catches broad Exception but immediately narrows via isinstance.
  This is safe but inefficient; move isinstance logic into the except clause type tuple.

  CLI broad except is acceptable because map_top_level_exception_to_exit_code has type dispatch,
  so any Exception that reaches it gets handled gracefully.
