    context: "Top-level CLI command exception handler in main() entry point"
    current_code: "except Exception as exc:"
    decision: NARROW_EXCEPT
    reason: "map_top_level_exception_to_exit_code() is designed to handle specific types: PrismRuntimeError, FileNotFoundError, PermissionError, JSONDecodeError, HTTPError, URLError, OSError. Narrow catch improves debugging and documents expected exception types at CLI boundary."
    exception_types: |
      Narrow to: (PrismRuntimeError, FileNotFoundError, PermissionError,
                  json.JSONDecodeError, HTTPError, URLError, OSError)
      Fallback: Add generic Exception catch after specific types for unforeseen cases.
    criticality: UTILITY_PATH
    blocking_issue: false
    implementation_effort: low

  - finding_id: Scout-ControlFlow-02
