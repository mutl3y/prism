    reason: |
      This is a defensive IO boundary wrapping caller-provided write stream. Narrowing helps identify which IO errors are expected.
      Expected: OSError (file closed, permission denied), TypeError (stream not writable), ValueError (encoding issues), UnicodeDecodeError.
      Fallback broad catch acceptable due to io-boundary pragma, but narrowing improves diagnostics.
    exception_types: "(OSError, TypeError, ValueError, UnicodeError)"
    criticality: OPTIONAL
