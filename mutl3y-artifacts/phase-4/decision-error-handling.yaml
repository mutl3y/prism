    line: 140
    context: "EventBus listener invocation — calls externally-provided listener functions"
    current_code: "except Exception as exc:  # pragma: no cover - defensive"
    decision: ACCEPT_BROAD
    reason: "Broad catch is appropriate because listeners are externally-provided code with unknown exception contracts. Defensive handling is necessary to prevent one failing listener from breaking the event bus. Add diagnostic logging (already present via _record_listener_error and logger.error)."
    exception_types: "Leave broad — defensive boundary code."
    criticality: OPTIONAL
    blocking_issue: false
    implementation_effort: none

