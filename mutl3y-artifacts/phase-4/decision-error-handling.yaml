    line: 354
    context: "Variable discovery execution in _discover_variables() — HOT PATH in scanner_core orchestration"
    current_code: "except Exception as error: ... isinstance(error, _RECOVERABLE_PHASE_ERRORS)"
    decision: NARROW_EXCEPT
    reason: |
      This is on the scanner_core hot path. Current code catches broad Exception but only recovers for PrismRuntimeError (_RECOVERABLE_PHASE_ERRORS). Should narrow to expected exceptions from discovery.discover(): (PrismRuntimeError, ValueError, RuntimeError). Non-recoverable exceptions should propagate immediately without check.
