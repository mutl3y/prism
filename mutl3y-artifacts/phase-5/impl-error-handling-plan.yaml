          logger.error("EventBus listener exception: phase=%s kind=%s listener=%r exc_type=%s exc=%r", ...)
    pseudocode: |
      # Leave broad catch in place; this is a defensive boundary.
      # Listeners are externally-provided code with unknown exception contracts.
      # Add clarifying docstring and update comment to explain the design.
      
      # NO CODE CHANGE — only add or expand comment:
      except Exception as exc:  # pragma: no cover
          # Defensive: catch all exceptions from external listeners to prevent
          # one failing listener from breaking the entire event bus.
          # Listener authors should document their exception contracts,
          # but we don't enforce narrow types here to maximize robustness.
          self._record_listener_error(listener, exc, event)
          logger.error(
              "EventBus listener exception: phase=%s kind=%s listener=%r exc_type=%s exc=%r",
              event.phase_name, event.kind, listener, type(exc).__name__, exc,
          )
          if self._strict:
              raise
    effort_hours: 0.5
    blockers: []
    rationale: |
      OPTIONAL. Defensive boundary intentionally accepts broad exceptions.
      External listeners have unknown exception contracts; narrowing here would be fragile.
      Logging already provides diagnostics (listener identity, exception type, event metadata).
      Decision: document intent via comment; no code change required.
    validation_points:
      - Verify docstring or comment is clear on why broad catch is appropriate
      - Test: listener that raises unexpected exception type (non-standard, custom exception)
      - Ensure _record_listener_error and logger.error calls provide sufficient diagnostics

