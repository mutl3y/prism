    pseudocode: |
      # Narrow to expected exception types from _dispatch_scan_command() and CLI parsing.
      # _map_top_level_exception_to_exit_code() is designed to handle:
      # - PrismRuntimeError (scanner failures)
      # - FileNotFoundError / PermissionError (file system)
      # - json.JSONDecodeError (config parsing)
      # - HTTPError, URLError (network issues)
      # - OSError (generic IO)
      
      import json
      from urllib.error import HTTPError, URLError
      
      except (
          PrismRuntimeError,
          FileNotFoundError,
          PermissionError,
          json.JSONDecodeError,
          HTTPError,
          URLError,
          OSError,
      ) as exc:
          _logger.exception("CLI command %r failed with %s", getattr(args, "command", None), type(exc).__name__)
          print(_format_top_level_exception(exc), file=sys.stderr)
          return _map_top_level_exception_to_exit_code(exc)
      except Exception as exc:  # Unforeseen exceptions
          _logger.exception(
              "CLI command %r failed with unexpected exception type %s",
              getattr(args, "command", None),
              type(exc).__name__,
          )
          print("An unexpected error occurred. Please file a bug report.", file=sys.stderr)
          return _EXIT_CODE_GENERAL_ERROR
    effort_hours: 1.5
    blockers: []
    rationale: |
