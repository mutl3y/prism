  2. Proceed with Wave 2 (CLI parallel): Parallel to Wave 1; low risk. Completes
     facade pattern consistently. Start after Wave 1 foundation. Effort: 2 hours.
  
  3. Optional Wave 3 (Findings 05-06): Low-effort consistency improvements. Can
     defer to follow-up sprint if time-constrained. Recommended for completeness.
