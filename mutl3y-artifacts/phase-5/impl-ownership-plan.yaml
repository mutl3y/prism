risk_assessment:
  CRITICAL_RISKS:
    - scanner_io refactoring: If scanner_io.collection_payload or collection_plugins
      changes signature, api.py breaks. Moving imports to facade isolates this risk.
    - Dual-layer coupling: Direct imports couple API to scanner_io/scanner_reporting.
      Facade pattern breaks this coupling.
  
  MEDIUM_RISKS:
    - Call-site updates: Moving typed wrappers requires updating 10+ call sites in
      api.py. Risk: missed updates cause undefined-name errors. Mitigation: careful
      search/replace + mypy validation.
    - CLI facade creation: New module introduces new public-facing layer. Risk:
      incorrect export signatures. Mitigation: parallel testing with existing cli tests.
  
  LOW_RISKS:
    - Optional improvements (05, 06): Low-effort refactoring with clear rollback.
      Can be deferred safely.

