      python -c "from prism.api_layer import collection; print('OK')" → OK
  
  blocker_cli_audit_completion:
    description: "cli.py violations must be audited in parallel with api.py"
    gate: "CLI parallel violations documented and sequenced"
    verification: |
      All imports from scanner_io in cli.py identified and planned.

