risk_assessment:
  finding_03_high_risk_factors:
    - Circular import pattern (scanner_extract ↔ ansible plugins)
    - 15+ delegation functions must be identified correctly
    - Lazy imports at wrong call site could hide bugs
    mitigation:
      - Pre-identify all delegation patterns before refactoring
      - Run circular dependency detector after refactor
      - Audit pytest coverage for refactored functions

  finding_04_medium_risk_factors:
    - Late-binder identification audit (1-2 call sites expected)
    - Helper function movement could cause import path confusion
    mitigation:
      - Pre-audit all call sites for map_argument_spec_type and variable_extractor_module
      - Use grep to verify count matches expectation
      - Run tests to catch behavioral regressions

acceptance_criteria_final:
  - Both owned files refactored and tested
  - No circular imports introduced
  - Import counts reduced (extract_utils 134→60, variable_discovery 20→14-16)
  - No tests broken
  - All lints pass
  - All types pass
  - Scout-Graph coupling reduction verified
  - Findings 01-02 documented as ACCEPT_PATTERN (no changes)
  - Implementation plan artifact committed with findings

