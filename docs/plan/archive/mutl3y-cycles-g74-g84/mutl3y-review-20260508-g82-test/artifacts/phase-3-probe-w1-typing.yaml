    title: require_prepared_policy() typing could be too broad (object)
    severity: LOW
    mitigation: |
      Consider adding overloads for common policy_name values (task_line_parsing, task_annotation_parsing)
      to provide caller-specific type hints. Deferred to future wave if needed.
  risk_2:
