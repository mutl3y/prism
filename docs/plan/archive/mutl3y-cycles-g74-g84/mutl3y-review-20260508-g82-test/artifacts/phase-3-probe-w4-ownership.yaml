      This is essentially the same root issue: extract layer needs plugin-agnostic interface for traversal
    
    recommended_seam: "scanner_extract/policies/task_traversal_policy.py (Protocol + DI resolver)"
    
    fix_effort: HIGH (same as FIND-O04)
    risk_assessment: "HIGH (same as FIND-O04)"
    
    blockers:
