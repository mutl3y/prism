ready_to_implement:
  - finding_id: FIND-O01
    title: "Plugin-Extract Reverse Dependency (15+ Function Imports)"
    violation: "scanner_plugins/ansible/extract_utils.py imports from 6 scanner_extract modules (task_annotation_parsing, task_catalog_assembly, task_file_traversal, variable_helpers, requirements, discovery)"
    root_cause: "Extract layer is shared/generic, but extract_utils was created to gather functions. Functions still live in extract layer, but are now accessed from plugin layer."
    recommended_fix: |
      **Option A (Preferred): Move extract utilities to extract-owned seam**
      1. Create scanner_extract/shared/extract_api.py to hold canonical Extract API (TypedDict protocols for what plugins need)
      2. Keep extract_utils.py as thin delegation layer in scanner_plugins/ansible (legacy compatibility)
      3. Extract layer owns the canonical function implementations
      4. Plugin layer accesses via clear seam (still live in extract, but canonical boundary established)
      
      **Option B: Move wrapper layer to plugin/shared**
      1. Create scanner_plugins/shared/extract_adapters.py
      2. Move extract_utils logic there (re-exports from extract modules)
      3. All extract module imports centralized in one plugin-owned facade
      4. Clear separation: extract layer stays generic, plugin layer owns adapters
    
    recommended_seam: "scanner_plugins/shared/extract_adapters.py"
    seam_pattern: |
      # scanner_plugins/shared/extract_adapters.py
      """Plugin-layer wrapper for extract utility access - establishes plugin↔extract boundary."""
      __all__ = [
          "extract_task_annotations_for_file",
          "detect_task_module",
          ...rest of 15+ functions...
      ]
      # Re-export with central location for all plugin→extract access
      from prism.scanner_extract.task_annotation_parsing import ...
      from prism.scanner_extract.task_catalog_assembly import ...
      # ... all 6 modules via this one facade
    
    consumers_affected: 4
    affected_modules:
      - scanner_plugins/ansible/feature_detection.py
      - scanner_plugins/ansible/variable_discovery.py
      - scanner_plugins/audit/dynamic_include_audit.py
      - scanner_plugins/ansible/readme_renderer.py
    
    fix_effort: HIGH
    risk_assessment: "MEDIUM - high import count but mostly simple re-exports; test coverage for consumers is essential"
    
    implementation_notes: |
      Step 1: Create scanner_plugins/shared/extract_adapters.py (central facade)
      Step 2: Update all 4 consumers to import from shared/ instead of ansible/extract_utils.py
      Step 3: Keep ansible/extract_utils.py as deprecated re-export for 1-2 cycles (backward compat)
      Step 4: After consumers migrated, delete or fully deprecate ansible/extract_utils.py
      
      Test validation: Verify all 4 consumers still import correctly and unit tests pass

  - finding_id: FIND-O04
    title: "Extract Layer Backward Dependency on Plugin (Ansible Traversal)"
    violation: "scanner_extract/task_file_traversal.py imports expand_include_target_candidates from scanner_plugins.ansible.task_traversal_bare (lines 172, 211)"
    root_cause: "Extract layer iter_task_include_targets() needs Ansible-specific logic for include expansion. Direct import from plugin layer breaks layering."
    recommended_fix: |
      **Refactor to use plugin-registry or DI-based abstraction**
      1. Define TaskTraversalPolicy Protocol in scanner_plugins/interfaces.py
      2. Move expand_include_target_candidates to scanner_extract/policies/task_traversal_policy.py (extract-owned)
      3. Extract layer invokes policy resolver (DI-backed) instead of direct plugin import
      4. Default policy (ansible) registered in DI; future platforms register their own
      
      **Minimal alternative: Extract-owned seam**
      1. Create scanner_extract/shared/platform_traversal.py
      2. Move Ansible-specific logic there (extract owns it)
      3. Inject platform key into extract layer via ScanOptions
      4. Extract layer calls platform_traversal with platform key as parameter
    
    recommended_seam: "scanner_extract/policies/task_traversal_policy.py (DI-backed) or scanner_extract/shared/platform_traversal.py (injection-backed)"
    
    consumers_affected: 2 (internal to extract)
    affected_functions:
      - "iter_task_include_targets()"
      - "_iter_task_include_edges()"
    
    fix_effort: HIGH
    risk_assessment: "HIGH - affects core traversal logic; must preserve Ansible-specific include detection for existing scans"
    
    blocking_reason: "BLOCKS K8s and Terraform expansion. Cannot add new platform without duplicating this seam pattern."
    
    implementation_notes: |
      Step 1: Create TaskTraversalPolicy Protocol (in scanner_plugins/interfaces)
      Step 2: Extract Ansible include expansion logic to extract-owned layer
      Step 3: Update task_file_traversal.py to consume policy via DI instead of direct import
      Step 4: Register AnsibleTaskTraversalPolicy as default in DI
      
      Test validation: Verify iter_task_include_targets() still finds Ansible includes; no regressions in traversal

  - finding_id: FIND-O09
    title: "Missing Platform Abstraction for Task File Traversal"
    violation: "scanner_extract/task_file_traversal.py hard-codes Ansible traversal logic without abstraction for other platforms"
    root_cause: "Extract layer was built for Ansible only. No abstraction exists to support Kubernetes or Terraform traversal."
    recommended_fix: |
