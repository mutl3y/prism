    implementation_notes: |
      This finding is tightly coupled with FIND-O04. Fixing O04 unblocks O09.
      After O04 is fixed (platform-agnostic traversal policy exists), adding K8s/Terraform
      traversal becomes a plugin registration task, not an extract layer change.

