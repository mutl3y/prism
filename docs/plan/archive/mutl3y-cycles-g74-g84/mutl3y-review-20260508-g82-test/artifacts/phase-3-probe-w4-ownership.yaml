recommended_seam_architecture: |
  **Canonical Seam Layer Pattern for W4 Implementation**
  
  Ownership Summary:
  ├─ scanner_extract/ (Extract Utilities)
  │  ├─ shared/ (NEW - Extract-owned canonical seam)
  │  │  └─ platform_traversal.py (Platform-agnostic include expansion)
  │  ├─ task_file_traversal.py (Remove backward dependency on plugins)
  │  └─ ... (other extract modules)
  │
  ├─ scanner_plugins/ (Plugin Layer)
  │  ├─ shared/ (NEW - Plugin-shared adapters and utilities)
  │  │  ├─ extract_adapters.py (Centralize all extract module imports)
  │  │  └─ io_adapters.py (Centralize all IO module imports)
  │  ├─ parsers/ (Parser Plugins)
  │  │  ├─ shared/ (NEW - Error formatting owned by parsers)
  │  │  │  └─ yaml_errors.py (YAML error contract and formatting)
  │  │  └─ yaml/ (Specific YAML parser)
  │  ├─ ansible/ (Ansible Plugin)
  │  │  ├─ shared/ (NEW - Ansible-specific utilities)
  │  │  │  └─ type_mapping.py (Type inference mapping)
  │  │  ├─ extract_utils.py (Deprecated; migrate to shared/extract_adapters.py)
  │  │  └─ ...
  │  └─ interfaces.py (Protocols; might need new TaskTraversalPolicy)
  │
  └─ scanner_io/ (IO Layer - no imports from plugins)

