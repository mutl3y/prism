extensibility_readiness:
  kubernetes_terraform_ready: "partial"

  platform_abstraction: |
    ASSESSMENT: 6/10 — Reserved But Not Ready

    kubernetes/ and terraform/ packages exist as STUBS with classifier/manifest
    exports, but NO PLUGIN IMPLEMENTATIONS.

    WHAT WORKS:
    - Plugin registry can resolve by platform_key (ansible, kubernetes, terraform)
    - DI factory methods use registry to select variable_discovery/feature_detection
      plugins
    - prepare_policy_bundle accepts platform-specific policies

    WHAT DOESN'T:
    - kubernetes and terraform plugins THROW NotImplementedError or return empty
      results. Will cascade into silent "degraded" scans.

    - No platform-specific validation. Can you pass Ansible policies to Kubernetes
      scanner? NOTHING PREVENTS IT. Should validate policy type matches platform.

    - scanner_readme layer HARDCODES ansible renderer resolution. New platforms need
      changes in scanner_readme/guide.py and render.py to add platform checks. NOT
      extensible. Should use registry.

  remaining_gaps_for_platform_expansion: |
    1. VariableDiscoveryPlugin protocol assumes role_path as a filesystem path.
       Kubernetes manifests might be URLs or repo references. Protocol is too narrow.

    2. FeatureDetectionPlugin.detect_features and analyze_task_catalog assume TASK
       concepts. Kubernetes has no "tasks", it has manifests/specs. Plugin interface
       too Ansible-centric.

    3. PreparedTaskLineParsingPolicy has TASK_INCLUDE_KEYS, TASK_BLOCK_KEYS, etc.
       These don't exist for Kubernetes. How does a K8s plugin satisfy this Protocol?
       Returns empty frozenset? Raises NotImplementedError? Unclear contract.

    4. prepared_policy_bundle is a flat dict with task_line, task_annotation, etc.
       keys. Should be a Protocol with platform-specific implementations, not a
       flat structure.

