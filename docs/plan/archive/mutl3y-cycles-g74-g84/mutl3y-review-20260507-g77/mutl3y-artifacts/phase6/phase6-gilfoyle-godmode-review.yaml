architecture_assessment:
  layer_boundaries: |
    SCORE: 7.5/10 — Crisp but Brittle

    The layer boundaries are EXCESSIVELY crisp. I'll give you that — each layer owns
    a specific domain: scanner_core handles orchestration, scanner_extract owns task
    parsing, scanner_plugins manages extensibility, scanner_data owns contracts.

    BUT — and this is a massive "but" — the crispness comes at a cost of massive
    coupling through TypedDict and Protocol definitions. Every layer imports from
    scanner_data/contracts_*.py, making that module a chokepoint. One bad change there
    cascades through the entire codebase.

    The api.py layer introduces PACKAGE-OWNED SEAMS (DIContainer, FeatureDetector,
    ScannerContext subclasses) that exist solely to preserve monkey-patching
    compatibility. That's not architecture, that's a band-aid on top of a band-aid.

  coupling_risks:
    - "scanner_data contracts_request.py is a centralized hub — 47+ types defined;
       imported by every major layer. Single point of architectural failure."
    - "api_layer/collection.py has 50+ parameters in scan_collection(). Parameter
       explosion is a sign of architectural laziness. Should be a builder or config object."
    - "scanner_plugins/defaults.py uses 9 instances of 'Any' typing on fallback_plugin
       and plugin parameters — the escape hatch for type safety failures."
    - "scanner_readme layer imports from scanner_plugins (bootstrap, registry, defaults)
       in circular patterns. plugin_seams.py exists to break circular imports, but that's
       a symptom, not a solution."
    - "scanner_core/task_extract_adapters.py uses _PolicyBackedCollectionProxy and
       _PolicyBackedRegexProxy to access prepared_policy dynamically. Dynamic attribute
       access at runtime is a SMELL. Should be explicit constructor injection."

  seam_integrity: |
    ASSESSMENT: 6/10 — Intentional but Fragile

    The seams are DELIBERATE, which I respect. bootstrap.py, defaults.py, plugin_seams.py
    all exist to manage circular dependencies and isolation concerns.

    PROBLEMS:
    1. Too many seams. You have: bootstrap singleton, plugin_facade wrappers,
       compatibility shims in api.py, DI helpers in di_helpers.py. Each seam is another
       place for bugs to hide.

    2. DI container mutability is unguarded. di.py's clone_scan_options() creates shallow
       copies. If a consumer mutates nested dicts in scan_options, it pollutes the original.
       No freeze() call, no immutability guarantee.

    3. The "prepared_policy_bundle" ownership is SPLIT. scanner_core/scan_request.py
       normalizes it at ingress, but scanner_extract/task_line_parsing.py has RUNTIME
       FALLBACK paths that call require_prepared_policy() with None and expect it to
       magically resolve. That's fail-silent behavior masquerading as defensive programming.

performance:
  inefficiencies_found:
    - "clone_scan_options() is called on EVERY plugin factory invocation. For 20+
       plugins in a collection scan, you're doing 20+ shallow copies of a potentially
       massive dict. No caching, no delta tracking. Wasteful."
    - "PluginRegistry loads plugins via importlib dynamically. No caching of loaded
       modules. If the same plugin is resolved 100 times, it imports 100 times. The
       loaded_plugins cache is per-revision, but revision is incremented on EVERY
       registry snapshot. Inefficient cache invalidation."
    - "scanner_context.py does FULL validation of yaml_parse_failures, role_notes,
       display_variables on EVERY scan. For large roles with 1000+ variables, this
       is O(n) validation that could be deferred or cached."
    - "_PolicyBackedCollectionProxy.__contains__ calls getattr + __current_value on
       EVERY check. No memoization. For task parsing with 100+ task keywords, this
       is repeated attribute resolution."

  memory_concerns:
    - "ScanMetadata is copied 3+ times per scan phase: initial creation, passed to
       kernel orchestrator, copied in output_orchestrator. For large scans with
       verbose metadata, this multiplies memory footprint."
    - "scanner_plugins/registry.py's _PluginRegistryState contains LOADED_PLUGINS dict
       keyed by (module, class) tuples with full class objects as values. No cleanup,
       no GC hints. Class definitions are immortal once loaded."
    - "feature_detector.py and variable_discovery.py CLONE options on EVERY method
       call (_snapshot_options). Two clones per discovery phase = 2x memory overhead
       for no documented benefit."

