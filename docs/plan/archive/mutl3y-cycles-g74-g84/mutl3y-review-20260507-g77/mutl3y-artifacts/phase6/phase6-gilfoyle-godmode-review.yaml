error_handling:
  exception_paths: |
    ASSESSMENT: 6/10 — Inconsistent Rigor

    Exception handling is SCATTERED and INCONSISTENT:

    GOOD:
    - errors.py defines structured error taxonomy (ERROR_CATEGORY_*, error codes)
    - ScanErrorEntry and FailureDetail TypedDicts provide typed error contracts
    - PrismRuntimeError is raised consistently in most paths

    BAD:
    - scanner_plugins/registry.py has validate_plugin_api_version() that raises
      PluginAPIVersionMismatch, but CALLERS don't check. Will cascade into runtime
      failures later if validation is skipped.

    - scanner_core/scanner_context.py's _copy_scan_metadata raises ValueError with
      3 different messages (one per validation check). Should have structured codes,
      not ad-hoc strings.

    - scanner_readme/guide.py logs warnings for missing platform_key but continues
      with default='ansible'. SILENT FALLBACK is a footgun. Should raise.

    - scanner_kernel/orchestrator.py's _validate_process_scan_pipeline_plugin_signature
      tries to validate plugin method signature but SWALLOWS the exception in a
      try/except and logs a warning instead of raising. Plugins with broken signatures
      will fail at runtime, not validation time.

    - scanner_io/emit_output.py's _coerce_metadata_* functions silently convert bad
      types to defaults. A broken metadata field becomes an empty list/dict instead
      of raising. Masks data corruption.

  fail_closed_semantics: |
    ASSESSMENT: 5/10 — Fail-Open Everywhere

    This codebase is FAIL-OPEN by design, which is wrong for a critical scanning tool:

    FAIL-OPEN PATTERNS:
    1. prepare_scan_context normalizes missing prepared_policy_bundle by calling
       scan_request.ensure_prepared_policy_bundle. Fallback at ingress.

    2. task_extract_adapters.py has _PolicyBackedCollectionProxy that calls
       require_prepared_policy(None, ...) — passing None explicitly! That's not
       fail-closed, that's *willfully* opening the floodgates.

    3. scanner_readme/guide.py logs warning for missing platform_key, then defaults
       to 'ansible'. Should REJECT the scan.

    4. scanner_io/emit_output.py coerces corrupted metadata fields to empty
       defaults. Should reject.

    WHAT FAIL-CLOSED LOOKS LIKE:
    - Raise on missing required fields
    - Raise on type mismatches
    - Raise on unrecognized enums
    - No silent defaults
    - No "best effort" mode that silently degrades

    You have NONE of that consistently.

  logging_sufficiency: |
    CRITICAL FINDINGS:
    1. scanner_core/events.py EventBus catches listener exceptions and logs to
       logger.error, but only with repr(listener). If listener crashes, you get
       a useless log message with the function object representation, not a
       traceback. Add exc_info=True.

    2. scanner_plugins/registry.py warnings are issued with warnings.warn() — not
       logged! These won't appear in production logs. Should use logger.warning().

    3. scanner_readme/guide.py and render.py both log.warning for missing
       platform_key in TWO PLACES with IDENTICAL MESSAGES. Copy-paste error. Should
       be a centralized function.

    HIGH FINDINGS:
    4. scanner_core/variable_discovery.py logs "resolving plugin via DI" at DEBUG
       level, but that debug message is INSIDE the lock. If plugin resolution
       deadlocks, you won't see the log. Log BEFORE acquiring lock.

    5. scanner_kernel/orchestrator.py validates plugin signatures and logs warnings
       but doesn't log the actual signature mismatch. Add the actual vs. expected
       signature to the log message.

    MEDIUM FINDINGS:
    6. scanner_plugins/defaults.py has fallback logic that logs a warning when
       _construct_registry_plugin returns None, but doesn't log which plugin was
       being constructed. Add plugin name to the log.

    7. scanner_io/output_orchestrator.py write_concise_scanner_report_if_enabled has
       NO logging. If report writing fails, you get no diagnostics.

control_flow:
  orchestration_clarity: |
    ASSESSMENT: 7/10 — Traceable but Deep

    The orchestration is TRACEABLE if you know where to look:
    1. api.py → api_layer/non_collection.py → scanner_core.run_scan
    2. run_scan → scanner_kernel.orchestrator → kernel_plugin_runner
    3. Plugin execution → scanner_context → feature_detector/variable_discovery
    4. Output → scanner_io/output_orchestrator → scanner_readme/render

    BUT — the DEPTH is problematic. Eight levels of indirection:
    api → api_layer → core → kernel → plugin_runner → context → feature_detector →
    plugin_factory

    Each layer adds abstraction, but WHERE is the actual work? Buried in
    scanner_plugins/ansible or scanner_extract layers. Hard to debug.

    ALSO: scan_payload_helpers.py has _apply_routing_metadata, _build_routing_metadata,
    _merge_metadata_preserving_existing, _merge_routing_metadata. FOUR functions doing
    almost the same thing. That's code smell.

  state_machines: |
    ASSESSMENT: 4/10 — Implicit and Fragile

    There is NO EXPLICIT STATE MACHINE. Scanning follows an implicit sequence:
    1. Preflight (plugin selection via policy_context)
    2. Variable discovery
    3. Feature detection
    4. Output rendering
    5. Metadata merging

    BUT — there's no state enum, no validation of valid transitions, no rollback
    capability. If variable discovery fails, what happens? Does feature detection
    still run? Check scanner_context.py:

      try:
          self._run_feature_detector()
          self._run_variable_discovery()
      except PrismRuntimeError as exc:
          self._collect_phase_error(...)

    It catches errors and CONTINUES. That's not a state machine, that's "hope nothing
    breaks in the next phase."

    You need:
    - Explicit state enum (PREFLIGHT, DISCOVERY, DETECTION, RENDERING, COMPLETE, FAILED)
    - Transition validation
    - Rollback handlers
    - Phase isolation (FAIL state prevents subsequent phases)

  edge_cases: |
    CONCERNS:
    1. What if prepared_policy_bundle is None? ANSWERED: fail-open, fallback to
       late resolver. Dumb.

    2. What if a plugin returns empty results? ANSWERED: continues anyway, metadata
       notes "degraded" flag. What if downstream code expects non-empty results?
       Crash at runtime.

    3. What if two plugins register with the same name? ANSWERED: registry silently
       overwrites. Last-one-wins. Should reject as conflict.

    4. What if a scan_option key is missing? ANSWERED: validator in scan_request.py
       checks _REQUIRED_SCAN_OPTION_KEYS, but only if validate_scan_options() is
       called. CALLERS might skip it. Should validate at ingress automatically.

    5. What if role_path exists but is not readable? ANSWERED: FileNotFoundError
       caught in api_layer/collection.py, converted to CollectionFailureRecord. Works,
       but no retry logic, no permission-denied diagnostics.

    6. Thread safety of PluginRegistry: _DEFAULT_REGISTRY is protected by
       _DEFAULT_REGISTRY_INIT_LOCK, but EXISTING registry methods (get_scan_pipeline_plugin,
       etc.) are NOT thread-safe. Multiple threads modifying registry simultaneously = race.

