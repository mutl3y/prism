    4. Error path is implicit, untested, and FRAGILE

    FIX:
    - Remove module-level proxies
    - Pass PreparedTaskLineParsingPolicy as constructor argument to parsers
    - Validate policy exists at scanner_context init, not parse time
    - Make error path EXPLICIT and TESTED

  high_severity:
