detailed_notes:
  scanner_core_orchestration: |
    scanner_core/scan_request.py:build_run_scan_options_canonical does HALF the work
    of option normalization. scanner_context.py does the OTHER HALF. Split responsibility.
    Should be ALL in scan_request or ALL in scanner_context, not both.

  plugin_registry_architecture: |
    _DEFAULT_REGISTRY singleton with lazy init is fine, but get_default_plugin_registry()
    should be a module-level function, not bootstrap.py wrapper. Extra indirection adds
    no value.

  collection_scanning_flow: |
    api_layer/collection.py:scan_collection iterates roles and calls scan_role_fn for
    each. That callable comes from non_collection.py. The threading is implicit.
    Document it. Add a @dataclass to hold the callback instead of raw Callable.

