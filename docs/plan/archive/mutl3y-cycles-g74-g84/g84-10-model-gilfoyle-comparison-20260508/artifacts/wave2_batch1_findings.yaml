- id: GILF-NODE3-04
  severity: HIGH
  category: event-reliability
  location: events.py:109-128 (emit method, strict mode)
  issue: EventBus strict mode breaks event delivery contract. When strict=True and
    listener N fails, listeners N+1 onward never receive the event. Partial delivery
    violates pub/sub semantics.
  root_cause: 'Line 119-128: The listener loop catches exceptions, logs, records,
    and then `if self._strict: raise`. Re-raising stops the loop. Subsequent listeners
    in `listeners_snapshot` are never invoked.'
  impact: 'Observability loss. If listener A logs metrics, listener B records diagnostics,
    listener C updates state, and listener B fails in strict mode, listener C never
    runs. The failure of one observer breaks all downstream observers. Violates the
    isolation guarantee of pub/sub: observers should be independent. Strict mode makes
    observers non-independent.'
  confidence: 100
  fix_suggestion: "HIGH-PRIORITY FIX (30 min): Strict mode should collect all exceptions\
    \ and raise an aggregate exception after all listeners run, not stop the loop\
    \ early. Or document that strict mode breaks delivery and is only for testing.\
    \ Or remove strict mode entirely\u2014event buses should be fail-safe, not fail-fast.\
    \ The current behavior is a reliability landmine."
  source_file: tier2-sonnet45-node3-findings.yaml
- id: GILF-NODE3-05
  severity: HIGH
