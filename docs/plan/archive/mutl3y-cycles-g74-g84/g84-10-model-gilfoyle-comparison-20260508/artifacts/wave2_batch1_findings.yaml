  confidence: 95
  fix_suggestion: 'Use a robust defensive copy strategy: either `copy.deepcopy` (with
    care for performance) or a serialization round-trip (JSON/MessagePack) for cache
    boundaries. For non-serializable domain objects, require a `get_state_fingerprint()`
    or provide explicit serializer hooks. In `build_run_scan_options_canonical`, deep-copy
    incoming lists/dicts (or freeze them) before placing into the returned options.'
  source_file: tier0-gpt5m-node3-findings.yaml
- id: GILF-NODE3-01
  severity: HIGH
  category: cache-safety
  location: '[src/prism/scanner_core/scan_cache.py:30-110]'
  issue: "No TTL or byte-size eviction \u2014 only entry-count LRU"
  root_cause: InMemoryLRUScanCache only limits entries by count (`maxsize`) and never
    evicts based on age or value size.
  impact: Large scan results (or many large entries) can exhaust process memory despite
    LRU count limits; long-lived stale entries remain until evicted by count pressure.
  confidence: 95
  fix_suggestion: Add optional TTL per-entry and/or a byte-size budget. Implement
    time-based expiry and an LRU that accounts for value size (bytes). Consider background
    maintenance thread or lazy expiry on access to avoid long pause events.
  source_file: tier0-gpt5m-node3-findings.yaml
