model_used: GPT-5 mini
findings:
  - id: GILF-NODE1-01
    severity: HIGH
    category: type-safety
    location: "[src/prism/scanner_core/di.py:1-120]"
    issue: "Unchecked cast() and TypedDict identity loss when cloning scan options"
    root_cause: "`clone_scan_options` builds a plain dict and uses `cast(ScanOptionsDict, ...)` to declare typed identity; many factories then consume that dict assuming TypedDict contracts without runtime validation."
    impact: "Silent type contract violations, loss of TypedDict shape guarantees, and downstream code may rely on TypedDict identity (or typed keys) which can be lost — leads to runtime KeyError/ValueError and brittle checks."
    confidence: 95
    fix_suggestion: "Avoid broad `cast(...)` shortcuts. Validate/construct a `ScanOptionsDict` explicitly (schema-check or dataclass factory) or create helper that performs runtime validation when cloning; preserve TypedDict-like construction instead of blind cast."

  - id: GILF-NODE1-02
    severity: HIGH
    category: architecture
    location: "[src/prism/scanner_core/di.py:120-320]"
    issue: "DIContainer is a god-object with mixed responsibilities"
    root_cause: "DIContainer owns platform resolution, caching, mock injection, event bus wiring, plugin construction, blocker building and scanner-context wiring — many cross-cutting concerns concentrated in one mutable instance."
    impact: "High coupling, hard-to-test surface, hidden runtime side effects (cache/mocks), and composes circular-dependency workarounds into runtime factory code; makes refactors risky and review-intensive."
    confidence: 98
    fix_suggestion: "Split responsibilities: separate a thin immutable composition root (registrations, wiring) from run-time instance-holder (caches, mocks). Expose small Protocols for consumers; move platform-key resolution and blocker-factory resolution to separate helper/service classes."

  - id: GILF-NODE1-03
    severity: HIGH
    category: lazy-imports|circular-deps
    location: "[src/prism/scanner_core/di.py:1-240]"
    issue: "Widespread deferred imports to hide circular dependencies"
    root_cause: "Factory helpers defer imports (e.g., FeatureDetector, VariableDiscovery) to runtime to avoid import-time cycles instead of resolving architectural layering."
    impact: "Load-order coupling is masked rather than solved — can produce surprising runtime errors, hides real layering violations, and complicates static analysis and type-checking."
    confidence: 96
    fix_suggestion: "Introduce clearer module boundaries / interface modules (protocols) so concrete implementations can live in plugin modules. Prefer inversion-of-control at module import time (small registry or entrypoint) instead of ad-hoc deferred imports."

  - id: GILF-NODE1-04
    severity: MEDIUM
    category: ownership
    location: "[src/prism/scanner_core/scanner_context.py:1-220]"
    issue: "Split prepared-policy ownership and duplicate readiness checks"
    root_cause: "Prepared policy bundle is validated in multiple places: `ScannerContext.__init__` may accept pre-built bundle but `orchestrate_scan` calls `_require_prepared_policy_bundle(self._scan_options)` — also di_helpers provides helpers to fetch prepared policies, creating multiple owners of readiness."
    impact: "Confusion about who must prepare/normalize the policy bundle; duplicate validation code and inconsistent error types lead to inconsistent fail-open vs fail-closed behavior across callsites."
    confidence: 94
    fix_suggestion: "Consolidate prepared-policy ownership: define a single preparation and normalization seam (one function) that is called once before DI composition. Replace ad-hoc checks with a clear contract (Protocol) and document who must provide `prepared_policy_bundle`."

  - id: GILF-NODE1-05
    severity: MEDIUM
    category: error-handling
    location: "[src/prism/scanner_core/scanner_context.py:220-460]"
    issue: "Inconsistent exception styles and recoverable failure handling"
    root_cause: "Phase errors are caught selectively (PrismRuntimeError, ValueError, RuntimeError, TypeError) and either re-raised or turned into warnings depending on `_strict_phase_failures`; `_RECOVERABLE_PHASE_ERRORS` is defined but unused."
    impact: "Behavior depends on configuration flags; inconsistent wrapping means callers may not get uniform error metadata. Silent continuation (best-effort) can hide regressions during CI, while re-raise paths may leak implementation exceptions unwrapped."
    confidence: 92
    fix_suggestion: "Standardize an explicit error contract: use a small hierarchy or wrapper (e.g., PrismPhaseError) that always preserves original exception via `from` chaining; use `_RECOVERABLE_PHASE_ERRORS` consistently or remove it. Make strict_mode an explicit, documented input to the orchestrator."

  - id: GILF-NODE1-06
    severity: MEDIUM
    category: testability
    location: "[src/prism/scanner_core/di.py:160-320]"
    issue: "Brittle test hooks: string-keyed `inject_mock` and factory_overrides"
    root_cause: "Mocks and overrides are injected via string keys (`'variable_discovery'`, `'feature_detector'`, etc.). Tests must know magic key names and internal caching behavior to reliably replace components."
    impact: "High cognitive load for tests, risk of subtle cache vs mock ordering bugs, and brittle tests that couple to DI internals rather than public protocols."
    confidence: 93
    fix_suggestion: "Expose explicit, typed test seam APIs: `set_factory(name: Literal[...], factory: Callable)` or better, accept protocol-typed override objects. Provide clear lifecycle methods to register test doubles and atomically clear caches when swapping."

  - id: GILF-NODE1-07
    severity: LOW
    category: performance
    location: "[src/prism/scanner_core/di.py:1-120]"
    issue: "Deep cloning of scan options on every snapshot may be expensive"
    root_cause: "`clone_scan_options` recursively reconstructs container structures on every snapshot/replace, and `factory_*` methods call `_snapshot_scan_options()` frequently under lock."
    impact: "Potential CPU/memory pressure for large scan_options (policy bundles, lists). Locking plus deep-clone on hot paths may reduce throughput for bulk scans."
    confidence: 85
    fix_suggestion: "Avoid full deep-clone on every snapshot; use copy-on-write semantics, immutable-semantics wrapper, or narrow the clone to only keys that need isolation. Document cost and provide opt-out for performance-sensitive callers."

  - id: GILF-NODE1-08
    severity: MEDIUM
    category: type-safety
    location: "[src/prism/scanner_core/di_helpers.py:1-240]"
    issue: "Protocols use `runtime_checkable` but return types are loosely typed"
    root_cause: "`HasScanOptions.scan_options` typed as `dict[str, Any]` and `HasEventBusFactory.factory_event_bus` returns `EventBusProtocol | None` — callers then assume dict shapes or call `.phase(...)` without robust validation."
    impact: "Protocol checks via `isinstance(protocol)` will pass but not guarantee required runtime behavior (shape/keys), leading to subtle runtime errors in downstream consumers."
    confidence: 90
    fix_suggestion: "Tighten protocol signatures to reflect true shapes (e.g., expose `get_prepared_policy(name)`), add runtime validators for critical keys, and prefer explicit adapter objects over generic dicts when strong contracts are required."

  - id: GILF-NODE1-09
    severity: LOW
    category: lazy-imports
    location: "[src/prism/scanner_core/scanner_context.py:1-120]"
    issue: "Fallback policy normalizations duplicated across modules"
    root_cause: "ScannerContext and di_helpers duplicate policy/scan_options normalization checks (`_require_prepared_policy_bundle`, `get_prepared_policy_or_none`), indicating normalization responsibilities are scattered."
    impact: "Duplication increases maintenance cost and risk of inconsistent normalization behavior when policies evolve."
    confidence: 88
    fix_suggestion: "Centralize policy normalization and accessors in a small `policy_registry` or `policy_adapter` service used by both DI and ScannerContext; remove duplicate helper functions."

  - id: GILF-NODE1-10
    severity: MEDIUM
    category: error-handling
    location: "[src/prism/scanner_core/di.py:1-320]"
    issue: "Mixed error types from DI (ValueError vs PrismRuntimeError) complicate callers' handling"
    root_cause: "DI uses `ValueError` for missing registry/plugins/platform keys while plugin construction and runtime errors raise `PrismRuntimeError`."
    impact: "Callers that only catch PrismRuntimeError may miss DI misconfiguration errors; inconsistent error classification complicates retry and instrumentation semantics."
    confidence: 90
    fix_suggestion: "Normalize DI exceptions: raise domain-specific exceptions (e.g., `DIConfigurationError`, `PluginNotFoundError`) that subclass a common `DIError` or `PrismRuntimeError` so callers can unify handling and instrumentation."
