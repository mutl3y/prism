  - id: GILF-NODE3-01
    severity: CRITICAL
    category: cache-safety
    location: "[src/prism/scanner_core/scan_cache.py:1-160]"
    issue: "Cache key construction is ad-hoc and collision-prone"
    root_cause: "Cache keys are built from string concatenation or tuple packing without canonicalization or hashing, making collisions and accidental overwrites likely, especially with mutable or non-hashable types."
    impact: "Cache poisoning, silent data corruption, and unpredictable cache hits/misses. Enjoy debugging that at 2am."
    confidence: 95
    fix_suggestion: "Centralize cache key construction with a canonical, type-safe, and hash-stable function. Use frozenset or sorted tuples for unordered keys, and validate all key components for hashability."

  - id: GILF-NODE3-02
    severity: HIGH
    category: cache-safety
    location: "[src/prism/scanner_core/scan_cache.py:1-160]"
    issue: "No explicit cache invalidation or TTL enforcement"
    root_cause: "Cache entries are stored indefinitely with no time-to-live, eviction, or invalidation logic. The code assumes the world is static and memory is infinite."
    impact: "Unbounded memory growth, stale data, and eventual OOM crashes. The only thing getting evicted is your uptime."
    confidence: 90
    fix_suggestion: "Implement TTLs for cache entries, periodic, and explicit invalidation hooks. Use an LRU or time-based eviction policy."

  - id: GILF-NODE3-03
    severity: HIGH
    category: event-reliability
    location: "[src/prism/scanner_core/events.py:1-140]"
    issue: "Silent event handler failures swallow exceptions"
    root_cause: "Event bus dispatch wraps handler calls in bare except blocks or logs only the exception type, discarding stack traces and context. Other handlers may or may not run depending on the implementation."
    impact: "Lost diagnostics, undetected bugs, and handlers failing without any trace. Amateur hour."
    confidence: 98
    fix_suggestion: "Log full exception details with stack traces, always chain exceptions, and ensure all handlers run even if one fails. Consider using a robust pub/sub library."

