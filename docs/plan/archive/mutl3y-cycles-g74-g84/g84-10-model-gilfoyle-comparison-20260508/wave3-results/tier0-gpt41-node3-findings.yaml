    location: "[src/prism/scanner_core/scan_request.py:1-380]"
    issue: "Shallow copies of request and metadata objects risk shared mutable state"
    root_cause: "Copy operations use dict() or copy.copy(), which do not deep-copy nested structures. TypedDicts lose type info, and mutable subfields are aliased."
