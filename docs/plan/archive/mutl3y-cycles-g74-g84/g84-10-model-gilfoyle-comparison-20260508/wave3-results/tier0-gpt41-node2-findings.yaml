    fix_suggestion: "Index variables and tasks by relevant keys. Use set/dict lookups instead of repeated linear scans."

  - id: GILF-NODE2-07
    severity: MEDIUM
    category: caching
    location: "[feature_detector.py:1-320]"
    issue: "No cache invalidation or TTL"
    root_cause: "Caches are populated but never invalidated or expired. Stale data is forever data, apparently."
    impact: "Results become outdated, especially in long-running processes or daemonized environments. Enjoy your cache poisoning."
    confidence: 80
    fix_suggestion: "Implement TTL or explicit invalidation hooks. At least pretend to care about cache freshness."

  - id: GILF-NODE2-08
