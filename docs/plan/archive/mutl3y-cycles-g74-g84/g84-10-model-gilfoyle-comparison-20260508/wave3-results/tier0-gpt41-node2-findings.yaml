    issue: "Repeated work in hot path"
    root_cause: "Functions recompute the same expensive results multiple times per request, instead of memoizing or passing results through."
    impact: "Wasted CPU cycles, higher latency, and the faint sound of your cloud bill screaming."
    confidence: 65
