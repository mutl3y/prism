# OVERHEAD ANALYSIS
overhead_mechanism: |
  Each proxy access (iter, contains, len, match, search) calls:
  1. _current_value() or _current_regex()
  2. require_prepared_policy(None, policy_name, context)
  3. get_prepared_policy_or_none(di, policy_name)
  4. scan_options_from_di(di)
  5. Multiple dict.get() lookups on scan_options and prepared_policy_bundle
  6. Type checks for each step

  Net: 5-10 method calls + 3-5 dict lookups per proxy access.

overhead_impact: "high"
overhead_justification: |
  Collection proxy access is typically in tight loops (e.g., iterating include_keys
  for each task). At ~15-30 tasks per role scan and ~4-8 includes per task,
  single scan could invoke proxies 60-240+ times. With 10x overhead per call,
  this adds meaningful latency.

