# RISK ASSESSMENT
risks:
  - risk_id: "RISK-001"
    title: "Dynamic policy resolution failure mode"
    severity: "medium"
    description: |
      Proxies mask policy unavailability until access time. Direct callers will
      fail at call site rather than at policy assembly time. Could make debugging
      harder if prepared_policy_bundle is malformed.
    mitigation: "Validation layer in require_prepared_policy can log earlier failures"

  - risk_id: "RISK-002"
    title: "Undocumented call frequency"
    severity: "low"
    description: |
      Exact runtime call count for proxies is difficult to measure without
      instrumentation. Overhead estimate (high) is based on pattern analysis,
      not profiling. Actual impact may be lower if calls are less frequent than estimated.
    mitigation: "Profile run_scan with instrumentation before committing to fix priority"

# RECOMMENDATION
