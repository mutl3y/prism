## Comparison to Original Wave 2 Failure
**Original (FAILED)**:
- Tried to instantiate PreparedPolicyBundle (a TypedDict)
- Failed at module load: `'dict' object has no attribute 'TASK_INCLUDE_KEYS'`
- Broke 86 tests

**Revised (Approach C)**:
- Create PolicyConstants dataclass (instantiable)
- Initialize after prepared_policy_bundle is available
- Store in per-scan ScanContext
- Eliminates all overhead without architectural breaks
- Verified thread-safe, cross-scan isolated
