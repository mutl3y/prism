## Wave 2 Revised Implementation Strategy

### Finding: CRITICAL Policy-Backed Proxy Overhead
From God Mode review + swarm investigation:
- Proxies introduce runtime overhead via repeated `require_prepared_policy()` calls
- Module-level proxies are dead code (only test usage)
- Real hotpath: task_catalog_assembly.py calls require_prepared_policy(di, ...) 150-300 times per large scan
- Overhead: 4.7µs × 150-300 calls = 7-14ms per collection scan

### Solution: Static Factory Pattern
Deploy `PolicyConstants` factory that:
1. Resolves all policy constants once per scan at initialization
2. Stores results in per-scan ScanContext (thread-safe, isolated)
3. Eliminates repeated hotpath lookups
4. Enables future proxy removal

