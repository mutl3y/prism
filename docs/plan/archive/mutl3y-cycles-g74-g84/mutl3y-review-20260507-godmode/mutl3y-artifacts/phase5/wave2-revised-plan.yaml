## Risk Mitigation
| Risk | Mitigation |
|------|-----------|
| Cross-scan cache poison | ScanContext is per-scan; PolicyConstants is immutable dataclass (frozen=True) |
| Bootstrap ordering | Initialize after ensure_prepared_policy_bundle (natural init point) |
| Thread safety | Each scan owns ScannerContext instance; no shared mutable state |
| Hotpath identification | Grep for require_prepared_policy calls; audit each one |
| Type safety | Use TypedDict or frozen dataclass; add mypy validation |

