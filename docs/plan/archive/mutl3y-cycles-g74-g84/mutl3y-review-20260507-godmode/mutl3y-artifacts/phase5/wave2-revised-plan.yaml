## Implementation Phases

### Phase 1: Factory Scaffolding (~4 hours)
**Subtask 1a**: Create PolicyConstants dataclass
```python
# src/prism/scanner_data/policy_constants.py
from typing import Collection
import re

@dataclass(frozen=True)
class PolicyConstants:
    """Pre-resolved policy constants for a scan."""
    task_include_keys: Collection[str]
    role_include_keys: Collection[str]
    include_vars_keys: Collection[str]
    set_fact_keys: Collection[str]
    task_block_keys: Collection[str]
    task_meta_keys: Collection[str]
    # Regex patterns (6 total)
    ...
```

**Subtask 1b**: Create factory function
```python
def build_policy_constants(prepared_policy_bundle) -> PolicyConstants:
    """Resolve all policy constants from bundle."""
    return PolicyConstants(
        task_include_keys=prepared_policy_bundle.TASK_INCLUDE_KEYS,
        role_include_keys=prepared_policy_bundle.ROLE_INCLUDE_KEYS,
        ...
    )
```

**Subtask 1c**: Add to ScannerContext
```python
class ScannerContext:
    ...
    policy_constants: PolicyConstants

    def __init__(self, ..., prepared_policy_bundle=None):
        ...
        if prepared_policy_bundle:
            self.policy_constants = build_policy_constants(prepared_policy_bundle)
        else:
            self.policy_constants = PolicyConstants(...)  # defaults or error
```

