## Critical Risk: Cross-Scan Cache Poisoning

### Scenario: Multi-Platform Expansion (Kubernetes + Ansible)
```
Process Start
├─ Ansible scan starts: prepared_policy_bundle["task_line_parsing"] = AnsiblePolicy
│  ├─ First access to module proxy TASK_INCLUDE_KEYS
│  ├─ @cached_property computes {"include_tasks", "import_tasks"}
│  └─ Caches in module singleton (persists forever)
│
├─ Kubernetes scan starts: prepared_policy_bundle["task_line_parsing"] = K8sPolicy
│  ├─ Access to module proxy TASK_INCLUDE_KEYS
│  ├─ @cached_property cache HIT (no recompute!)
│  ├─ Returns {"include_tasks", "import_tasks"} (WRONG for K8s!)
│  └─ K8s scan processes with Ansible constants → SILENT DATA CORRUPTION
│
└─ User sees K8s results that were filtered/processed with Ansible policies
   (No error, audit trail is incorrect, findings may be missed or incorrectly flagged)
```

### Why This is NOT Just a "Niche Edge Case":
1. **Prism supports multi-platform**: Kubernetes and Terraform expansion is planned
2. **Concurrent scans are common**: API layer runs multiple scans per request
3. **Silent corruption**: No exception, no log entry, just wrong results
4. **Audit nightmare**: Results appear valid but use wrong policy

