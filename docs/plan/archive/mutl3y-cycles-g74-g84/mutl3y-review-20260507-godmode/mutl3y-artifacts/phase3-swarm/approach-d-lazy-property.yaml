## Executive Summary
Lazy property decorators offer tempting simplicity: replace proxy call-every-time pattern with
@cached_property to cache policy lookups. However, investigation reveals a CRITICAL BLOCKER:
module-level proxy singletons with @cached_property create cross-scan cache poisoning.
The first scan to access a module proxy caches its prepared_policy_bundle values; all
subsequent scans reuse that cached value, breaking multi-scan isolation. Approach D is
HIGH RISK for concurrent scans and NOT RECOMMENDED.

---
## Question 1: Are Proxy Objects Module-Singletons (Created Once Per Import)?
### Finding: YES — Module-singletons created at import time ✓
**Evidence:**
```python
# task_line_parsing.py lines 74-79 (module scope)
TASK_INCLUDE_KEYS: Collection[str] = _PolicyBackedCollectionProxy("TASK_INCLUDE_KEYS")
ROLE_INCLUDE_KEYS: Collection[str] = _PolicyBackedCollectionProxy("ROLE_INCLUDE_KEYS")
INCLUDE_VARS_KEYS: Collection[str] = _PolicyBackedCollectionProxy("INCLUDE_VARS_KEYS")
SET_FACT_KEYS: Collection[str] = _PolicyBackedCollectionProxy("SET_FACT_KEYS")
TASK_BLOCK_KEYS: Collection[str] = _PolicyBackedCollectionProxy("TASK_BLOCK_KEYS")
TASK_META_KEYS: Collection[str] = _PolicyBackedCollectionProxy("TASK_META_KEYS")
```

```python
# task_line_parsing.py lines 186-187 (module scope)
ROLE_NOTES_RE = _PolicyBackedMarkerLineRegexProxy()
TASK_NOTES_LONG_RE = _PolicyBackedMarkerLineRegexProxy()
```

```python
# task_line_parsing.py lines 220-224 (module scope)
COMMENT_CONTINUATION_RE = _PolicyBackedAnnotationRegexProxy("COMMENT_CONTINUATION_RE")
TASK_ENTRY_RE = _PolicyBackedAnnotationRegexProxy("TASK_ENTRY_RE")
```

**Key Facts:**
- TOTAL: 10 module-singleton proxy instances (6 collection + 2 marker-line + 2 annotation)
- Lifecycle: Created once at module import, shared across all imports of this module
- Lifespan: Process lifetime (never garbage collected unless process exits)
- Identity: Same object instance for all callers (`id(TASK_INCLUDE_KEYS)` is identical)

### Conclusion: **YES — Module-singletons are correct; they persist per-process**

