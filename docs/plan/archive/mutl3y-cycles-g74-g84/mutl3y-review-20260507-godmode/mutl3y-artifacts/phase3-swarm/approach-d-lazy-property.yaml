| **Feasibility** | MEDIUM | cached_property works technically, but cross-scan cache poisoning is a showstopper |
| **Performance** | MEDIUM | Caches per-access, but only helps if module proxies are used (they're not on hotpath) |
| **Code complexity** | LOW | Simple 2-line decorator swap |
| **Bootstrap coupling** | NONE | No additional coupling; uses existing None DI pattern |
| **Thread safety (single scan)** | HIGH ✓ | cached_property handles concurrent threads within one scan |
| **Thread safety (multi-scan)** | LOW ✗ | Cross-scan cache poisoning makes this UNSAFE for concurrent scans |
| **Per-scan isolation** | CRITICAL BLOCKER ✗ | Module singleton cache persists across scans; breaks multi-scan guarantees |
| **Test compatibility** | MEDIUM | Tests still fail with None DI (cached_property doesn't fix root cause) |
| **Production hotpath benefit** | ZERO | Module proxies are dead code; production uses require_prepared_policy directly |
| **Architectural improvement** | NEGATIVE | Hides cross-scan isolation bug; makes problem harder to debug |

### Implementation (Hypothetical, NOT Recommended)
**Task 1: Add cached_property decorator**
```python
# task_line_parsing.py
from functools import cached_property

class _PolicyBackedCollectionProxy:
    @cached_property
    def _current_value(self) -> object:  # First access → computes & caches
        return getattr(
            require_prepared_policy(None, "task_line_parsing", "task_line_parsing"),
            self._policy_attr_name,
        )
```

**Task 2: Result**
- Scan 1 accesses TASK_INCLUDE_KEYS: cache miss → compute & cache
- Scan 2 accesses TASK_INCLUDE_KEYS: cache HIT → wrong values
- Concurrent scans with different policies: data corruption (silent)

