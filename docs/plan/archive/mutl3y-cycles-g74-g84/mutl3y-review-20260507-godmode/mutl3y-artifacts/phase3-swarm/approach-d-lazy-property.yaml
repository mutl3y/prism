## Question 3: Thread-Safety: Does cached_property Handle Concurrent Access?
### Finding: YES for per-instance caching; NO for module-singleton cross-scan interference ✗
**stdlib cached_property Thread-Safety:**
```python
# functools.cached_property (Python 3.8+)
# Uses object.__dict__ assignment (atomic in CPython due to GIL)
# Multiple threads accessing same property are safe from cache corruption
# First thread to complete __compute sets the cached value
# Subsequent threads read the cached value
```

**Thread-Safety Verdict: SAFE for single-property access ✓**

**BUT: CRITICAL BLOCKER — Module Singleton Cache Poisoning**
**Cross-Scan Isolation is BROKEN:**

Module proxies are singletons (created once at import time). If cached_property is used:

```timeline
Scan A (prepared_policy_bundle = {"task_line_parsing": AnsiblePolicy})
├─ Thread 1: First access to TASK_INCLUDE_KEYS
│  ├─ Cache miss → compute via require_prepared_policy
│  ├─ Gets {"include_tasks", "import_tasks"} from AnsiblePolicy
│  └─ Caches result in module proxy instance (forever)
│
Scan B (prepared_policy_bundle = {"task_line_parsing": CustomPolicy})
├─ Thread 2: Access to TASK_INCLUDE_KEYS
│  ├─ Cache HIT → returns cached {"include_tasks", "import_tasks"}
│  ├─ WRONG! Should return {"custom_include", "custom_import"}
│  └─ BUG: Scan B gets Scan A's policy constants
```

**Why cached_property Cannot Invalidate Across Scans:**
1. Module singleton persists across scans (process lifetime)
2. cached_property caches on the instance: `instance.__dict__['_current_value'] = result`
3. Cache is NEVER cleared (no lifecycle hook to invalidate between scans)
4. Thread-safety for single thread is not same as cross-thread safety with different policies

**Example Attack Scenario (Concurrent Scans):**
```python
# Process setup: Single module proxy instance
from prism.scanner_extract.task_line_parsing import TASK_INCLUDE_KEYS
# TASK_INCLUDE_KEYS is ONE instance, shared across all concurrent access

# Concurrent execution:
def scan_1():
    for key in TASK_INCLUDE_KEYS:  # Cache miss → fetch Scan 1 policy → cache
        if "include_tasks" in TASK_INCLUDE_KEYS:  # Cache HIT
            process_include(key)

def scan_2():
    time.sleep(0.01)  # Ensure Scan 1 caches first
    for key in TASK_INCLUDE_KEYS:  # Cache HIT → returns Scan 1's cached result
        if "include_tasks" in TASK_INCLUDE_KEYS:  # WRONG POLICY!
            process_include(key)  # BUG: Processes using Scan 1's policy

# Result: Scan 2 silently uses Scan 1's policy constants (no error)
```

### Conclusion: **PARTIALLY YES for single property, but CRITICAL NO for cross-scan isolation**

