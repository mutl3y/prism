## Question 2: Would cached_property Work Correctly With None DI Parameter?
### Finding: NO — None DI fails; cached_property does not solve this ✗
**Evidence:**
Proxy methods call `require_prepared_policy(None, ...)` with di=None. Testing access:
```python
# Actual test run:
from prism.scanner_extract.task_line_parsing import TASK_INCLUDE_KEYS
for key in TASK_INCLUDE_KEYS:  # Attempt to iterate
    print(f'Found: {key}')

# Result:
# ERROR: prepared_policy_bundle.task_line_parsing must be provided before
# task_line_parsing canonical execution
```

**Why None DI Fails:**
```python
# scanner_core/di_helpers.py
def get_prepared_policy_or_none(di: object | None, policy_name: str) -> object | None:
    scan_options = scan_options_from_di(di)  # di=None -> returns None immediately
    if not isinstance(scan_options, dict):
        return None  # Early exit
    prepared_policy_bundle = scan_options.get("prepared_policy_bundle")  # Never reached
    ...

def scan_options_from_di(di: object | None = None) -> dict[str, object] | None:
    if di is None:
        _logger.debug("scan_options_from_di: di is None; returning None")
        return None  # di=None = immediate fail
    ...
```

**How Production Code Avoids This:**
- Production hotpath (task_catalog_assembly.py) NEVER uses module proxies
- Production calls `require_prepared_policy(di, ...)` where di is a valid DIContainer
- Module proxies are ONLY accessed in tests, where they fail without special setup

**cached_property Does NOT Fix This:**
```python
# Hypothetical with cached_property:
class _PolicyBackedCollectionProxy:
    @cached_property
    def _current_value(self) -> object:
        return getattr(
            require_prepared_policy(None, "task_line_parsing", "task_line_parsing"),
            # ^^^ Still calls require_prepared_policy(None, ...) which fails!
            self._policy_attr_name,
        )
```

**Result:** cached_property caches the FAILURE, not the success. First access raises ValueError,
and the exception is cached (then re-raised on all subsequent accesses per instance).

### Conclusion: **NO — cached_property does not solve the None DI problem; module proxies fundamentally require valid DI**

