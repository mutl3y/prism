## Why Approach D Fails Where Others Succeed

**Approach C (Factory) → Per-Scan Isolation ✓**
- New factory instance per scan → fresh constants → no cross-scan cache
- PolicyConstants created AFTER prepared_policy_bundle is ready
- Explicit initialization point allows cache invalidation

**Approach D (Lazy Property) → Cross-Scan Cache Poisoning ✗**
- Module singleton created ONCE at import time
- @cached_property caches on that ONE instance forever
- prepared_policy_bundle can be different per scan, but cache doesn't invalidate
- Concurrent scans with different policies = silent data corruption

---
## Verdict: CRITICAL BLOCKER

**Recommendation: DO NOT IMPLEMENT Approach D**

**Reasons:**
1. **Breaks multi-scan isolation**: Module singleton caching creates cross-scan interference
2. **Silent data corruption**: Different scans see wrong constants without error
3. **Incompatible with platform expansion**: K8s/Terraform scans will see Ansible constants
4. **No testing catches this**: Per-scan tests pass; only concurrent multi-policy tests would fail
5. **Does not solve root problem**: Module proxies with None DI still fail in tests
6. **Perpetuates dead code**: Doesn't eliminate proxies; just hides them better

**Better Alternative: Approach C (Factory)**
- Per-scan safety ✓
- Production hotpath optimization ✓
- Complete proxy elimination path ✓
- Concurrent multi-policy scans ✓
- Explicit initialization ✓

