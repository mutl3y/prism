- title: Error Contract Inconsistencies
  location: scanner_data/contracts_request.py, lines 18-43
  severity: HIGH
  description: |
    The `ErrorContract` and `ScanErrorEntry` TypedDicts define overlapping but inconsistent fields for error handling. This redundancy increases the risk of mismatched error handling across layers.
  evidence: |
    class ErrorContract(TypedDict, total=False):
        error_type: str
        message: str
        layer: str
        recoverable: bool

    class ScanErrorEntry(TypedDict):
        phase: str
        error_type: str
        message: str
  recommendation: |
    Consolidate error contracts into a single, well-defined structure to ensure consistency.

- title: Misuse of Policy-Backed Proxies
  location: scanner_extract/task_line_parsing.py, lines 13-41
  severity: CRITICAL
  description: |
    The `_PolicyBackedCollectionProxy` and `_PolicyBackedRegexProxy` classes dynamically resolve policy attributes at runtime, introducing significant performance overhead and runtime risks.
  evidence: |
    class _PolicyBackedCollectionProxy:
        def __init__(self, policy_attr_name: str) -> None:
            self._policy_attr_name = policy_attr_name

        def _current_value(self) -> object:
            return getattr(
                require_prepared_policy(None, "task_line_parsing", "task_line_parsing"),
                self._policy_attr_name,
            )
  recommendation: |
    Replace dynamic proxies with static, pre-resolved policy objects to improve performance and reliability.

