- title: Overuse of Protocols for DI Contracts
  location: scanner_core/di_helpers.py
  severity: MEDIUM
  description: |
    The file defines multiple `Protocol` classes (`HasScanOptions`, `EventBusProtocol`, etc.) for dependency injection (DI) contracts. While this approach ensures type safety, it introduces unnecessary complexity and verbosity. Many of these protocols could be replaced with simpler interfaces or direct type annotations.
  evidence: |
    @runtime_checkable
    class HasScanOptions(Protocol):
        scan_options: dict[str, Any]
  recommendation: |
    Consolidate protocols where possible and evaluate whether simpler type hints or abstract base classes (ABCs) could achieve the same goals with less overhead.

- title: Redundant Policy Normalization
  location: scanner_core/scan_request.py, lines 33-41
  severity: HIGH
  description: |
    The `_normalize_policy_context` function redundantly validates and copies `ScanPolicyContext`. This logic is repeated in other modules, leading to potential inconsistencies and maintenance overhead.
  evidence: |
    def _normalize_policy_context(
        policy_context: ScanPolicyContext | None,
    ) -> tuple[ScanPolicyContext | None, list[ScanPolicyWarning]]:
        if not _is_scan_policy_context(policy_context):
            return None, []
        return _copy_scan_policy_context(policy_context), []
  recommendation: |
    Centralize policy normalization logic in a shared utility module to ensure consistency and reduce duplication.

