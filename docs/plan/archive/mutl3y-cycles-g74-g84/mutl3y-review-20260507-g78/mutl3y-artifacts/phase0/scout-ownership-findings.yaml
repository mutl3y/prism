    count: "4 modules"
    violation_type: "MISSING_NORMALIZATION"
    ownership: "Public APIs should not raise FileNotFoundError directly"

  - id: "OWN-015"
    severity: "LOW"
    title: "KeyError Raised in scanner_plugins/registry.py"
    description: |
