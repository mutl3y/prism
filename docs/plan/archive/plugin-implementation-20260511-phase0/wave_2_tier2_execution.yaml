- id: GILF-NODE1-01
  severity: HIGH
  category: type-safety
  location: src/prism/scanner_core/di.py:74-82
  issue: TypedDict contract erased by generic clone + cast
  root_cause: clone_scan_options deep-clones scan_options into a plain dict and then
    uses cast(ScanOptionsDict, ...), which preserves no runtime TypedDict invariants.
  impact: Invalid or incomplete ScanOptionsDict values can propagate silently until
    later orchestration steps, making failures harder to diagnose and weakening static
    type guarantees.
  confidence: 92
  fix_suggestion: Use a stricter runtime validation path for ScanOptionsDict or construct
    the cloned object via explicit TypedDict-aware helpers instead of raw cast.
  source_file: tier0-raptor-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE1-01
  severity: HIGH
  category: architecture
  location: src/prism/scanner_core/di.py:_construct_runtime_plugin
  issue: The DI container's plugin constructor has a gaping security and reliability
    hole, allowing any plugin to crash the scanner if it has a TypeError in its constructor.
  root_cause: A misguided attempt to create a generic plugin constructor that catches
    `TypeError` but not other `PrismRuntimeError` exceptions. It assumes only DI-related
    `TypeError` can happen, which is laughably naive.
  impact: Any third-party or poorly written first-party plugin with a `TypeError`
    in its `__init__` will bring down the entire scan. This makes the system brittle
    and vulnerable to trivial bugs in extensions. It's an open invitation for failure.
  confidence: 100
  fix_suggestion: 'Stop trying to be clever and just let exceptions propagate. Remove
    the `try...except TypeError` block entirely. If a plugin is broken, it should
    fail loudly and explicitly, not be caught by a generic, indiscriminate error handler
    in the core DI framework. Effort: Trivial. Impact: The system becomes resilient
    to plugin-level failures.'
  source_file: tier2-gemini25-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE1-02
  severity: HIGH
  category: type-safety
  location: src/prism/scanner_core/di.py:clone_scan_options
  issue: The `clone_scan_options` function blindly casts a dictionary to `ScanOptionsDict`,
    completely bypassing any structural validation and creating a type safety mirage.
  root_cause: Laziness. Instead of properly validating the structure of the `scan_options`
    dictionary against the `TypedDict` definition, the code just assumes it's correct
    and uses `cast()` to silence the type checker.
  impact: This completely defeats the purpose of using a `TypedDict`. Any caller can
