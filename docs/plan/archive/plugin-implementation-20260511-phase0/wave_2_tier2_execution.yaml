findings:
- id: GILF-NODE1-03
  severity: HIGH
  category: ownership
  location: '[scanner_context.py:various, di.py:various]'
  issue: Policy Ownership Split and Fallbacks
  root_cause: Policies are set in one place (scan_request, ingress) and read or normalized
    in others (scanner_context, adapters), with fallback logic scattered everywhere.
  impact: Impossible to trace policy flow. Fallbacks create hidden state and normalization
    bugs. Ownership is ambiguous.
  confidence: 90
  fix_suggestion: Enforce single-point policy preparation at ingress. All consumers
    must require explicit, pre-normalized policy bundles—no fallback, no local normalization.
  source_file: tier0-gpt41-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE1-01
  severity: HIGH
  category: type-safety
  location: '[src/prism/scanner_core/di.py:1-120]'
  issue: Unchecked cast() and TypedDict identity loss when cloning scan options
  root_cause: '`clone_scan_options` builds a plain dict and uses `cast(ScanOptionsDict,
    ...)` to declare typed identity; many factories then consume that dict assuming
    TypedDict contracts without runtime validation.'
  impact: Silent type contract violations, loss of TypedDict shape guarantees, and
    downstream code may rely on TypedDict identity (or typed keys) which can be lost
    — leads to runtime KeyError/ValueError and brittle checks.
  confidence: 95
  fix_suggestion: Avoid broad `cast(...)` shortcuts. Validate/construct a `ScanOptionsDict`
    explicitly (schema-check or dataclass factory) or create helper that performs
    runtime validation when cloning; preserve TypedDict-like construction instead
    of blind cast.
  source_file: tier0-gpt5m-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE1-03
  severity: HIGH
  category: lazy-imports|circular-deps
  location: '[src/prism/scanner_core/di.py:1-240]'
  issue: Widespread deferred imports to hide circular dependencies
  root_cause: Factory helpers defer imports (e.g., FeatureDetector, VariableDiscovery)
    to runtime to avoid import-time cycles instead of resolving architectural layering.
  impact: Load-order coupling is masked rather than solved — can produce surprising
    runtime errors, hides real layering violations, and complicates static analysis
    and type-checking.
  confidence: 96
  fix_suggestion: Introduce clearer module boundaries / interface modules (protocols)
    so concrete implementations can live in plugin modules. Prefer inversion-of-control
    at module import time (small registry or entrypoint) instead of ad-hoc deferred
    imports.
  source_file: tier0-gpt5m-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE1-02
  severity: HIGH
  category: architecture
  location: '[src/prism/scanner_core/di.py:120-320]'
  issue: DIContainer is a god-object with mixed responsibilities
  root_cause: DIContainer owns platform resolution, caching, mock injection, event
    bus wiring, plugin construction, blocker building and scanner-context wiring —
    many cross-cutting concerns concentrated in one mutable instance.
  impact: High coupling, hard-to-test surface, hidden runtime side effects (cache/mocks),
    and composes circular-dependency workarounds into runtime factory code; makes
    refactors risky and review-intensive.
  confidence: 98
  fix_suggestion: 'Split responsibilities: separate a thin immutable composition root
    (registrations, wiring) from run-time instance-holder (caches, mocks). Expose
    small Protocols for consumers; move platform-key resolution and blocker-factory
    resolution to separate helper/service classes.'
  source_file: tier0-gpt5m-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE3-03
  severity: HIGH
  category: event-reliability
  location: '[src/prism/scanner_core/events.py:1-140]'
  issue: Silent event handler failures swallow exceptions
  root_cause: Event bus dispatch wraps handler calls in bare except blocks or logs
    only the exception type, discarding stack traces and context. Other handlers may
    or may not run depending on the implementation.
  impact: Lost diagnostics, undetected bugs, and handlers failing without any trace.
    Amateur hour.
  confidence: 98
  fix_suggestion: Log full exception details with stack traces, always chain exceptions,
    and ensure all handlers run even if one fails. Consider using a robust pub/sub
    library.
  source_file: tier0-gpt41-node3-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE3-02
  severity: HIGH
  category: cache-safety
  location: '[src/prism/scanner_core/scan_cache.py:1-160]'
  issue: No explicit cache invalidation or TTL enforcement
  root_cause: Cache entries are stored indefinitely with no time-to-live, eviction,
    or invalidation logic. The code assumes the world is static and memory is infinite.
  impact: Unbounded memory growth, stale data, and eventual OOM crashes. The only
    thing getting evicted is your uptime.
  confidence: 90
  fix_suggestion: Implement TTLs for cache entries, periodic, and explicit invalidation
    hooks. Use an LRU or time-based eviction policy.
  source_file: tier0-gpt41-node3-findings.yaml
  status: ALREADY_ADDRESSED
  fix_type: prior_work
- id: GILF-NODE3-03
  severity: HIGH
  category: copy-semantics
  location: '[src/prism/scanner_core/scan_cache.py:1-40] & [src/prism/scanner_core/scan_request.py:1-80]'
  issue: Shallow or incomplete cloning leads to shared mutable state
  root_cause: _clone_container_structure clones basic containers but returns original
    for non-container objects; `build_run_scan_options_canonical` uses `copy.copy`
    for `prepared_policy_bundle` and leaves other lists/maps as-is.
  impact: Mutable objects inside cached values or returned scan options can be mutated
    by callers or consumers after caching, breaking immutability assumptions and causing
    hard-to-debug state corruption or cross-request leakage.
  confidence: 95
  fix_suggestion: 'Use a robust defensive copy strategy: either `copy.deepcopy` (with
    care for performance) or a serialization round-trip (JSON/MessagePack) for cache
    boundaries. For non-serializable domain objects, require a `get_state_fingerprint()`
    or provide explicit serializer hooks. In `build_run_scan_options_canonical`, deep-copy
    incoming lists/dicts (or freeze them) before placing into the returned options.'
  source_file: tier0-gpt5m-node3-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE3-01
  severity: HIGH
  category: cache-safety
  location: '[src/prism/scanner_core/scan_cache.py:30-110]'
  issue: No TTL or byte-size eviction — only entry-count LRU
  root_cause: InMemoryLRUScanCache only limits entries by count (`maxsize`) and never
    evicts based on age or value size.
  impact: Large scan results (or many large entries) can exhaust process memory despite
    LRU count limits; long-lived stale entries remain until evicted by count pressure.
  confidence: 95
  fix_suggestion: Add optional TTL per-entry and/or a byte-size budget. Implement
    time-based expiry and an LRU that accounts for value size (bytes). Consider background
    maintenance thread or lazy expiry on access to avoid long pause events.
  source_file: tier0-gpt5m-node3-findings.yaml
  status: ALREADY_ADDRESSED
  fix_type: prior_work
- id: GILF-NODE3-07
  severity: HIGH
  category: validation
  location: '[src/prism/scanner_core/scan_request.py:1-120]'
  issue: Weak/late validation and fragile `prepared_policy_bundle` handling
  root_cause: Only `role_path` is validated early; `prepared_policy_bundle` is copied
    only when it's a plain `dict` (`isinstance(dict)`), otherwise ignored. Many inputs
    are accepted without type checks until `validate_scan_options` is invoked late.
  impact: Invalid or unexpected types can be embedded into the options and later cause
    runtime errors, silent skips, or inadvertent cache key collisions (if callers
    assume shapes). Prepared bundles that are valid but not `dict` (e.g., TypedDict,
    Mapping, or a plugin-provided object) will be ignored leading to incorrect scan
    behavior.
  confidence: 95
  fix_suggestion: 'Validate inputs early: use `collections.abc.Mapping` / explicit
    TypedDict checks for `prepared_policy_bundle` and copy/normalize accordingly.
    Perform defensive deep-copying of lists/maps passed in. Fail-fast with clear,
    chained exceptions that include the offending key name and expected type.'
  source_file: tier0-gpt5m-node3-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE3-05
  severity: HIGH
  category: validation
  location: '[src/prism/scanner_core/scan_request.py:1-380]'
  issue: Request objects lack strict field validation
  root_cause: Required fields are not consistently validated at construction or ingestion.
    Optional fields default to None or empty, but downstream code assumes presence.
  impact: Invalid requests propagate through scanner_core, causing downstream errors,
    silent failures, or security issues.
  confidence: 92
  fix_suggestion: Enforce strict validation of all required fields at object creation.
    Use pydantic or dataclasses with type enforcement and validation hooks.
  source_file: tier0-gpt41-node3-findings.yaml
  status: ALREADY_ADDRESSED
  fix_type: prior_work
- id: GILF-NODE3-07
  severity: HIGH
  category: error-handling
  location: '[src/prism/scanner_core/scan_request.py:1-380], [src/prism/scanner_core/events.py:1-140]'
  issue: Error messages lack context and exception chaining
  root_cause: Exceptions are raised with generic messages, missing contextual data
    (e.g., request IDs, cache keys). Exception chaining is not used, so root causes
    are lost.
  impact: Impossible-to-debug errors, lost root cause, and a support queue full of
    angry users.
  confidence: 90
  fix_suggestion: Always include contextual data in error messages, and use 'raise
    ... from exc' to chain exceptions. Log all errors with full context.
  source_file: tier0-gpt41-node3-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-DI-05
  severity: HIGH
  category: testability
  location: di.py:134-176 (_construct_runtime_plugin)
  issue: Plugin constructor validation uses signature inspection but doesn't validate
    plugin class shape at registration time
  root_cause: DIContainer._construct_runtime_plugin() inspects the constructor signature
    at runtime to check if the plugin accepts `di=...`. This check should happen when
    the plugin is registered, not when it's instantiated.
  impact: Errors surface at scan runtime, not at plugin bootstrap. Bad plugins slip
    through initialization and fail deep in execution. No fail-fast validation.
  confidence: 88
  fix_suggestion: Move signature validation to PluginRegistry.register_plugin(). Validate
    all plugins once at bootstrap. Store pre-validated plugin classes. Fail fast.
  source_file: tier1-haiku45-node1-findings.yaml
  status: DEFERRED
  fix_type: multi_week_refactoring
- id: GILF-NODE1-02
  severity: HIGH
  category: architecture
  location: di.py:188-561 (entire DIContainer class)
  issue: God-object antipattern - DIContainer has 17 factory methods and manages caching,
    locking, mocking, platform resolution, and event bus lifecycle
  root_cause: 'Classic ''throw everything in one class'' design. Started as lightweight
    DI, accumulated responsibilities. Now manages: plugin resolution (7 types), service
    creation (variable_discovery, feature_detector), cache lifecycle, mock injection,
    threading locks, platform key resolution, event bus, scanner context wiring. Single
    class knows about scanner_core, scanner_extract, scanner_plugins, scanner_data.'
  impact: Testing nightmare - must understand 3-level override hierarchy (mocks →
    factory_overrides → actual). Changing any plugin registration requires understanding
    entire DI contract. 561 lines in single class. Circular dependency workarounds
    everywhere. Every new capability adds another factory method. Class will grow
    indefinitely.
  confidence: 100
  fix_suggestion: 'Split into: (1) PluginResolver (platform key + registry queries),
    (2) ServiceLocator (caching + lifecycle), (3) TestDoubleInjector (mocking). Estimated
    1-2 weeks refactoring + full test coverage rewrite. But you won''t do it because
    ''it works'' and ''we don''t have time''. Classic.'
  source_file: tier2-sonnet45-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE2-02
  severity: HIGH
  category: caching
  location: di.py:228-235
  issue: Anemic Cache Invalidation for Options Mutation
  root_cause: replace_scan_options only invalidates 'feature_detector' and 'variable_discovery'.
    It completely ignores the fact that nearly every other factory in this container
    (like scanner_context) also captures scan_options in its closure or constructor.
  impact: Stale scan options persist in the ScannerContext or any other long-lived
    DI-provided component after an options update. You're effectively running a scan
    with two different realities at once.
  confidence: 95
  fix_suggestion: Invalidate the entire _cache on replace_scan_options, or use a proper
    property-dependency graph if you're actually pretending to be a systems architect.
  source_file: tier1-gemini3f-node2-findings.yaml
  status: DEFERRED
  fix_type: multi_week_refactoring
- id: GILF-NODE1-04
  severity: HIGH
  category: architecture
  location: di.py:24-54 (TYPE_CHECKING block), di.py:103-113 (deferred imports)
  issue: Circular dependency architecture smell - 30 lines of TYPE_CHECKING imports
    and deferred factory imports indicate wrong module boundaries
  root_cause: scanner_core imports from scanner_extract, scanner_plugins. Those modules
    import di_helpers from scanner_core. Broke import cycle by deferring imports to
    factory call sites. Symptom treatment instead of fixing module dependency graph.
    Every future scanner_core addition risks new circular dependency.
  impact: Cognitive load - developers must understand when imports happen vs when
    types are available. Refactoring paralyzed - moving code between modules requires
    checking TYPE_CHECKING blocks. Import order bugs hide until runtime. Adding new
    scanner_extract dependency requires another deferred import pattern. Architecture
    fighting itself.
  confidence: 95
  fix_suggestion: 'Invert dependency: extract scanner_core interfaces to scanner_data/protocols.
    scanner_extract and scanner_plugins depend only on protocols, not concrete scanner_core.
    DI wires implementations. Cost: 1 week architectural refactoring. Alternative:
    accept technical debt and watch it compound. You probably already have.'
  source_file: tier2-sonnet45-node1-findings.yaml
  status: DEFERRED
  fix_type: multi_week_refactoring
- id: GILF-NODE1-01
  severity: HIGH
  category: type-safety
  location: di.py:76-80, di.py:321, di.py:346, di.py:403, di.py:429, plus 8 more
  issue: Type erasure epidemic through blind cast() on factory override results
  root_cause: Factory override pattern trusts caller-provided objects without validation.
    Every factory method does `cast(ReturnType, override_result)` after calling `_call_factory_override()`,
    which returns `object | None`. Zero runtime validation that override actually
    conforms to expected protocol.
  impact: Type checker believes contracts are enforced when they're completely optional
    at runtime. Test doubles or malicious overrides can inject arbitrary objects.
    Runtime failure occurs deep in call stack with cryptic AttributeError instead
    of at DI boundary with clear contract violation. Mystery why anyone bothered with
    type hints if you're just going to lie to mypy.
  confidence: 98
  fix_suggestion: 'Replace blind cast() with runtime Protocol validation using isinstance()
    checks. For override results, verify required methods exist before casting. Cost:
    2-3h to add validation helpers. Alternative: remove override mechanism entirely
    if you can''t be bothered to validate contracts. That''s what adults do.'
  source_file: tier2-sonnet45-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-DI-01
  severity: HIGH
  category: type-safety
  location: di.py:78
  issue: Blind TypedDict cast loses identity through dict comprehension
  root_cause: clone_scan_options() uses cast(ScanOptionsDict, {...}) to force type
    after building dict via comprehension. TypedDict is nominal—this cast is purely
    aspirational and fails at runtime type checking.
  impact: Downstream code like scan_options_from_di() does isinstance(di, HasScanOptions)
    checks on the scan_options property, but mypy has no guarantee the cast actually
    produced a ScanOptionsDict. Type erasure creates contract violations.
  confidence: 95
  fix_suggestion: 'Return ScanOptionsDict explicitly: `result: ScanOptionsDict = {};
    result.update({...}); return result` or use TypedDict constructor if available.'
  source_file: tier1-haiku45-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-DI-03
  severity: HIGH
  category: ownership
  location: di.py:85-110, di.py:283, di.py:228
  issue: scan_options cloning scattered across multiple locations without clear ownership
  root_cause: 'clone_scan_options() is called in: (1) __init__ to store, (2) replace_scan_options(),
    (3) _snapshot_scan_options(), (4) each factory_* method that needs current options.
    Cloning policy is distributed; no single source of truth.'
  impact: If cloning logic needs to change (e.g., to handle new mutable types), you
    must hunt through 20+ call sites. Inconsistent snapshots could leak mutable state
    despite cloning intent. Expensive operation called repeatedly.
  confidence: 92
  fix_suggestion: 'Make scan_options an immutable property: `@property scan_options(self)
    -> ScanOptionsDict` returns a fresh snapshot. Call site doesn''t need to know
    cloning happens. Single source of truth for snapshot policy.'
  source_file: tier1-haiku45-node1-findings.yaml
  status: DEFERRED
  fix_type: multi_week_refactoring
- id: GILF-DI-02
  severity: HIGH
  category: architecture
  location: src/prism/scanner_core/di.py:115-163
  issue: Constructor-shape checking via introspection
  root_cause: The `_construct_runtime_plugin` function uses `inspect.signature` to
    verify if a plugin class accepts `di=...`, essentially reinventing building-block
    DI at runtime.
  impact: Performance tax on every plugin instantiation and a brittle dependency on
    constructor naming conventions. It bypasses the Protocol-based safety that static
    analysis should provide.
  confidence: 90
  fix_suggestion: Enforce a uniform base class or a stricter Protocol for plugins
    that the Registry validates *before* handing them to the DI container, eliminating
    the need for runtime signature sniffing.
  source_file: tier1-gemini3f-node1-findings.yaml
  status: ALREADY_ADDRESSED
  fix_type: prior_work
- id: GILF-NODE1-02
  severity: HIGH
  category: type-safety
  location: src/prism/scanner_core/di.py:140-186
  issue: Runtime plugin validation checks only whether the constructor accepts `di`,
    not whether the instantiated object actually satisfies the expected plugin protocol.
  root_cause: The registry hands back `type[Any]`, and `_construct_runtime_plugin()`
    enforces constructor shape instead of behavioral shape.
  impact: A plugin class with a `di` parameter but missing required methods will be
    accepted at composition time and fail later inside discovery or feature detection.
    That pushes the real fault away from the DI boundary and turns a clean configuration
    error into downstream runtime noise.
  confidence: 95
  fix_suggestion: 'Have registry methods return Protocol-constrained plugin classes,
    or validate the constructed instance against a `@runtime_checkable` protocol with
    explicit required callables. Effort: medium. Impact: high for fail-fast behavior.'
  source_file: tier2-gpt54-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE1-03
  severity: HIGH
  category: testability
  location: src/prism/scanner_core/di.py:190-221,540-558
  issue: 'The DI container is doing five jobs at once: composition root, plugin resolver,
    cache owner, event-bus owner, and mutable test harness via `inject_mock()`/`clear_mocks()`.'
  root_cause: Test seams were embedded directly into the production container instead
    of being isolated in a builder, fixture adapter, or test-only wrapper.
  impact: Mocking requires magic names that mirror factory keys, container state becomes
    mutable in ways production code should never need, and tests are coupled to internal
    resolution order instead of behavior. That is classic god-object drift, just with
    more ceremony.
  confidence: 93
  fix_suggestion: 'Split test override support out of `DIContainer` into a dedicated
    test harness or container builder, and move plugin resolution/cache concerns behind
    narrower collaborators. Effort: medium-high. Impact: high for maintainability
    and isolation.'
  source_file: tier2-gpt54-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE1-03
  severity: HIGH
  category: error-handling
  location: src/prism/scanner_core/di.py:200-220
  issue: Silent failure in `_call_factory_override`
  root_cause: Factory override errors are swallowed, leading to silent failures.
  impact: Hinders debugging and can cause downstream failures with unclear root causes.
  confidence: 85
  fix_suggestion: Log errors explicitly and raise exceptions for critical failures.
  source_file: tier0-gpt4o-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-NODE1-01
  severity: HIGH
  category: architecture
  location: src/prism/scanner_core/di.py:200-309
  issue: The container's extensibility seams are stringly typed. `scanner_context_wiring`
    is a raw `dict[str, object]`, factory overrides are selected by magic string keys,
    and `factory_scanner_context()` relies on a `cast()` instead of a validated constructor
    contract.
  root_cause: The DI composition root was made flexible through unstructured dictionaries
    rather than typed seam objects or Protocol-backed adapters.
  impact: Miswired runtime seams fail late, only when a factory is invoked, and the
    failure shape depends on whatever object happened to be stuffed into the dict.
    Tests also inherit this mess and end up casting plain dicts into override types
    instead of getting compile-time enforcement.
  confidence: 97
  fix_suggestion: 'Replace `scanner_context_wiring` and string-keyed factory override
    maps with typed dataclasses or dedicated Protocol interfaces, and validate them
    once in `DIContainer.__init__`. Effort: medium. Impact: high for testability and
    runtime diagnostics.'
  source_file: tier2-gpt54-node1-findings.yaml
  status: FIXED
  fix_type: direct
- id: GILF-DI-03
  severity: HIGH
  category: ownership
  location: src/prism/scanner_core/di.py:205-209
  issue: Split ownership of ScanOptions snapshots
  root_cause: The container clones `scan_options` in `__init__`, but provides `replace_scan_options`
    and `_snapshot_scan_options` methods that allow external mutation of the container's
    core state.
  impact: Inconsistent state across the system. If one part of the code calls `replace_scan_options`,
    already-instantiated objects like `ScannerContext` may still hold references to
    the old snapshot, leading to 'split-brain' scanning results.
  confidence: 85
  fix_suggestion: Make `ScanOptions` immutable within the DI container's lifecycle.
    If options must change, a new Container instance should be spawned to ensure all
    child objects see the same worldview.
  source_file: tier1-gemini3f-node1-findings.yaml
  status: DEFERRED
  fix_type: multi_week_refactoring
- id: GILF-NODE1-09
  severity: HIGH
  category: DI-container-architecture
  location: src/prism/scanner_core/di.py:250-280
  issue: Cache invalidation logic tightly coupled to DIContainer
  root_cause: Cache management is embedded within DIContainer, violating separation
    of concerns.
  impact: Complicates cache management and increases the risk of stale data.
  confidence: 90
  fix_suggestion: Extract cache management into a dedicated CacheManager class.
