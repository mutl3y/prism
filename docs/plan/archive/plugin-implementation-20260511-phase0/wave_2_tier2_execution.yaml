  severity: HIGH
  category: type-safety
  location: src/prism/scanner_core/di.py:50-70
  issue: Excessive reliance on `cast()` for type coercion
  root_cause: The DIContainer uses `cast()` to enforce type safety, masking potential
    runtime type errors.
  impact: Introduces fragility in type enforcement, making debugging harder and risking
