- id: GILF-NODE3-01
  severity: CRITICAL
  category: event-reliability
  location: src/prism/scanner_core/events.py:EventBus._record_listener_error
  issue: Listener failures are retained in an unbounded in-memory list, and each retained
    EventBusError keeps the original exception object alive.
  root_cause: The bus appends every failure to _error_events with no cap or eviction
    policy, and EventBusError stores the Exception instance itself rather than a serialized
    snapshot.
  impact: A noisy or permanently broken listener will create an unbounded memory leak.
    Because exception objects can retain traceback frames and locals, the leak can
    pin much larger object graphs than the list size suggests.
  confidence: 97
  fix_suggestion: 'Replace _error_events with a bounded ring buffer or maxlen deque,
    and store a lightweight error snapshot instead of the live exception object. Include
    listener name, event phase/kind, exception type, message, and timestamp. Effort:
    small. Impact: high.'
  source_file: tier2-gpt54-node3-findings.yaml
- id: GILF-NODE3-01
  severity: CRITICAL
  category: event-reliability
  location: src/prism/scanner_core/events.py:EventBus.dispatch
