    via _resolve_marker_prefix(). feature_detector completely bypasses the facade,
    so it gets default marker_prefix='prism' instead of the configured one.
  impact: 'If scanner is configured with marker_prefix=''my_custom_marker'', feature_detector
    will look for ''prism'' markers in task files instead. Task annotations will be
    missed or misidentified. This is a silent data-loss bug: no error, just wrong
    results.'
  confidence: 98
  fix_suggestion: 'In feature_detector.py, import from task_extract_adapters instead
    of lazy-importing: from prism.scanner_core.task_extract_adapters import collect_task_handler_catalog.
    Then line 122 calls the correct facade. OR manually resolve marker_prefix at line
    122: marker_prefix = _resolve_marker_prefix(self._di). This is a one-line fix,
    but it''s critical.'
  source_file: tier1-haiku45-node2-findings.yaml
- id: GILF-NODE3-01
  severity: CRITICAL
  category: cache-safety
  location: scan_cache.py:136-150
  issue: Identity-based cache key uses Python `id()` which is non-deterministic across
    runs and GC cycles
  root_cause: "The `build_runtime_wiring_identity` function constructs cache keys\
    \ by concatenating object identity via `id(value)`, \nwhich is memory address-based.\
    \ After object GC/reload, a new instance gets the same memory address, causing\
    \ \nstale cache collisions. This is amateur hour caching.\n"
  impact: '- Cache hits return stale data from previous unrelated scans

    - Impossible to debug (collisions happen silently)

    - Multiprocessing scenarios = guaranteed corruption (id() differs per process)

    '
  confidence: 98
  fix_suggestion: 'Use content-addressable keys instead: hash(str(type) + callable_fqn
    + state_fingerprint).

    Never use id(). If you need object identity, use a WeakValueDictionary or explicit
    token-based versioning.

    '
  source_file: tier1-haiku45-node3-findings.yaml
- id: GILF-NODE3-01
  severity: CRITICAL
  category: cache-safety
  location: scan_cache.py:20-32 (_clone_container_structure)
  issue: Cache clone function returns custom objects by reference, not by value. Any
    mutable custom object in cached data is shared across all cache consumers, creating
    invisible aliasing and race conditions.
  root_cause: "The recursive cloner only handles built-in container types (dict, list,\
    \ tuple, set, frozenset). When it encounters any other object type, it just returns\
    \ it as-is: `return value`. This means custom objects\u2014dataclasses, TypedDicts\
    \ after runtime, any domain objects\u2014are never cloned."
  impact: Cache corruption. If thread A retrieves a cached scan result containing
    a mutable object, modifies it, thread B's subsequent cache hit sees thread A's
    modifications. Silent data corruption across cache boundaries. The entire cache
    isolation contract is void for non-primitive types.
  confidence: 100
  fix_suggestion: 'CRITICAL FIX (2-4 hours): Add deep copy fallback for non-container
    types: `return copy.deepcopy(value)` as last resort. Or better: Define a cloneable
    protocol and require cached values implement it. Document that caching non-primitive
    types is unsafe without explicit clone protocol. Prefer immutable types in cache
    payloads. Add validation that detects mutable custom objects and either rejects
    them or warns loudly.'
  source_file: tier2-sonnet45-node3-findings.yaml
- id: GILF-NODE3-02
  severity: CRITICAL
  category: cache-safety
  location: scan_cache.py:217-238 (_canonicalize in compute_scan_cache_key)
  issue: Cache key canonicalization collapses distinct object instances into identical
    keys. Two different instances of the same custom class produce identical cache
    keys, causing cache collisions.
  root_cause: "Line 235: `return {'__opaque_type__': (f'{type(value).__module__}.{type(value).__qualname__}')}`\
    \ \u2014 this only includes type name, not object state. Two `PolicyConfig` instances\
    \ with different settings produce the same canonical representation."
  impact: Cache poisoning. Request A with PolicyConfig(strict=True) computes key K1.
    Request B with PolicyConfig(strict=False) also computes K1. Request B gets Request
    A's cached result, which was computed with wrong policy. Silent wrong-answer bug.
    The cache becomes a reliability hazard instead of a performance optimization.
  confidence: 100
  fix_suggestion: 'CRITICAL FIX (1-2 hours): For opaque types, require them to be
    hashable and use `hash(value)` in the canonical form. Or require a `__cache_key__`
    protocol method. Or fail loudly: raise an exception for non-primitive, non-container
    types instead of silently producing colliding keys. Document that only primitive
    types and containers of primitives are safe to cache. Any custom objects must
    implement explicit cache-key protocol.'
  source_file: tier2-sonnet45-node3-findings.yaml
- id: GILF-NODE1-03
  severity: CRITICAL
  category: error-handling
  location: scanner_context.py:354-366, scanner_context.py:374-386
  issue: Exception context loss in best-effort degradation mode - original tracebacks
    discarded
  root_cause: Graceful degradation pattern catches broad exception types (PrismRuntimeError,
    ValueError, RuntimeError, TypeError) but calls `_record_phase_error` which only
    stores error_type and message string. No `raise ... from error` chaining. Traceback
    vanishes. Debug time multiplies by 10.
  impact: Production failure in variable_discovery or feature_detection produces useless
    ScanErrorEntry with no call stack. Root cause investigation requires local reproduction.
    Non-strict mode silently continues with empty data. Nobody notices until customer
    complains 'my variables are missing'. Then you spend 2 hours debugging instead
    of 2 minutes with proper exception chaining.
  confidence: 99
  fix_suggestion: 'Store exception chain: `error_entry[''__cause__''] = error` in
    _record_phase_error. Alternative: use `raise PrismRuntimeError(...) from error`
    before recording. Cost: 30 minutes. But tracking down ONE production issue without
    tracebacks costs 2+ hours. Your call.'
  source_file: tier2-sonnet45-node1-findings.yaml
