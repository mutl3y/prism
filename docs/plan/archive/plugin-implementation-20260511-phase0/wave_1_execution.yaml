- id: GILF-NODE2-06
  severity: CRITICAL
  category: data-flow
  location: feature_detector.py:26-31 vs task_extract_adapters.py:164-171
  issue: feature_detector.collect_task_handler_catalog() silently uses wrong (default)
    marker_prefix because it doesn't call task_extract_adapters facade
  root_cause: feature_detector.collect_task_handler_catalog() (line 122) calls _collect_task_handler_catalog()
    directly (lines 26-31), which imports from scanner_extract.task_catalog_assembly
    and does NOT resolve marker_prefix. But task_extract_adapters.collect_task_handler_catalog()
