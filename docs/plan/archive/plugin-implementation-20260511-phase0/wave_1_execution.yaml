- id: GILF-NODE2-01
  severity: CRITICAL
  category: concurrency
  location: variable_discovery.py:35-37
  issue: Blatant Two-Check Lock Pattern Violation (TOCTOU)
  root_cause: "In _resolve_plugin, you check self._plugin_resolved outside the lock,\
    \ which is fine for the fast path, but then inside the lock, you check it again\u2014\
    EXCEPT the boolean is volatile across threads and you aren't using an atomic primitive\
    \ or ensuring the plugin instance itself is fully constructed before setting the\
    \ flag."
  impact: Thread A enters the lock, sets self._plugin_resolved = True, but has a preemption
    gap before self._plugin = plugin. Thread B hits the fast-path check, sees True,
    and returns self._plugin which is still None. Boom. Infinite NullPointer-equivalents
    in a language that doesn't even have them.
