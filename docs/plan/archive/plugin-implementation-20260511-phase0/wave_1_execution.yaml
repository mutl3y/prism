- id: GILF-NODE3-01
  severity: CRITICAL
  category: cache-safety
  location: '[src/prism/scanner_core/scan_cache.py:1-160]'
  issue: Cache key construction is ad-hoc and collision-prone
  root_cause: Cache keys are built from string concatenation or tuple packing without
    canonicalization or hashing, making collisions and accidental overwrites likely,
    especially with mutable or non-hashable types.
  impact: Cache poisoning, silent data corruption, and unpredictable cache hits/misses.
    Enjoy debugging that at 2am.
  confidence: 95
  fix_suggestion: Centralize cache key construction with a canonical, type-safe, and
    hash-stable function. Use frozenset or sorted tuples for unordered keys, and validate
    all key components for hashability.
  source_file: tier0-gpt41-node3-findings.yaml
- id: GILF-NODE3-02
  severity: CRITICAL
  category: cache-safety
  location: '[src/prism/scanner_core/scan_cache.py:120-200]'
  issue: Cache key ignores runtime wiring identity; callable identity uses process
    `id()`
  root_cause: compute_scan_cache_key only uses `role_content_hash` and scan options.
    `build_runtime_wiring_identity` exists but is not composed into compute key; callable/object
    identity embeds Python `id()` which is process-volatile.
  impact: "Cache poisoning or stale hits when orchestration functions / runtime registry\
    \ change. Keys may be valid in one process run and invalid in another; false cache\
    \ hits across semantic changes lead to incorrect scan outputs \u2014 a correctness/SECURITY\
    \ risk."
  confidence: 96
  fix_suggestion: Require callers to include the canonical `build_runtime_wiring_identity(...)`
    result into scan options (or accept an explicit `runtime_identity` param) and
    include it in the canonical key. Replace `id()`-based identities with stable fingerprints
    where possible (e.g., module + qualname + optional user-supplied version). Document
    that process-local `id()` makes cache non-persistent across restarts.
  source_file: tier0-gpt5m-node3-findings.yaml
- id: GILF-NODE2-01
  severity: CRITICAL
  category: concurrency
  location: '[variable_discovery.py:1-280]'
  issue: Shared mutable cache without synchronization
  root_cause: The module uses a process-wide or module-level cache (likely a dict
    or similar) for variable discovery results, but there is no evidence of locks,
    atomic operations, or thread/process isolation.
  impact: Concurrent requests can corrupt the cache, leading to TOCTOU races, stale
