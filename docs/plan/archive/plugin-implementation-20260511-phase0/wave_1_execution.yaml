  category: event-reliability
  location: events.py:143-157
  issue: Exception logged but context lost; logging failure silently orphans the original
    exception
  root_cause: "When a listener raises, the code catches it, records it, and logs it.\
    \ But if the logger itself fails \n(e.g., handler misconfigured, file permission\
