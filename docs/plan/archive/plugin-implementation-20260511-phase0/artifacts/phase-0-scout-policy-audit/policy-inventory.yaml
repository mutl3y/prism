# ---- CATEGORY 1: PROTOCOL/INTERFACE DEFINITIONS (6 Prepared* Protocols) ----
# Location: src/prism/scanner_data/contracts_request.py
# Role: Define minimum capability surface for runtime policy consumers
# Lifecycle: Defined once; used to validate all plugin implementations

prepared_policies:
  - policy_name: PreparedTaskLineParsingPolicy
    protocol: True
    location: contracts_request.py:~200
    responsibility: Parse task-line syntax; detect task module names; track include keys
    required_methods:
      - detect_task_module(task) -> str | None
      - extract_constrained_when_values(task, variable) -> list[str]
    required_attributes:
      - TASK_INCLUDE_KEYS
      - ROLE_INCLUDE_KEYS
      - INCLUDE_VARS_KEYS
      - SET_FACT_KEYS
      - TASK_BLOCK_KEYS
      - TASK_META_KEYS
    consumers:
      - scanner_extract/task_line_parsing.py
      - scanner_core/task_line_parsing.py
    ownership: Platform-specific (Ansible registered default)
    mutability: Immutable (stateless)

  - policy_name: PreparedJinjaAnalysisPolicy
    protocol: True
    location: contracts_request.py:~218
    responsibility: Analyze Jinja templates; extract undeclared variables
    required_methods:
      - collect_undeclared_jinja_variables(text) -> set[str]
    consumers:
      - scanner_extract/variable_extractor.py
      - scanner_core/variable_discovery.py
    ownership: Platform-agnostic default (Jinja)
    mutability: Immutable (stateless)

  - policy_name: PreparedTaskTraversalPolicy
    protocol: True
    location: contracts_request.py:~224
    responsibility: Traverse task hierarchies; enumerate includes; resolve role/task graphs
    required_methods:
      - iter_task_mappings(data) -> Iterable[TaskMapping]
      - iter_task_include_targets(data) -> list[str]
      - iter_task_include_edges(data) -> list[dict]
      - expand_include_target_candidates(task, target) -> list[str]
      - iter_role_include_targets(task) -> list[str]
      - iter_dynamic_role_include_targets(task) -> list[str]
      - collect_unconstrained_dynamic_task_includes(...) -> list[dict]
      - collect_unconstrained_dynamic_role_includes(...) -> list[dict]
    consumers:
      - scanner_extract/task_traversal.py
      - scanner_core/task_catalog.py
    ownership: Platform-specific (Ansible registered default)
    mutability: Immutable (stateless)

  - policy_name: PreparedTaskAnnotationPolicy
    protocol: True
    location: contracts_request.py:~254
    responsibility: Parse task annotations; handle marker prefixes; extract metadata
    required_methods:
      - split_task_annotation_label(text) -> tuple[str, str]
      - split_task_target_payload(text) -> tuple[str, str]
      - annotation_payload_looks_yaml(payload) -> bool
      - normalize_marker_prefix(prefix) -> str
      - get_marker_line_re(prefix) -> object
      - extract_task_annotations_for_file(lines, marker_prefix, include_task_index) -> tuple
      - task_anchor(file_path, task_name, index) -> str
    consumers:
      - scanner_extract/task_extract_adapters.py
      - scanner_core/task_annotation_parsing.py
    ownership: Platform-specific (Ansible registered default)
    mutability: Immutable (stateless)

  - policy_name: PreparedYAMLParsingPolicy
    protocol: True
    location: contracts_request.py:~270
    responsibility: Load YAML files; validate YAML candidates; emit parse failures
    required_methods:
      - load_yaml_file(path) -> object
      - parse_yaml_candidate(candidate, role_root) -> YamlParseFailure | None
    consumers:
      - scanner_extract/task_catalog.py
      - scanner_core/scanner_context.py
    ownership: Platform-agnostic (Jinja/YAML)
    mutability: Immutable (stateless)

  - policy_name: PreparedVariableExtractorPolicy
    protocol: True
    location: contracts_request.py:~280
    responsibility: Extract include_vars files; collect variable sources
    required_methods:
      - collect_include_vars_files(role_path, exclude_paths, collect_task_files, load_yaml_file) -> list[Path]
    consumers:
      - scanner_extract/variable_extractor.py
      - scanner_core/variable_discovery.py
    ownership: Platform-specific (Ansible registered default)
    mutability: Immutable (stateless)

# ---- CATEGORY 2: RUNTIME POLICY BUNDLE (PreparedPolicyBundle TypedDict) ----
# Location: src/prism/scanner_data/contracts_request.py:~305
# Role: Carrier of runtime-scoped prepared policy instances
# Lifecycle: Created at ingress; snapshotted into scan_options; immutable after creation

prepared_policy_bundle:
  - name: PreparedPolicyBundle
    type: TypedDict
    location: contracts_request.py:305
    responsibility: Package 6 prepared policies + metadata for runtime consumption
    required_fields:
      - task_line_parsing: PreparedTaskLineParsingPolicy
      - jinja_analysis: PreparedJinjaAnalysisPolicy
    optional_fields:
      - task_traversal: NotRequired[PreparedTaskTraversalPolicy]
      - yaml_parsing: NotRequired[PreparedYAMLParsingPolicy]
      - variable_extractor: NotRequired[PreparedVariableExtractorPolicy]
      - task_annotation_parsing: NotRequired[PreparedTaskAnnotationPolicy]
      - comment_doc_marker_prefix: str
      - ignore_unresolved_internal_underscore_references: bool
    created_by: scanner_core.scanner_context.prepare_scan_context() [ingress seam]
    accessed_by:
      - scanner_core/di_helpers.get_prepared_policy_or_none()
      - scanner_extract/task_extract_adapters.py
      - scanner_core/variable_discovery.py
      - scanner_core/task_catalog_assembly.py
    mutability: Immutable after bundle creation; field access via bundle.get(policy_name)

