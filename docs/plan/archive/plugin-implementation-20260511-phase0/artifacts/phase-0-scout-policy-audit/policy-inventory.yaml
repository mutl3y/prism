# ---- CATEGORY 4: ANSIBLE DEFAULT POLICIES (4 plugin classes) ----
# Location: src/prism/scanner_plugins/ansible/default_policies.py
# Role: Platform-specific (Ansible) implementations of the 4 extract-policy interfaces
# Lifecycle: Registered at bootstrap; singletons created; reused across scans
# Note: All are PLUGIN_IS_STATELESS = True (class-level invariant enforced at bootstrap)

ansible_plugins:
  - plugin_name: AnsibleDefaultTaskLineParsingPolicyPlugin
    location: default_policies.py:63
    implements: PreparedTaskLineParsingPolicy protocol
    stateless: True
    attributes:
      - TASK_INCLUDE_KEYS: frozenset(task_line_parsing_module.TASK_INCLUDE_KEYS)
      - ROLE_INCLUDE_KEYS: frozenset(task_line_parsing_module.ROLE_INCLUDE_KEYS)
      - INCLUDE_VARS_KEYS: frozenset(task_line_parsing_module.INCLUDE_VARS_KEYS)
      - SET_FACT_KEYS: frozenset(task_line_parsing_module.SET_FACT_KEYS)
      - TASK_BLOCK_KEYS: frozenset(task_line_parsing_module.TASK_BLOCK_KEYS)
      - TASK_META_KEYS: frozenset(task_line_parsing_module.TASK_META_KEYS)
      - TEMPLATED_INCLUDE_RE: regex pattern
    methods: [detect_task_module, extract_constrained_when_values] (both @staticmethod)
    delegates_to: task_line_parsing_module, task_traversal_bare
    registration: bootstrap.py / defaults.py as "task_line_parsing" extract_policy
    singleton_instance: _TASK_LINE_PARSING_FALLBACK in defaults.py

  - plugin_name: AnsibleDefaultVariableExtractorPolicyPlugin
    location: default_policies.py:84
    implements: PreparedVariableExtractorPolicy protocol
    stateless: True
    methods:
      - collect_include_vars_files() - implements path traversal, YAML loading, include file filtering
    delegates_to: variable_extractor_module
    registration: bootstrap.py as "variable_extractor" extract_policy
    singleton_instance: _VARIABLE_EXTRACTOR_FALLBACK in defaults.py

  - plugin_name: AnsibleDefaultTaskAnnotationPolicyPlugin
    location: default_policies.py:134
    implements: PreparedTaskAnnotationPolicy protocol
    inherits_from: NormalizesMarkerPrefix
    stateless: True
    attributes:
      - COMMENT_CONTINUATION_RE
      - TASK_ENTRY_RE
      - YAML_LIKE_KEY_VALUE_RE
      - YAML_LIKE_LIST_ITEM_RE
    methods: [split_task_annotation_label, get_marker_line_re, split_task_target_payload,
              annotation_payload_looks_yaml, extract_task_annotations_for_file, task_anchor]
    delegates_to: task_annotation_strategy, task_annotation_parsing module
    registration: bootstrap.py as "task_annotation_parsing" extract_policy
    singleton_instance: _TASK_ANNOTATION_FALLBACK in defaults.py

  - plugin_name: AnsibleDefaultTaskTraversalPolicyPlugin
    location: default_policies.py:176
    implements: PreparedTaskTraversalPolicy protocol
    stateless: True
    methods:
      - iter_task_mappings(data) - yields from task_traversal_bare
      - iter_task_include_targets(data)
      - iter_task_include_edges(data)
      - expand_include_target_candidates(task, target)
      - iter_role_include_targets(task)
      - iter_dynamic_role_include_targets(task)
      - collect_unconstrained_dynamic_task_includes(...)
      - collect_unconstrained_dynamic_role_includes(...)
    delegates_to: task_traversal_bare module (all heavy lifting)
    registration: bootstrap.py as "task_traversal" extract_policy
    singleton_instance: _TASK_TRAVERSAL_FALLBACK in defaults.py

