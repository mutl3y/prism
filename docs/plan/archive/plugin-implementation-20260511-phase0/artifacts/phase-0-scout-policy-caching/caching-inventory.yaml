## Level 3: Policy Constant Collections (TASK_INCLUDE_KEYS, ROLE_INCLUDE_KEYS, etc.)
### Current State

**Current Implementation**: Proxy objects that defer lookup to bundle at runtime
- `_PolicyBackedCollectionProxy` (task_line_parsing.py)
- `_PolicyBackedRegexProxy` (task_line_parsing.py)
- Calls `require_prepared_policy()` on EVERY access (hotspot!)

**Proxy Members**:
- `TASK_INCLUDE_KEYS`: Collection proxy → `task_line_parsing.TASK_INCLUDE_KEYS`
- `ROLE_INCLUDE_KEYS`: Collection proxy → `task_line_parsing.ROLE_INCLUDE_KEYS`
- `INCLUDE_VARS_KEYS`: Collection proxy → `task_line_parsing.INCLUDE_VARS_KEYS`
- `SET_FACT_KEYS`: Collection proxy → `task_line_parsing.SET_FACT_KEYS`
- `TASK_BLOCK_KEYS`: Collection proxy → `task_line_parsing.TASK_BLOCK_KEYS`
- `TASK_META_KEYS`: Collection proxy → `task_line_parsing.TASK_META_KEYS`
- Regex patterns: `TEMPLATED_INCLUDE_REGEX_PATTERN`, `TASK_NAME_CAPTURE_PATTERN`

**Usage in Hotloops**:
```python
# task_catalog_assembly.py line 182 — HOTSPOT
for include_key in _task_include_keys(di=prepared_di):  # 10k+ calls in loop
    if include_key not in task:  # Each access = require_prepared_policy() call
        continue
```

**Current Caching**: ❌ NONE (triggers full lookup per iteration)

**Caching Opportunity**: ⭐⭐⭐⭐⭐ (Massive bottleneck)
- `_task_include_keys()` called 5000-10,000 times per scan
- Each iteration of `for include_key in ...` triggers `_current_value()` → `require_prepared_policy()`
- Estimated improvement: 100-1000x for hotloops

