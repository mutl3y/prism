## Level 4: Resolver Result Caching (Policy Plugin Factories)
### Current State

**Resolvers in `scanner_plugins/defaults.py`**:
- `resolve_task_line_parsing_policy_plugin()` — Creates/retrieves from registry
- `resolve_task_annotation_policy_plugin()`
- `resolve_task_traversal_policy_plugin()`
- `resolve_yaml_parsing_policy_plugin()`
- `resolve_jinja_analysis_policy_plugin()`
- `resolve_variable_extractor_policy_plugin()`

**Resolution Logic**:
1. Check if plugin already in bundle (already resolved)
2. Query plugin registry for plugin class
3. Instantiate or retrieve cached instance from registry
4. Return plugin instance

**Current Caching**: ⚠️ PARTIAL (registry-level caching only)
- Registry maintains singleton instances (good)
- Lookup cost: registry query + registry lookup = ~0.3-0.5ms per resolver call
- Only called once during `ensure_prepared_policy_bundle()` (during scan setup)

**Caching Opportunity**: ✅ ALREADY OPTIMIZED
- Resolvers only called once per scan (during bundle assembly)
- Not a hotspot (setup phase, not execution phase)
- Current registry caching is sufficient

