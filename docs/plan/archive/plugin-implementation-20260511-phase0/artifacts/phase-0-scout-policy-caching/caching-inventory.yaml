## Level 1: PreparedPolicyBundle (Scan-Scope Singleton)
### Current State

**Creation Point**: `scanner_plugins/bundle_resolver.py::ensure_prepared_policy_bundle()`
- Created once per scan via DI instantiation
- Stored in `scan_options["prepared_policy_bundle"]`
- Passed through DI to all scanner components
- Lifetime: entire scan execution (immutable singleton)

**Policy Members**:
- `task_line_parsing`: Ansible task-line parsing policy
- `task_annotation_parsing`: Comment-driven annotation parsing
- `task_traversal`: Dynamic include/role expansion strategy
- `yaml_parsing`: YAML loading strategy
- `jinja_analysis`: Jinja2 variable extraction policy
- `variable_extractor`: Variable discovery policy
- `comment_doc_marker_prefix`: Comment marker prefix (string)

**Caching Effectiveness**: ⭐⭐⭐⭐⭐ (100% reuse, immutable, safe)
- Immutable after creation → safe to cache across all execution
- Singleton per scan → no duplication
- Thread-safe: read-only after initialization
- Current implementation: Already singleton, no redundant creation

**Size**: ~8-12KB per bundle (minimal memory footprint)

**Access Pattern**:
- Read-only throughout scan lifecycle
- Accessed from 8+ distinct modules (variable_extractor, task_catalog_assembly, task_line_parsing, task_annotation_parsing, task_file_traversal, task_extract_adapters, etc.)
- Stored in dict, accessed via `.get(policy_name)`

