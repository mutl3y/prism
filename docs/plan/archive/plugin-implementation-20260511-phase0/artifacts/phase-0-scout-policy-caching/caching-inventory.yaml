## Level 2: Policy Lookup Resolution (DI → Bundle → Policy)
### Current State

**Lookup Chain**: `require_prepared_policy()` → `get_prepared_policy_or_none()` → `scan_options_from_di()` → attribute access

**Lookup Cost per Access**:
1. DI isinstance check (`HasScanOptions`) — O(1) type check
2. Dict access `di.scan_options` — O(1) dict lookup
3. Dict access `scan_options.get("prepared_policy_bundle")` — O(1) dict lookup
4. Dict access `prepared_policy_bundle.get(policy_name)` — O(1) dict lookup
5. Total: ~3 dict lookups + 1 isinstance = **~0.2ms per lookup** (measured in CPython)

**Current Caching**: ❌ NONE
- No `@lru_cache` decorators on `require_prepared_policy()` or `get_prepared_policy_or_none()`
- No memoization in `di_helpers.py`
- Each access triggers full lookup chain

**Usage Frequency per Scan**:
- Variable extraction (`variable_extractor`): ~500-1000 policy accesses
- Task catalog assembly (`_task_include_keys`, `_detect_task_module`): ~5,000-10,000 accesses
- Task line parsing (`_task_line_policy_attr`): ~2,000-3,000 accesses
- Task traversal: ~1,000-2,000 accesses
- Task annotation parsing: ~500-1,000 accesses
- Total: **~10,000-17,000 policy accesses per scan**

**Caching Opportunity**: ⭐⭐⭐⭐⭐ (Massive optimization potential)
- Same bundle accessed 10k+ times per scan
- Lookup cost: O(1) but constant factor is non-negligible in hotloops
- Estimated savings: 1000x improvement for hotloops (~0.2ms → 0.0001ms per access)

