## Level 5: Config Loader Caching (Policy Context, Marker Prefix)
### Current State

**Config Sources**:
- `scan_options["policy_context"]` — User-provided policy overrides
- `scan_options["comment_doc_marker_prefix"]` — Comment marker prefix
- `.prism.yml` config file — Persistent policy config

**Current Caching**: ✅ GOOD (immutable config, singleton)
- Config loaded once at scan start
- Cached in `scan_options` dict
- Immutable throughout scan
- Accessed 100-200 times per scan

**Caching Opportunity**: ✅ ALREADY OPTIMIZED
- Config loaded once, accessed occasionally
- Lookup cost negligible compared to hotloop policies

---

## Thread Safety Assessment

**Bundle Immutability**: ✅ SAFE
- PreparedPolicyBundle created once before scan starts
- All policies are immutable (frozen/read-only)
- No mutation during scan execution
- Safe for concurrent reads

**Lookup Concurrency**: ✅ SAFE
- `require_prepared_policy()` does only dict lookups (thread-safe in Python)
- GIL protects dict access
- No race conditions on read-only bundle

**Cache Invalidation**: ✅ NO INVALIDATION NEEDED
- Bundle created once, never modified
- Per-scan lifetime (invalidation via scan completion)
- No cache coherency issues

