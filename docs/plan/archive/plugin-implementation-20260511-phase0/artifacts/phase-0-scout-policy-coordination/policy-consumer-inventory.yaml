policy_system_architecture:
  policy_types: 6
  policies:
    - name: task_line_parsing
      description: Task line detection, include/role include/vars keyword resolution
      primary_consumers:
        - scanner_extract/task_line_parsing.py (10+ call sites)
        - scanner_extract/task_file_traversal.py (8+ call sites)
        - scanner_plugins/ansible/variable_discovery.py (1 call site)
      hotloop_status: "YES - proxy-backed collections accessed in inner loops"
      immutability_critical: true

    - name: task_annotation_parsing
      description: Comment annotation detection, marker line regex, prefix normalization
      primary_consumers:
        - scanner_extract/task_line_parsing.py (4+ call sites)
        - scanner_core/task_extract_adapters.py (1 call site)
        - scanner_plugins/ansible/feature_detection.py (1 call site)
      hotloop_status: "YES - marker regex resolved at runtime for each task"
      immutability_critical: true

    - name: task_traversal
      description: Task block detection, task metadata handling
      primary_consumers:
        - scanner_extract/task_file_traversal.py (6+ call sites)
      hotloop_status: "MAYBE - called per block traversal"
      immutability_critical: false

    - name: yaml_parsing
      description: YAML parsing/loading policy with parse_yaml_candidate and load_yaml_file
      primary_consumers:
        - scanner_io/loader.py (2+ call sites - load functions)
        - scanner_plugins/ansible/variable_discovery.py (1 call site)
      hotloop_status: "NO - coldpath, called only for role file loading"
      immutability_critical: false

    - name: jinja_analysis
      description: Jinja2 variable collection
      primary_consumers:
        - scanner_plugins/ansible/variable_discovery.py (1 call site - inner loop)
      hotloop_status: "YES - called for every jinja block"
      immutability_critical: true

    - name: variable_extractor
      description: Include vars file collection
      primary_consumers:
        - scanner_extract/variable_extractor.py (1+ call sites)
        - scanner_plugins/ansible/variable_discovery.py (1 call site)
      hotloop_status: "NO - coldpath, called once per file"
      immutability_critical: false

    - name: comment_doc_marker_prefix
      description: Marker prefix for comment-driven documentation
      primary_consumers:
        - scanner_core/task_extract_adapters.py (1 call site)
        - scanner_plugins/ansible/feature_detection.py (1 call site)
      hotloop_status: "NO - resolved once at bundle creation"
      immutability_critical: true

