access_pattern_classification:
  creation_time_access:
    count: 4
    locations:
      - scanner_plugins/bundle_resolver.py:ensure_prepared_policy_bundle()
      - scanner_core/scanner_context.py:__init__()
      - scanner_core/execution_request_builder.py:_assemble_execution_request()
      - api_layer/non_collection.py:_ensure_prepared_policy_bundle_for_execution_request()
    characteristic: "Policy resolved once at start, cached in scan_options"
    thread_safety: "Thread-unsafe during initialization; must serialize bundle creation"

  runtime_access:
    count: 12
    locations:
      - scanner_extract/task_file_traversal.py (7 sites)
      - scanner_extract/task_annotation_parsing.py (1 site)
      - scanner_extract/task_catalog_assembly.py (2 sites)
      - scanner_io/loader.py (2 sites)
    characteristic: "Policy read during scanning; may be called 10-100 times per scan"
    thread_safety: "Thread-safe if policy bundle is immutable"

  hotloop_access:
    count: 3
    high_risk_sites:
      - scanner_extract/task_line_parsing.py:_PolicyBackedCollectionProxy (6 module instances)
        frequency_per_scan: "500+ calls"
        risk: "Critical performance impact if require_prepared_policy() is not cached"
        current_impl: "Policy resolved on EVERY collection access via require_prepared_policy()"

      - scanner_extract/task_line_parsing.py:_PolicyBackedRegexProxy (2 module instances)
        frequency_per_scan: "100+ calls"
        risk: "Regex compilation repeated in hot path"
        current_impl: "Regex resolved on EVERY match/search call"

      - scanner_plugins/ansible/variable_discovery.py:collect_undeclared_jinja_variables
        frequency_per_scan: "100+ calls per jinja block"
        risk: "Policy lookup in innermost variable collection loop"
        current_impl: "get_prepared_policy_or_none() called for every jinja analysis"

  coldpath_access:
    count: 2
    locations:
      - scanner_io/loader.py:_get_yaml_parsing_policy() (2-10 calls per scan)
      - scanner_extract/variable_extractor.py:collect_include_vars_files() (1 call per role)
    characteristic: "Policy accessed rarely; fallback registry is acceptable"
    thread_safety: "No concurrency concerns; registry fallback is safe"

resolver_chain_analysis:
  primary_chain:
    order:
      - "1. DI container (if provided) → scan_options extraction"
      - "2. prepared_policy_bundle dict lookup from scan_options"
      - "3. Policy retrieval by key (e.g., 'task_line_parsing')"
      - "4. Return or raise ValueError"
    functions:
      - scanner_core/di_helpers.py:get_prepared_policy_or_none() [primary]
      - scanner_core/di_helpers.py:require_prepared_policy() [wraps primary]
    locations: "35+ call sites use this chain"

  secondary_chain_with_fallback:
    order:
      - "1. DI container → scan_options extraction"
      - "2. prepared_policy_bundle lookup"
      - "3. If missing, invoke registry resolver (with optional fallback)"
      - "4. Cache result in bundle"
    functions:
      - scanner_io/loader.py:_get_yaml_parsing_policy() [has fallback registry]
      - scanner_plugins/defaults.py:resolve_*_policy_plugin() [6 functions]
    locations: "Bundle resolution phase only"
    note: "YAML parser is only policy with documented fallback path"

  orchestrator_chain:
    order:
      - "1. API entry point (run_scan or similar)"
      - "2. Call plugin_facade.ensure_prepared_policy_bundle()"
      - "3. Invoke scanner_plugins.bundle_resolver.ensure_prepared_policy_bundle()"
      - "4. For each of 6 policies: resolve plugin OR use existing from bundle"
      - "5. Return complete PreparedPolicyBundle"
    entry_point: "api_layer/non_collection.py:_ensure_prepared_policy_bundle_for_execution_request()"
    exit_point: "scan_options['prepared_policy_bundle'] = bundle"
    locations: "1 orchestrator call site"

coordination_risk_matrix:
  race_condition_risk:
    severity: HIGH
    location: "policy bundle creation + cache setup"
    scenario: "Thread A and Thread B both call run_scan() simultaneously; both invoke ensure_prepared_policy_bundle()"
    impact: "Duplicate policy resolution; potential inconsistent bundle state"
    current_protection: "None documented; API entry point not explicitly thread-safe"
    mitigation_required: true

  ordering_dependency_risk:
    severity: MEDIUM
    location: "ScannerContext initialization"
    scenario: "Policy bundle must be in scan_options BEFORE ScannerContext.__init__() is called"
    impact: "ValueError raised if orchestration order violated"
    current_protection: "Explicit _require_prepared_policy_bundle() validation"
    mitigation_required: false

  state_mutation_risk:
    severity: MEDIUM
    location: "policy bundle mutation during scan"
    scenario: "If policy bundle is mutable (e.g., dict), concurrent tasks could modify it"
    impact: "Policy inconsistency across concurrent operations"
    current_protection: "bundle_resolver returns dict (mutable); no immutability guarantee"
    mitigation_required: true

  cache_invalidation_risk:
    severity: LOW
    location: "policy bundle fingerprint computation"
    scenario: "If policy values change mid-scan, cache markers become stale"
    impact: "Scan result cache incorrectly reused"
    current_protection: "Fingerprint includes all bundle values; deep-copy used in scan_options"
    mitigation_required: false

open_questions:
  - question: "Are the _PolicyBackedCollectionProxy and _PolicyBackedRegexProxy resolving policy correctly on every access, or should they cache the result?"
    context: "These proxies call require_prepared_policy(None, ...) on every operation, which means they assume policy is always available. This is inefficient in hotloops."
    type: decision_blocker
    affects: ["performance", "cache-strategy"]

  - question: "Is the prepared_policy_bundle guaranteed to be immutable once ScannerContext is initialized?"
    context: "If bundle values can change during scan, caching strategies and cache invalidation become critical."
    type: decision_blocker
    affects: ["thread-safety", "coordination-contract"]

  - question: "How is policy bundle lifecycle managed across plugin factories (VariableDiscoveryPlugin, FeatureDetectionPlugin)?"
    context: "Plugins receive DIContainer with scan_options; if scan_options['prepared_policy_bundle'] is modified, do plugins see updates?"
    type: research
    affects: ["di-ownership", "plugin-contract"]

  - question: "Is scanner_io/loader.py the only module with a fallback registry for policy resolution?"
    context: "If fallback registry is used elsewhere, we need to audit all fallback paths for failure modes."
    type: research
    affects: ["resolver-chain", "error-handling"]

  - question: "What happens if ensure_prepared_policy_bundle() is called twice with different scan_options?"
    context: "Does it overwrite existing bundle, or merge? This affects idempotency."
    type: nice_to_know
    affects: ["api-contract"]

gaps:
  - area: "Hotloop optimization strategy"
    description: "Policy-backed proxies in task_line_parsing.py call require_prepared_policy(None) on every access (500+ times per scan), but there is no caching strategy documented."
    impact: decision_blocker
    affects: ["performance", "hotspot-mitigation"]

  - area: "Thread-safety contract"
    description: "No explicit thread-safety guarantee for prepared_policy_bundle; unclear if bundle can be mutated during scan or must be immutable."
    impact: decision_blocker
    affects: ["concurrency", "multi-threading"]

  - area: "Policy bundle lifecycle and ownership"
    description: "Unclear who owns the prepared_policy_bundle after creation (ScannerContext? DIContainer? APILayer?) and what their responsibilities are for mutation/invalidation."
    impact: decision_blocker
    affects: ["coordination-contract", "ownership"]

  - area: "Fallback registry audit"
    description: "Only scanner_io/loader.py uses fallback registry documented; need to verify no other hidden fallback paths exist in resolvers."
    impact: research_blocker
    affects: ["resolver-chain", "error-handling"]

  - area: "Cache invalidation semantics"
    description: "Bundle fingerprint is computed but cache invalidation logic is not clearly documented; unclear when cache is invalidated mid-scan."
    impact: nice_to_know
    affects: ["caching-strategy"]
