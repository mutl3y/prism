    ┌─────────────┐          ┌──────────────┐      ┌──────────────┐
    │  PROPERTY   │          │    FACTORY   │      │   PLUGIN     │
    │   GETTERS   │          │  ORCHESTR.   │      │ RESOLUTION   │
    │             │          │              │      │              │
