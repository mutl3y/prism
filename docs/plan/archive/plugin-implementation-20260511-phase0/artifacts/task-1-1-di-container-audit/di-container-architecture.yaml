## Thread Safety Model (Unchanged)

```
Thread 1: factory_event_bus()        Thread 2: replace_scan_options()
    │                                    │
    ├─→ Get _cache_lock (RLock)         ├─→ Acquire _cache_lock
    │   │                                │
    │   ├─→ Check cache                 ├─→ Update _scan_options
    │   │   (protected by lock)          │
    │   │                                ├─→ _invalidate_scan_option_dependent
    │   │                                │   (still protected by lock)
    │   └─→ Release _cache_lock         │
    │                                    ├─→ Release _cache_lock
    └─→ Return result                    │
                                         └─ Done


IMPORTANT: _mocks dict is NOT thread-safe
├─ Current code assumes test-time single-threaded injection
├─ After decomposition: same assumption holds
└─ Document this in both ServiceLocator and PluginResolver

```

---

## Extraction Boundary Summary

| Concern | Current (DIContainer) | After Extraction |
| --- | --- | --- |
| **Entry Point** | DIContainer | DIContainer (facade) |
| **Public API** | All factory_*() on DIContainer | Same (delegated internally) |
| **Service Creation** | 6 factory_*() methods | Moved to ServiceLocator |
| **Plugin Resolution** | 10 factory_*_plugin() methods | Moved to PluginResolver |
| **State Ownership** | DIContainer owns all | DIContainer still owns, delegates read via properties |
| **Cache Management** | DIContainer._cache + lock | DIContainer owns; ServiceLocator reads via lock |
| **Mock Injection** | DIContainer._mocks dict | DIContainer owns; both delegates read |
| **Override Coordination** | DIContainer._call_factory_override() | DIContainer still orchestrates |
| **Backward Compat** | N/A (monolithic) | All public methods preserved on facade |
| **Test Impact** | No changes | Tests inject mocks same way (no API change) |

