## Data Flow: Service Creation (Unchanged After Decomposition)

```
Client Code
    │
    ▼
DIContainer.factory_event_bus()
    │
    ├─ Check DIContainer._mocks["event_bus"]? ──→ return (mocked)
    │
    ├─ Check DIContainer._factory_overrides["event_bus_factory"]?
    │       │
    │       ▼ DIContainer._call_factory_override()
    │       │
    │       └─→ return (overridden)
    │
    └─ ServiceLocator.factory_event_bus()
           │
           ├─ DIContainer._event_bus (singleton from init)
           │
           └─→ return EventBus instance
```

**Key Flow Points**:
1. DIContainer still acts as primary entry point (maintains backward compatibility)
2. DIContainer delegates to ServiceLocator internally
3. Mock and override checks happen in DIContainer before delegation
4. ServiceLocator accesses shared state read-only via DIContainer interface

---

## Data Flow: Plugin Resolution (Unchanged After Decomposition)

```
Client Code
    │
    ▼
DIContainer.factory_variable_discovery_plugin()
    │
    ├─ Check DIContainer._mocks["variable_discovery_plugin"]? ──→ return (mocked)
    │
    ├─ Check DIContainer._factory_overrides["variable_discovery_plugin_factory"]?
    │       │
    │       ▼ DIContainer._call_factory_override()
    │       │
    │       └─→ return (overridden)
    │
    └─ PluginResolver.factory_variable_discovery_plugin()
           │
           ├─ PluginResolver._resolve_platform_key()
           │       │
           │       ├─ DIContainer.scan_options property
           │       ├─ DIContainer.plugin_registry property
           │       │
           │       └─→ return platform_key
           │
           ├─ PluginResolver._get_registry()
           │       │
           │       ├─ DIContainer.plugin_registry property
           │       │
           │       └─→ return PluginRegistry or raise
           │
           ├─ registry.get_variable_discovery_plugin(platform_key)
           │       │
           │       └─→ return plugin_class
           │
           ├─ _construct_runtime_plugin()
           │       │
           │       ├─ Validate plugin shape (di= parameter required)
           │       ├─ plugin_class(di=self._di)
           │       │
           │       └─→ return plugin instance
           │
           └─→ return VariableDiscoveryPlugin
```

**Key Flow Points**:
1. DIContainer orchestrates mock/override checks
2. PluginResolver handles registry lookup and platform-key resolution
3. PluginResolver accesses read-only properties from DIContainer
4. Module-level `_construct_runtime_plugin()` stays at module level (reusable)

