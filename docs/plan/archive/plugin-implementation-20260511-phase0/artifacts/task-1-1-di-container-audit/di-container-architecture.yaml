## Target Architecture (Decomposed)

```
┌──────────────────────────────────────────────────────────────────┐
│                    DIContainer (Facade)                          │
│                   Configuration Coordinator                      │
├──────────────────────────────────────────────────────────────────┤
│                                                                  │
│  PUBLIC INTERFACE (unchanged, delegates to helpers):            │
│  • scan_options, registry, wiring, overrides, platform_key      │
│  • factory_*() methods all present (6+10 total)                │
│                                                                  │
│  STATE MANAGEMENT:                                             │
│  • replace_scan_options() → invalidate both delegates' caches  │
│  • inject_mock() → shared _mocks dict                          │
│  • clear_cache() → wipe both delegates' caches                │
│  • _call_factory_override() → orchestrate override invocation  │
│                                                                  │
│  DELEGATION:                                                    │
│  • service_locator: ServiceLocator                             │
│  • plugin_resolver: PluginResolver                             │
│                                                                  │
└──────────────────────────────────────────────────────────────────┘
           │                                    │
           │                                    │
    ┌──────▼──────────────┐          ┌──────────▼──────────┐
    │  ServiceLocator     │          │   PluginResolver    │
    │                     │          │                     │
    │ SERVICE CREATION    │          │ PLUGIN RESOLUTION   │
    │                     │          │                     │
    │ • event_bus()       │          │ • var_discovery()   │
    │ • context()         │          │ • feature_detect()  │
    │ • discovery()       │          │ • comment_doc()     │
    │ • detector()        │          │ • task_annot()      │
    │ • builder()         │          │ • task_line_parse() │
    │ • blocker()         │          │ • task_traversal()  │
    │                     │          │ • var_extract()     │
    │ (6 methods)         │          │ • yaml_parse()      │
    │                     │          │ • jinja_analysis()  │
    │ Uses:               │          │ • audit()           │
    │ • cache + lock      │          │                     │
    │ • mocks             │          │ (10 methods)        │
    │ • overrides         │          │                     │
    │ • snapshot_opts     │          │ Uses:               │
    │                     │          │ • registry          │
    │                     │          │ • mocks             │
    │                     │          │ • overrides         │
