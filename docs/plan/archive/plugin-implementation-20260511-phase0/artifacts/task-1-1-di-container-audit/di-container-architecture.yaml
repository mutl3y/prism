## Coupling Elimination (What Gets Separated)

```
BEFORE: All responsibilities tangled

factory_event_bus()
    ├─→ Check mocks ──────────────┐
    └─→ Check overrides ──────────┤─→ Orchestration concerns
    └─→ Return instance ──────────┘

factory_variable_discovery_plugin()
    ├─→ Check mocks ──────────────┐
    ├─→ Check overrides ──────────├─→ Orchestration concerns
    ├─→ Resolve platform key ─────┤
    ├─→ Get registry ─────────────├─→ Plugin resolution concerns
    └─→ Construct plugin ─────────┘


AFTER: Concerns separated

ServiceLocator.factory_event_bus()
    ├─→ Check mocks ──────────────┐
    ├─→ Check overrides ──────────├─→ Orchestration (delegated from DIContainer)
    └─→ Return instance ──────────┘

PluginResolver.factory_variable_discovery_plugin()
    ├─→ Resolve platform key ─────┐
    ├─→ Get registry ─────────────├─→ Plugin resolution concerns
    └─→ Construct plugin ─────────┘

DIContainer: Orchestrates mocks/overrides, then delegates
```

