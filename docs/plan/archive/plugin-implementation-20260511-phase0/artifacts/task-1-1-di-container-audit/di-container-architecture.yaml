## Cache Invalidation Flow (Coordination)

```
Client Code
    │
    ▼
DIContainer.replace_scan_options(new_options)
    │
    ├─ Update DIContainer._scan_options
    │
    ├─ DIContainer._invalidate_scan_option_dependent_cache_locked()
    │       │
    │       ├─ Remove "variable_discovery" from _cache
    │       ├─ Remove "feature_detector" from _cache
    │       │
    │       └─ (PluginResolver has no cache, but Services might recalculate)
    │
    └─ Effect: Next calls to factory_variable_discovery() will recalculate
                because cache entry was cleared
```

**Important**: Both ServiceLocator and PluginResolver rely on this invalidation. The `_cache_lock` and invalidation logic stay in DIContainer.

