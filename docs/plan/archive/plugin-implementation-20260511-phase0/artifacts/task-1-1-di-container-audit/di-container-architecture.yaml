## Network Diagram (Call Graph)

```
External Caller
    │
    ├──→ DIContainer.factory_event_bus()
    │       │
    │       └──→ DIContainer._call_factory_override("event_bus_factory")
    │       └──→ ServiceLocator.factory_event_bus()
    │               └──→ return EventBus
    │
    ├──→ DIContainer.factory_variable_discovery_plugin()
    │       │
    │       ├──→ DIContainer._call_factory_override(...)
    │       └──→ PluginResolver.factory_variable_discovery_plugin()
    │               │
    │               ├──→ PluginResolver._resolve_platform_key()
    │               │       └──→ resolve_platform_key() [module-level]
    │               │
    │               ├──→ PluginResolver._get_registry()
    │               └──→ _construct_runtime_plugin() [module-level]
    │
    ├──→ DIContainer.replace_scan_options()
    │       └──→ DIContainer._invalidate_scan_option_dependent_cache_locked()
    │
    └──→ DIContainer.inject_mock()
            └──→ DIContainer._mocks[name] = mock
```

