## Implementation Notes for Task 1.2 (Boundary Design)

1. **ServiceLocator initialization**: Pass DIContainer to constructor, store as `_di`
2. **PluginResolver initialization**: Pass DIContainer to constructor, store as `_di`
3. **DIContainer refactor**: Create both in __init__, add delegation methods
4. **Backward compatibility**: All public factory_*() methods must remain on DIContainer
5. **Internal delegation pattern**:
   ```python
   def factory_event_bus(self) -> EventBus:
       return self._service_locator.factory_event_bus()
   ```
6. **Mock/Override checks**: Remain in DIContainer before delegation
7. **Cache coordination**: DIContainer owns cache; delegates call _snapshot_scan_options() via property
