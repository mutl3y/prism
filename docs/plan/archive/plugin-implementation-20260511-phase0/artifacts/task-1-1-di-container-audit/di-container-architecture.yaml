## Shared State Access Pattern (After Decomposition)

```
┌─────────────────────────────────────────────────────────────┐
│  DIContainer (owns shared state)                            │
├─────────────────────────────────────────────────────────────┤
│  State:                                                     │
│  ├─ _mocks: dict[str, Any]                                 │
│  ├─ _cache: dict[str, Any]                                 │
│  ├─ _factory_overrides: dict[str, DIFactoryOverride]       │
│  ├─ _cache_lock: RLock                                     │
│  ├─ _registry: PluginRegistry | None                       │
│  ├─ _scan_options: ScanOptionsDict                         │
│  └─ _role_path: str                                        │
│                                                             │
│  Read-Only Properties (accessed by delegates):             │
│  ├─ .scan_options: returns snapshot (via lock)            │
│  ├─ .plugin_registry: returns _registry reference          │
│  ├─ .factory_overrides: returns _factory_overrides ref     │
│  └─ (other immutable properties)                           │
└─────────────────────────────────────────────────────────────┘
           ▲                                    ▲
           │                                    │
   ┌───────┴────────────┐            ┌─────────┴──────────┐
   │ ServiceLocator     │            │ PluginResolver     │
   │                    │            │                    │
   │ Read-only access:  │            │ Read-only access:  │
   │ • _mocks (ref)     │            │ • _mocks (ref)     │
   │ • _cache (via lock)│            │ • _factory_overr.. │
   │ • _factory_overr..│            │ • _registry (ref)  │
   │ • _role_path (ref) │            │ • _scan_opts (snap)│
   │ • _scan_opts (snap)│            │ • _role_path (ref) │
   │                    │            │                    │
   │ Own:               │            │ Own:               │
   │ • factory logic    │            │ • plugin logic     │
   │ • deferred imports │            │ • registry lookups │
   └────────────────────┘            └────────────────────┘
```

**Key Principle**: Both delegates hold a reference to `_di` (the DIContainer) and call properties/methods to access shared state, rather than holding direct references to mutable state.

