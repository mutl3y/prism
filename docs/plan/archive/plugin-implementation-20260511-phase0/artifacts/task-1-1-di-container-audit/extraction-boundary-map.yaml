## Boundary Decision Matrix

| Scenario | Classification | Stays/Moves | Reason |
| --- | --- | --- | --- |
| Public factory_*() method | SERVICE_LOCATION / PLUGIN_RESOLUTION | **Stays on DIContainer facade** | Backward compatibility; actual implementation moves |
| Internal mock checking | N/A | **Stays in DIContainer** | Orchestration concern; happens before delegation |
| Internal override checking | N/A | **Stays in DIContainer** | Orchestration concern; happens before delegation |
| Cache invalidation | STATE_MANAGEMENT | **Stays in DIContainer** | Coordinates both ServiceLocator + PluginResolver |
| Service creation (event bus) | FACTORY_ORCHESTRATION | **Move to ServiceLocator** | Clear service responsibility |
| Service creation (variable discovery) | FACTORY_ORCHESTRATION | **Move to ServiceLocator** | Clear service responsibility + circular dep handling |
| Plugin resolution via registry | PLUGIN_RESOLUTION | **Move to PluginResolver** | Clear plugin responsibility |
| Optional plugin (comment doc) | PLUGIN_RESOLUTION | **Move to PluginResolver** | Clear plugin responsibility |
| Platform key resolution | PLUGIN_RESOLUTION | **Extract to PluginResolver** | Helper method for plugin resolution |
| Registry access | PLUGIN_RESOLUTION | **Extract to PluginResolver** | Helper method for plugin resolution |

