## Risk Assessment by Extraction Type

| Risk Factor | ServiceLocator | PluginResolver | Severity |
| --- | --- | --- | --- |
| **Circular imports** | MEDIUM (deferred import preservation) | NONE | Medium |
| **Cache coordination** | MEDIUM (must respect invalidation) | NONE | Medium |
| **Test mocking** | MEDIUM (6 factory methods mocked) | MEDIUM (10 plugin factories mocked) | Medium |
| **Thread safety** | LOW (uses DIContainer lock) | LOW (stateless) | Low |
| **Backward compatibility** | HIGH (facade maintains API) | HIGH (facade maintains API) | Low |
| **Override orchestration** | LOW (handled by DIContainer) | LOW (handled by DIContainer) | Low |

