## Cross-Method Dependencies (Extraction Risk Map)

### Service Factory Dependencies

```
ServiceLocator.factory_event_bus()
  ├─ No internal dependencies
  └─ Risk: LOW

ServiceLocator.factory_scanner_context()
  ├─ No internal dependencies
  └─ Risk: LOW

ServiceLocator.factory_variable_discovery()
  ├─ _create_variable_discovery() [module-level]
  ├─ Deferred import of VariableDiscovery
  └─ Risk: MEDIUM (circular import, must preserve pattern)

ServiceLocator.factory_feature_detector()
  ├─ _create_feature_detector() [module-level]
  ├─ Deferred import of FeatureDetector
  └─ Risk: MEDIUM (circular import, must preserve pattern)

ServiceLocator.factory_variable_row_builder()
  ├─ Direct import of VariableRowBuilder
  └─ Risk: LOW

ServiceLocator.factory_blocker_fact_builder()
  ├─ Fallback import from scanner_plugins.defaults
  └─ Risk: LOW (import guard present)
```

### Plugin Resolution Dependencies

```
PluginResolver.factory_variable_discovery_plugin()
  ├─ _resolve_platform_key()
  ├─ _get_registry()
  ├─ registry.get_variable_discovery_plugin(platform_key)
  ├─ _construct_runtime_plugin() [module-level]
  └─ Risk: LOW (standard pattern)

PluginResolver.factory_feature_detection_plugin()
  ├─ _resolve_platform_key()
  ├─ _get_registry()
  ├─ registry.get_feature_detection_plugin(platform_key)
  ├─ _construct_runtime_plugin() [module-level]
  └─ Risk: LOW (standard pattern)

PluginResolver.factory_comment_driven_doc_plugin()
  ├─ No registry access
  ├─ Mock/override only
  └─ Risk: NONE

PluginResolver.factory_*_policy_plugin() [8 methods]
  ├─ No registry access
  ├─ Mock/override only
  └─ Risk: NONE

PluginResolver.factory_audit_plugin()
  ├─ No registry access
  ├─ Mock/override only
  └─ Risk: NONE
```

### Shared State Dependencies

```
DIContainer → ServiceLocator
  └─ Accessed via properties:
     ├─ DIContainer.scan_options (thread-safe snapshot)
     ├─ DIContainer.factory_overrides (read-only ref)
     ├─ DIContainer._mocks (shared dict)
     └─ DIContainer._cache_lock (for coordinated locking)

DIContainer → PluginResolver
  └─ Accessed via properties:
     ├─ DIContainer.scan_options (thread-safe snapshot)
     ├─ DIContainer.plugin_registry (read-only ref)
     ├─ DIContainer.factory_overrides (read-only ref)
     └─ DIContainer._mocks (shared dict)

ServiceLocator ← DIContainer
  └─ ServiceLocator receives DIContainer reference as constructor arg

PluginResolver ← DIContainer
  └─ PluginResolver receives DIContainer reference as constructor arg
```

