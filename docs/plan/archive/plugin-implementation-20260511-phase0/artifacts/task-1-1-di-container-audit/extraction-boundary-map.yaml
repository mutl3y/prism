## Extraction Sequence (Recommended Order)

### Phase 1: Extract PluginResolver (lower risk)

1. Create PluginResolver class
2. Copy 10 plugin factory methods to PluginResolver
3. Extract `_get_registry()` and `_resolve_platform_key()` helpers
4. Update PluginResolver methods to access DIContainer via `self._di`
5. Add delegation methods to DIContainer (keep public interface)
6. Update tests for PluginResolver
7. Verify no regressions

### Phase 2: Extract ServiceLocator (medium risk)

1. Create ServiceLocator class
2. Copy 6 service factory methods to ServiceLocator
3. Update ServiceLocator methods to access DIContainer via `self._di`
4. Preserve deferred import patterns exactly
5. Add delegation methods to DIContainer
6. Update tests for ServiceLocator
7. Verify cache coordination still works
8. Verify deferred imports still work

### Phase 3: Refactor DIContainer (facade pattern)

1. Instantiate ServiceLocator and PluginResolver in DIContainer.__init__()
2. Update all public factory_*() methods to delegate
3. Keep all properties and state management in DIContainer
4. Verify backward compatibility (public API unchanged)
5. Run full test suite

