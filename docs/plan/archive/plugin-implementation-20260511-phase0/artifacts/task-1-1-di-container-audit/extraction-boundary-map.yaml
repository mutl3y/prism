### 2. MOVE TO ServiceLocator (New Class)

| Method | Current Lines | Category | Mock Support? | Override Support? | Cache? | Circular Dep? |
| --- | --- | --- | --- | --- | --- | --- |
| `factory_event_bus()` | 4 | Service Factory | ✅ | ✅ | ❌ (singleton) | ❌ |
| `factory_scanner_context()` | 20 | Service Factory | ✅ | ✅ | ❌ (runtime) | ❌ |
| `factory_variable_discovery()` | 20 | Service Factory | ✅ | ✅ | ✅ | ✅ (deferred) |
| `factory_feature_detector()` | 20 | Service Factory | ✅ | ✅ | ✅ | ✅ (deferred) |
| `factory_variable_row_builder()` | 6 | Service Factory | ❌ | ❌ | ✅ | ❌ |
| `factory_blocker_fact_builder()` | 10 | Service Factory | ❌ | ✅ | ✅ | Partial (import guard) |

**Subtotal**: 6 methods → ServiceLocator

**Implementation Notes**:
- ServiceLocator will be initialized in DIContainer.__init__()
- ServiceLocator(di: DIContainer) → stores `self._di`
- All 6 methods delegate mock/override checks to DIContainer first
- ServiceLocator accesses shared state via DIContainer properties
- Deferred imports stay in factory methods or module-level helpers

**Threading**: ServiceLocator method calls are protected by DIContainer._cache_lock when accessing cached values

