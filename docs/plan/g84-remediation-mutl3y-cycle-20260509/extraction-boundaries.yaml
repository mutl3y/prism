### Phase 3: Clarify DIContainer Orchestration (OPTIONAL, FOLLOW-UP)
**Objective**: Minimize DIContainer responsibility to pure orchestration  
**Impact**: ~20 lines of pure logic; rest is delegation  
**Risk**: Low (mostly renames + documentation)  

```yaml
DIContainer_After_Phase1_And_2:
  retains_ownership:
    # Orchestration: delegates to sub-classes
    - factory_event_bus()                      # Delegates to ServiceLocator
    - factory_scanner_context()                # Delegates to ServiceLocator
    - factory_variable_discovery()             # Delegates to ServiceLocator
    - factory_feature_detector()               # Delegates to ServiceLocator
    - factory_variable_row_builder()           # Delegates to ServiceLocator
    - factory_policy_registry()                # Delegates to ServiceLocator
    - factory_policy_manager()                 # Delegates to ServiceLocator
    - factory_variable_discovery_plugin()      # Delegates to Gateway/PluginResolver
    - factory_feature_detection_plugin()       # Delegates to Gateway/PluginResolver
    - factory_comment_driven_doc_plugin()      # Delegates to Gateway/PluginResolver
    - factory_task_annotation_policy_plugin()  # Delegates to Gateway/PluginResolver
    - factory_task_line_parsing_policy_plugin() # Delegates to Gateway/PluginResolver
    - factory_task_traversal_policy_plugin()   # Delegates to Gateway/PluginResolver
    - factory_variable_extractor_policy_plugin() # Delegates to Gateway/PluginResolver
    - factory_yaml_parsing_policy_plugin()     # Delegates to Gateway/PluginResolver
    - factory_jinja_analysis_policy_plugin()   # Delegates to Gateway/PluginResolver
    - factory_audit_plugin()                   # Delegates to Gateway/PluginResolver

    # Container management: cache, wiring, state
    - replace_scan_options()                   # Invalidates caches (delegated to ServiceLocator)
    - __init__()                               # Initialization (create ServiceLocator, PluginResolver)
    - _call_factory_override()                 # Override dispatch (kept here, minimal)
    - inject_mock()                            # Testing support
    - clear_mocks()                            # Testing support
    - clear_cache()                            # Testing support

  structure_after_refactoring:
    - DIContainer: ~200 lines (pure orchestration + properties)
      ├─ ServiceLocator: ~200 lines (service lifecycle + caching)
      ├─ PluginResolver: ~150 lines (plugin instantiation)
      ├─ MockAndOverrideGateway: ~30 lines (Optional Phase 2)
      └─ DI Helpers: ~50 lines (module-level utilities, existing)

  readability_improvement:
    Before: 1000+ lines (mixed concerns)
    After:  ~630 lines (clear seams + reduced DIContainer to orchestration only)
```

