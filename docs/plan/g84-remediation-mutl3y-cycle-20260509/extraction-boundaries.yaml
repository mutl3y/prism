# These all stay public ✅
container.factory_event_bus()
container.factory_scanner_context()
container.factory_variable_discovery()
container.factory_feature_detector()
container.factory_variable_row_builder()
container.factory_policy_registry()
container.factory_policy_manager()
container.factory_variable_discovery_plugin()
container.factory_feature_detection_plugin()
# ... all 18 public methods unchanged

# Internal delegation hidden:
# di.factory_scanner_context()
#   → locator.factory_scanner_context()  (AFTER Phase 1)
#     → DIContainer._service_locator.factory_scanner_context()
#       → ScannerContext(...)
```

