# Extraction Boundaries: Proposed DI Container Refactoring Plan

**Phase**: Q2 Initiative 1, Phase 0 (Architecture Review)  
**Target Refactoring**: Decompose DIContainer into focused responsibility classes  
**Current State**: Partial extraction (PluginResolver extracted, ServiceLocator stub exists)  
**Proposed Target**: Full extraction with clear seams  

---

## Three-Phase Refactoring Strategy

### Phase 1: Consolidate ServiceLocator (RECOMMENDED FIRST)
**Objective**: Move all service lifecycle/caching logic into ServiceLocator  
**Impact**: ~70 lines moved; DIContainer shrinks ~15%  
**Risk**: Low (already partially extracted; proven pattern in PluginResolver)  

```yaml
ServiceLocator:
  owns:
    - factory_event_bus()                      # Already delegated ✅
    - factory_scanner_context()                # New: move from DIContainer
    - factory_variable_discovery()             # New: move from DIContainer
    - factory_feature_detector()               # New: move from DIContainer
    - factory_variable_row_builder()           # New: move from DIContainer
    - factory_policy_registry()                # New: move from DIContainer
    - factory_policy_manager()                 # New: move from DIContainer
  internal_methods:
    - _create_scanner_context()                # Internal factory helper
    - _create_variable_discovery()             # Already exists at module level
    - _create_feature_detector()               # Already exists at module level
    - replace_scan_options()                   # Already delegates to DI; update
  dependencies:
    - DIContainer._cache (access to cache dict + lock)
    - DIContainer._mocks (for mock injection)
    - DIContainer._factory_overrides (for override dispatch)
    - DIContainer._role_path (readonly)
    - DIContainer._scan_options (readonly)
    - DIContainer._scanner_context_wiring (readonly)

  data_flow:
    - Reads: DIContainer state (cache, mocks, overrides, config)
    - Writes: DIContainer._cache (service instances)
    - Thread Safety: Uses DIContainer._cache_lock for all cache operations

  interface_changes:
    - DIContainer.factory_event_bus() stays public (backward compat)
    - DIContainer.factory_scanner_context() stays public (backward compat)
    - ServiceLocator becomes primary owner (internal)
    - Mock/override checks stay in DIContainer (remain orchestrator)
```

**Rationale**:
- PluginResolver already proves single-responsibility extraction works
- ServiceLocator is thread-safe, cache-aware, and stateless
- DIContainer retains override/mock logic (it's the "gateway")
- Call sites unchanged (they call di.factory_*(), not locator.factory_*() directly)

---

### Phase 2: Extract Mock/Override Gateway (OPTIONAL, FOLLOW-UP)
**Objective**: Deduplicate the mock → override → delegate pattern (used 12 times)  
**Impact**: ~40 lines moved; eliminates boilerplate; improves testability  
**Risk**: Medium (new abstraction; needs careful API design)  

```yaml
MockAndOverrideGateway:
  owns:
    - route_to_resolver()                      # Central mock/override dispatcher
    - Encapsulates: mock check → override check → delegate logic
  
  public_methods:
    - route_to_resolver(name, delegate_fn) -> object
      """
      Args:
        name: Mock/override key (e.g., "variable_discovery_plugin")
        delegate_fn: Callable that executes resolver logic
      
      Returns:
        Mock result, override result, or delegate_fn() result
      """

  used_by:
    - factory_variable_discovery_plugin()
    - factory_feature_detection_plugin()
    - factory_comment_driven_doc_plugin()
    - factory_task_annotation_policy_plugin()
    - factory_task_line_parsing_policy_plugin()
    - factory_task_traversal_policy_plugin()
    - factory_variable_extractor_policy_plugin()
    - factory_yaml_parsing_policy_plugin()
    - factory_jinja_analysis_policy_plugin()
    - factory_audit_plugin()

  benefit:
    - 10 methods reduce to single-line dispatcher calls
    - Each plugin method becomes: return gateway.route_to_resolver("plugin_name", resolver_fn)
    - Centralizes mock/override policy
    - Easier to add new routing strategies (tracing, logging, caching)

  risk:
    - Adds indirection to call stack (may affect debuggability)
    - New abstraction to maintain
    - Only beneficial if extracted correctly (stay in DIContainer class, don't extract to separate file)
```

**Decision**: DEFER this to Phase 1B (after Phase 1 proves servicelocator extraction successful).

