## SECTION 7: Migration Guide for Future Consumers

future_consumer_guide: |
  
  ## If You Need to Use Marker-Prefix
  
  ### DO:
  1. Accept marker_prefix as function parameter (from bundle)
     ✅ def process_tasks(marker_prefix: str, ...): ...
  
  2. Get from bundle in scanner_core functions
     ✅ prefix = bundle.get("comment_doc_marker_prefix")
  
  3. Validate marker-prefix at function entry
     ✅ if not isinstance(prefix, str): raise ValueError(...)
  
  4. Use for pattern matching only
     ✅ task_names = [t for t in tasks if f"@{prefix}_task" in t]
  
  5. Document MP1 compliance in docstring
     ✅ """
         Process tasks using ingress-owned marker-prefix.
         COMPLIANCE: Marker-prefix sourced from bundle (MP1).
         """
  
  ### DON'T:
  1. Import marker config directly in scanner_core
     ❌ from prism.scanner_config import DEFAULT_DOC_MARKER_PREFIX
  
  2. Hardcode marker-prefix values
     ❌ prefix = "prism"
  
  3. Compute marker-prefix from file/content
     ❌ prefix = extract_prefix_from_readme(file)
  
  4. Override/modify bundle['comment_doc_marker_prefix']
     ❌ bundle["comment_doc_marker_prefix"] = new_value
  
  5. Use marker-prefix without validation
     ❌ if marker_prefix:  # WRONG; must be non-empty string

