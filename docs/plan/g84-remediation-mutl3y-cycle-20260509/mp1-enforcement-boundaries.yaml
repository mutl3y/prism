## SECTION 5: Test Coverage Boundaries (Compliance Tests)

test_coverage_matrix:
  
  - test_suite: "MP1 Boundary Tests"
    test_file: "src/prism/tests/test_mp1_enforcement.py"
    test_cases:
      
      - test_id: "test_marker_prefix_sourcing_from_bundle"
        focus: "Marker-prefix always comes from bundle"
        checks:
          - "task_extract_adapters receives marker_prefix from bundle projection"
          - "Feature detection gets marker_prefix from bundle"
          - "No functions compute marker_prefix independently"
        coverage: "All consumer functions in task_extract_adapters.py"
      
      - test_id: "test_marker_prefix_immutability_after_projection"
        focus: "Bundle['comment_doc_marker_prefix'] immutable after creation"
        checks:
          - "bundle.get('comment_doc_marker_prefix') unchanged after task extraction"
          - "No code path modifies bundle['comment_doc_marker_prefix']"
          - "Plugin execution does not alter marker-prefix in bundle"
        coverage: "All plugin execution paths (feature detection, task line parsing)"
      
      - test_id: "test_plugin_cannot_override_marker_prefix"
        focus: "Plugins cannot modify or bypass marker-prefix"
        checks:
          - "Plugin receives immutable bundle copy"
          - "Attempt to modify bundle fails or is prevented"
          - "Plugin must accept marker_prefix as parameter, not override"
        coverage: "AnsibleFeatureDetectionPlugin, AnsibleTaskLineParsingPlugin"
      
      - test_id: "test_marker_prefix_api_boundary_projection"
        focus: "API boundary correctly projects marker-prefix to bundle"
        checks:
          - "non_collection.py passes marker-prefix through correctly"
          - "collection.py maintains marker-prefix consistency across batch"
          - "ExecutionRequest builder includes marker-prefix in bundle"
        coverage: "api_layer/non_collection.py, api_layer/collection.py"
      
      - test_id: "test_marker_prefix_normalization"
        focus: "Marker-prefix normalized via canonical path"
        checks:
          - "scan_options['comment_doc_marker_prefix'] normalized to bundle"
          - "policy_context.comment_doc.marker.prefix fallback works"
          - "DEFAULT_DOC_MARKER_PREFIX used when not provided"
        coverage: "scanner_plugins/bundle_resolver.ensure_prepared_policy_bundle"

  - test_suite: "MP1 Violation Detection Tests"
    test_file: "src/prism/tests/test_mp1_violation_detection.py"
    test_cases:
      
      - test_id: "test_detect_marker_import_in_scanner_core"
        focus: "AST linter detects forbidden imports"
        detection: "scanner_core modules importing scanner_config.marker"
        expected_result: "Linter reports CRITICAL violation"
      
      - test_id: "test_detect_bundle_mutation_outside_resolver"
        focus: "AST linter detects bundle mutation"
        detection: "Code outside bundle_resolver modifying bundle['comment_doc_marker_prefix']"
        expected_result: "Linter reports CRITICAL violation"
      
      - test_id: "test_detect_hardcoded_marker_assumption"
        focus: "Pattern detector finds hardcoded marker-prefix"
        detection: "Code like marker_prefix = 'prism' (not DEFAULT_DOC_MARKER_PREFIX)"
        expected_result: "Linter reports HIGH violation"

