## 2. Ruff Linting Rules (flake8-compatible)

### 2.1 Rule: Layer Import Violations (Custom)

**Rule Code**: `LB001` (Layer Boundary)

```toml
# pyproject.toml
[tool.ruff.lint]
extend-select = ["LB"]

[tool.ruff.lint.isort]
# Ensure imports follow layer boundaries
known-first-party = ["prism"]
force-sort-within-sections = true

[tool.ruff.lint.flake8-import-order]
# Custom import grouping by layer
# Layer 0 (core) cannot import from layers 1-7
# Layer 1 (extract) cannot import from layers 3-7
# etc.
```

### 2.2 Implementation: Custom Ruff Plugin (Pseudo-Code)

```yaml
violations:
  # Violation L1→L4 (Extract imports I/O)
  - rule: "LB-1001"
    id: "layer_skip_violation"
    name: "Layer Skip Violation: Lower layer imports higher layer"
    severity: "error"
    pattern: "^from prism\\.scanner_io\\.(loader|output_orchestrator)"
    apply_to:
      - "src/prism/scanner_extract/**/*.py"
    message: "scanner_extract must not import from scanner_io (Layer 4). Move utilities to scanner_data or scanner_core."
    affected_files:
      - "scanner_extract/variable_extractor.py"
      - "scanner_extract/discovery.py"
      - "scanner_extract/dataload.py"
      - "scanner_extract/task_file_traversal.py"

  # Violation L3→L1 (Ansible plugin imports Extract)
  - rule: "LB-1002"
    id: "plugin_layer_internals_violation"
    name: "Plugin-to-Extract Direct Import Violation"
    severity: "error"
    pattern: "^from prism\\.scanner_extract\\.(task_|variable_|discovery)"
    apply_to:
      - "src/prism/scanner_plugins/**/*.py"
    except:
      - "src/prism/scanner_plugins/defaults.py"  # Facade seam
    message: "scanner_plugins must use DI/Core APIs, not Extract internals. Use PolicyManager or Core layer."
    affected_files:
      - "scanner_plugins/ansible/extract_utils.py"
      - "scanner_plugins/ansible/**/*.py" (30+ occurrences)

  # Intentional: L0 TYPE_CHECKING import (allowed)
  - rule: "LB-1003"
    id: "type_checking_import_allowed"
    name: "Type-Checking Import (Allowed)"
    severity: "ignore"
    pattern: "^if TYPE_CHECKING:.*from prism\\.scanner_kernel"
    apply_to:
      - "src/prism/scanner_core/**/*.py"
    message: "TYPE_CHECKING imports allowed (no runtime circular dependency)"
    affected_files:
      - "scanner_core/protocols_runtime.py"
```

