## 3. Test-Based Enforcement (MP1 Pattern)

### 3.1 Test Suite: Import Boundary Tests

**File**: `src/prism/tests/test_layer_boundaries.py`

```python
# Pseudo-code structure (implementation follows MP1 pattern)

import ast
import sys
from pathlib import Path
from typing import NamedTuple

class ImportViolation(NamedTuple):
    source_file: str
    import_statement: str
    violation_type: str  # "upward" | "skip" | "cross"
    severity: str        # "high" | "medium" | "low"

# Layer definitions
LAYERS = {
    "L0_CORE": "scanner_core",
    "L1_EXTRACT": "scanner_extract",
    "L2_CONFIG": "scanner_config",
    "L3_PLUGINS": "scanner_plugins",
    "L4_IO": "scanner_io",
    "L5_README": "scanner_readme",
    "L5_REPORTING": "scanner_reporting",
    "L6_KERNEL": "scanner_kernel",
    "L7_API": "api_layer",
}

FORBIDDEN_IMPORTS = {
    "L1_EXTRACT": [
        "scanner_io",          # Violation LB-1001
        "scanner_plugins",
        "scanner_readme",
        "scanner_reporting",
        "scanner_kernel",
        "api_layer",
    ],
    "L3_PLUGINS": [
        "scanner_extract",     # Violation LB-1002
        "scanner_io",
        "scanner_readme",
        "scanner_reporting",
        "scanner_kernel",
        "api_layer",
    ],
    "L0_CORE": [
        "scanner_extract",
        "scanner_io",
        "scanner_plugins",
        "scanner_readme",
        "scanner_reporting",
        "scanner_kernel",
        "api_layer",
    ],
}

ALLOWED_EXCEPTIONS = {
    "TYPE_CHECKING_IMPORTS": [
        ("scanner_core/protocols_runtime.py", "scanner_kernel"),
    ],
    "FACADE_SEAMS": [
        ("scanner_plugins/defaults.py", "*"),  # Facade allowed
        ("scanner_readme/plugin_seams.py", "scanner_plugins"),  # Intentional seam
        ("api_layer/**", "*"),  # API facade
    ],
}

def test_layer_boundary_l1_extract_no_io_imports():
    """L1 (Extract) must not import from L4 (I/O)."""
    violations = find_import_violations("scanner_extract", ["scanner_io"])
    assert len(violations) == 0, f"Found L1→L4 violations: {violations}"

def test_layer_boundary_l3_plugins_no_extract_internals():
    """L3 (Plugins) must not import Extract layer internals."""
    violations = find_import_violations("scanner_plugins", [
        "scanner_extract.task_",
        "scanner_extract.variable_",
        "scanner_extract.discovery",
    ])
    assert len(violations) == 0, f"Found L3→L1 violations: {violations}"

def test_layer_boundary_l0_core_no_upward_imports():
    """L0 (Core) must not import from any higher layer."""
    forbidden = [
        "scanner_extract", "scanner_io", "scanner_plugins",
        "scanner_readme", "scanner_reporting", "scanner_kernel",
        "api_layer", "cli_app"
    ]
    violations = find_import_violations("scanner_core", forbidden)
    
    # Allow TYPE_CHECKING imports
    violations = [v for v in violations if "TYPE_CHECKING" not in v.import_statement]
    assert len(violations) == 0, f"Found L0 upward violations: {violations}"

def test_circular_dependencies_none():
    """No circular dependencies allowed."""
    cycles = detect_circular_imports("src/prism")
    assert len(cycles) == 0, f"Found circular dependencies: {cycles}"
```

