## 4. Remediation Actions (For Phase 1 Planning)

### 4.1 Violation LB-1001: L1→L4 (Extract imports I/O)

**Affected Files**: 4 files, 8 imports

| File | Import | Fix Strategy |
|------|--------|--------------|
| `scanner_extract/variable_extractor.py` (line 17) | `load_yaml_file` | Move to scanner_data or L0 helpers |
| `scanner_extract/discovery.py` (lines 11-13) | `_ordered_parallel_map`, `load_yaml_file`, `parse_yaml_candidate` | Move to scanner_data |
| `scanner_extract/dataload.py` (line 8) | `load_yaml_file`, `parse_yaml_candidate` | Move to scanner_data |
| `scanner_extract/task_file_traversal.py` (line 15) | `parse_yaml_candidate` | Move to scanner_data |

**Recommended Fix**: Create `scanner_data/yaml_utils.py` with:
- `load_yaml_file()`
- `parse_yaml_candidate()`
- `_ordered_parallel_map()`

**Effort**: Low (2-3 hours)  
**Risk**: Low (pure utility move, no logic change)  
**Test Coverage**: Existing tests should pass without modification

### 4.2 Violation LB-1002: L3→L1 (Ansible plugin imports Extract)

**Affected Files**: 1 file, 30+ import lines

| File | Imports | Fix Strategy |
|------|---------|--------------|
| `scanner_plugins/ansible/extract_utils.py` | Direct imports from scanner_extract (30+ lines) | Refactor to use DI/Core APIs or create plugin interface |

**Recommended Fix Option A**: Use DI/PolicyManager pattern
- Create plugin interface in `scanner_plugins/interfaces.py`
- Ansible plugin delegates to PolicyManager (not direct Extract imports)
- Extract changes → Policy changes → Plugin still works

**Recommended Fix Option B**: Facade seam pattern
- Create `scanner_plugins/ansible/adapters.py` (seam file)
- All Extract imports centralized in one adapter file
- Changes localized to one place

**Effort**: High (8-12 hours)  
**Risk**: High (Ansible plugin behavior change risk)  
**Test Coverage**: Requires comprehensive Ansible plugin tests

