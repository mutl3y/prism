## 5. CI Integration Plan

### 5.1 Enforcement Gate (Phase 2)

```yaml
# .github/workflows/layer-boundary-check.yml
name: Layer Boundary Check
on: [pull_request, push]

jobs:
  layer-boundaries:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Run layer boundary tests
      - run: pytest src/prism/tests/test_layer_boundaries.py -v
        name: "Layer Boundary Tests"
        id: test-boundaries
      
      # Step 2: Run ruff linting (custom rules)
      - run: ruff check src/prism --select LB
        name: "Ruff Layer Boundary Rules"
        id: ruff-boundaries
      
      # Step 3: Detect circular dependencies
      - run: python scripts/detect_circular_deps.py src/prism
        name: "Circular Dependency Check"
        id: circular-deps
      
      # Step 4: Report violations
      - if: failure()
        run: |
          echo "❌ Layer boundary violations found"
          echo "See layer-dependency-audit.md for remediation plan"
          exit 1
        name: "Violation Report"

  merge-gate:
    runs-on: ubuntu-latest
    needs: [layer-boundaries]
    steps:
      - if: needs.layer-boundaries.result == 'success'
        run: echo "✅ Layer boundaries verified — ready to merge"
      - if: needs.layer-boundaries.result == 'failure'
        run: exit 1
```

### 5.2 Reporting

