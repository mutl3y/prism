## 6. Exception Handling

### 6.1 TYPE_CHECKING Imports (Allowed)

**Pattern**: Allowed in any layer, no runtime risk

```python
# ✅ Allowed
if TYPE_CHECKING:
    from prism.scanner_kernel.plugin_name_resolver import RoutePreflightRuntimeCarrier
```

**Rule**: `if TYPE_CHECKING:` guards exempt from layer checks

### 6.2 Facade Seams (Allowed)

**Files** (Exceptions):
- `api_layer/**` (L7 facade)
- `cli_app/**` (L7 CLI facade)  
- `api.py`, `cli.py`, `repo_services.py` (L7 top-level facades)
- `scanner_plugins/defaults.py` (L3 facade)
- `scanner_readme/plugin_seams.py` (L5 plugin seam)

**Rule**: Facade files allowed to break layer rules with documentation

