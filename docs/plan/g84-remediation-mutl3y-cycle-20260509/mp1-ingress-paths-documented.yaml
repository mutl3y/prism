ingress_precedence_matrix:
  title: Marker-Prefix Resolution Priority (Highest to Lowest)
  
  priority_order:
    1: Direct API Parameter (PATH 1) — comment_doc_marker_prefix in scan_options
    2: Policy Context Nested (PATH 2) — policy_context["comment_doc"]["marker"]["prefix"]
    3: CLI Flag (PATH 6) — --marker-prefix (routes to PATH 1)
    4: Configuration File (PATH 7) — policy.yaml (routes to PATH 2)
    5: Pre-Assembled Bundle (PATH 5) — prepared_policy_bundle already set
    6: Policy Context Flat Alias (PATH 3) — policy_context["comment_doc_marker_prefix"] (not implemented)
    7: Default Constant (PATH 4) — DEFAULT_DOC_MARKER_PREFIX = "prism"

  matrix:
    - scenario: API caller with direct param + policy context
      winner: PATH 1 (Direct API Parameter)
      reason: Direct parameter has highest priority
    
    - scenario: CLI --marker-prefix + policy.yaml
      winner: PATH 6 (CLI Flag) → PATH 1 (Direct Parameter)
      reason: CLI flag converted to direct param, which wins over config file
    
    - scenario: Pre-assembled bundle + no override
      winner: PATH 5 (Pre-Assembled Bundle)
      reason: Bundle value preserved if not overridden
    
    - scenario: Policy context nested + nothing else
      winner: PATH 2 (Policy Context Nested)
      reason: Second-priority path when PATH 1 not provided
    
    - scenario: No parameters provided at all
      winner: PATH 4 (Default Constant)
      reason: Final fallback to "prism"

