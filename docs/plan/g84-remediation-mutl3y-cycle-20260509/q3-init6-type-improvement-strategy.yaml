plan_id: q3-init6-type-improvement-strategy
created_at: "2026-05-09"
created_by: Scout-Q3Init6TypeSafety
objective: "Define 3 strategic approaches (A/B/C) for expanding type safety from Q2 baselines"
status: in_progress

strategic_options:
  option_a:
    name: "Aggressive Full-Coverage"
    description: "Add types to ALL modules (including tests). Complete type safety across 253 files."
    scope:
      production_modules: 140
      test_modules: 60
      config_modules: 10
      total_functions: 1200
    effort_estimate:
      weeks: "5-6"
      sprints: 2
      person_weeks: 10-12
      estimated_cost: "$25k-30k"
    phases:
      phase_1_di_unblock:
        description: "Fix DI container type erasure (decision blocker)"
        files:
          - src/prism/scanner_core/di.py
          - src/prism/scanner_core/di_helpers.py
        estimated_time: "0.5 week"
        impact: "Unblocks 15+ dependent modules"
      phase_2_extraction_layer:
        description: "Typing for scanner_extract/* and feature_detection"
        files:
          - src/prism/scanner_extract/task_line_parsing.py
          - src/prism/scanner_extract/task_file_traversal.py
          - src/prism/scanner_extract/task_annotation_parsing.py
          - src/prism/scanner_extract/variable_extractor.py
          - src/prism/scanner_plugins/ansible/feature_detection.py
        estimated_time: "2 weeks"
        impact: "Reduces mypy errors from 80 → 30"
      phase_3_plugin_suite:
        description: "Complete typing for ansible plugins, YAML, Jinja, comment-doc parsers"
        files:
          - src/prism/scanner_plugins/ansible/*
          - src/prism/scanner_plugins/parsers/*
        estimated_time: "2 weeks"
        impact: "Reduces mypy errors from 30 → 10"
      phase_4_test_suite:
        description: "Type test fixtures, parametrizations, assertions"
        files:
          - src/prism/tests/test_*.py (all 35+ test error files)
        estimated_time: "1 week"
        impact: "Reduces mypy errors from 10 → 0"
      phase_5_api_cli_layer:
        description: "Fix API/CLI boundary signature mismatches"
        files:
          - src/prism/api.py
          - src/prism/cli.py
          - src/prism/api_layer/*
        estimated_time: "0.5 week"
        impact: "Eliminates API signature errors"
    pros:
      - ✅ 100% mypy clean (zero errors)
      - ✅ Strongest type safety guarantees
      - ✅ IDE tooling fully enabled (autocomplete, refactoring)
      - ✅ Future refactoring is low-risk
      - ✅ Sets precedent for platform expansion (K8s, Terraform)
    cons:
      - ❌ Highest effort (5-6 weeks)
      - ❌ Touches test layer (high change volume, lower ROI)
      - ❌ May require test fixture redesign
      - ❌ Requires sustained focus
    risk_factors:
      - Test suite typing is high-touch, low-payoff (test code is already validated by CI)
      - Over-engineering test layer may introduce brittleness
    decision_gates:
      - DI type erasure resolution (architecture decision)
      - API signature alignment (backward-compat check)
      - Test fixture protocol design (test infra decision)
    mypy_outcome: "Found 0 errors"
    recommended_for: "Long-term platform stability; when test layer is ready for refactoring"

  option_b:
    name: "Targeted High-Value (RECOMMENDED)"
    description: "Focus on top 10 high-impact production modules. 80% of benefit with 40% effort."
    scope:
      production_modules: 100 (top 10 + their consumers)
      test_modules: 0 (excluded)
      config_modules: 5
      total_functions: 600
      coverage_target: "90% return types, 85% arg types"
    effort_estimate:
      weeks: "2-3"
      sprints: 1
      person_weeks: 4-5
      estimated_cost: "$10k-12k"
    phases:
      phase_1_di_unblock:
        description: "Fix DI container type erasure (critical blocker)"
        files:
          - src/prism/scanner_core/di.py
          - src/prism/scanner_core/di_helpers.py
        estimated_time: "0.5 week"
        impact: "Unblocks extraction layer, feature detection, plugin layer"
      phase_2a_extraction_core:
        description: "Type extraction layer modules (high call frequency)"
        files:
          - src/prism/scanner_extract/task_line_parsing.py
          - src/prism/scanner_extract/task_file_traversal.py
          - src/prism/scanner_extract/task_catalog_assembly.py
          - src/prism/scanner_extract/task_annotation_parsing.py
        estimated_time: "1 week"
        impact: "9 errors → 0 in extraction layer"
      phase_2b_feature_detection:
        description: "Type feature_detection and variable discovery plugins"
        files:
          - src/prism/scanner_plugins/ansible/feature_detection.py
          - src/prism/scanner_plugins/ansible/variable_discovery.py
          - src/prism/scanner_plugins/ansible/variable_extractor.py
          - src/prism/scanner_plugins/ansible/default_policies.py
        estimated_time: "1 week"
        impact: "12 errors → 0 in plugin suite"
      phase_3_api_alignment:
        description: "Fix API/CLI signature mismatches"
        files:
          - src/prism/api.py
          - src/prism/cli.py
        estimated_time: "0.5 week"
        impact: "4 errors → 0 in API layer"
      phase_4_deferred:
        description: "Test suite typing deferred to Q3b"
        files: []
        estimated_time: "0 week (Q3b)"
        impact: "35 test errors remain, revisited later"
    pros:
      - ✅ 40% less effort than Option A
      - ✅ 70-80% reduction in mypy errors (80 → 15-20)
      - ✅ Covers all high-frequency call paths
      - ✅ Minimal test infrastructure changes
      - ✅ Achieves 90%+ type safety in production code
      - ✅ High ROI (effort vs. payoff)
      - ✅ Leaves decision gates open for test layer strategy
    cons:
      - ⚠️ Test suite remains untyped (35 errors persist)
      - ⚠️ Future test changes may miss type issues
      - ⚠️ Not 100% clean mypy (pragmatic trade-off)
    risk_factors:
      - Test layer remains untyped; new tests must follow manual discipline
      - Maintenance burden: test regressions won't be caught by type checker
    decision_gates:
      - DI type erasure resolution (critical)
      - API signature alignment (critical)
    mypy_outcome: "Found 15-20 errors (test suite only)"
    coverage_metrics:
      mypy_errors_reduced: "80 → 15-20 (75-81% reduction)"
      production_return_types: "90%+"
      production_arg_types: "85%+"
      test_coverage: "excluded (defer to Q3b)"
    recommended_for: "Q3 Initiative 6 Phase 0 (THIS PHASE). Best balance of effort vs. impact."

  option_c:
    name: "Incremental Plugin-First"
    description: "Focus ONLY on plugin system. Prototyping approach; lowest effort, narrow scope."
    scope:
      production_modules: 40 (plugin layer only)
      test_modules: 0
      config_modules: 0
      total_functions: 200
      coverage_target: "80% return types"
    effort_estimate:
      weeks: "1-2"
      sprints: 0.5
      person_weeks: 2-3
      estimated_cost: "$5k-7k"
    phases:
      phase_1_plugin_protocols:
        description: "Verify Protocol definitions in scanner_plugins/interfaces.py (already 100%)"
        files:
          - src/prism/scanner_plugins/interfaces.py
        estimated_time: "0.25 week (verification only)"
        impact: "Establish plugin typing baselines"
      phase_2_ansible_suite:
        description: "Type Ansible plugin implementations"
        files:
          - src/prism/scanner_plugins/ansible/feature_detection.py
          - src/prism/scanner_plugins/ansible/variable_discovery.py
          - src/prism/scanner_plugins/ansible/default_policies.py
        estimated_time: "1 week"
        impact: "12 errors → 0 in feature_detection.py"
      phase_3_defer_rest:
        description: "Defer extraction layer, API layer, test layer to Q3b/Q3c"
        files: []
        estimated_time: "0 week"
        impact: "50+ errors remain"
    pros:
      - ✅ Lowest effort (1-2 weeks)
      - ✅ Prototyping approach: learn patterns before full commit
      - ✅ Minimal risk to core execution paths
      - ✅ Can be done by junior contributor
      - ✅ Establishes plugin typing conventions for K8s/Terraform expansion
    cons:
      - ❌ Very narrow scope (plugin layer only, ~40 functions)
      - ❌ Leaves extraction layer (high-frequency callers) untyped
      - ❌ 80% of errors remain (50+ errors untouched)
      - ❌ Low strategic impact for Q3 roadmap
      - ❌ Requires follow-up Q3b initiative to be useful
    risk_factors:
      - Too limited to move the needle on overall type safety
      - Extraction layer DI issue remains unresolved
      - May feel like incomplete work
    decision_gates: []
    mypy_outcome: "Found 68+ errors (reduction negligible)"
    coverage_metrics:
      mypy_errors_reduced: "80 → 68 (15% reduction)"
      production_return_types: "65%"
      plugin_protocol_coverage: "100%"
    recommended_for: "Learning/prototyping only. NOT RECOMMENDED for production Q3 initiative."

