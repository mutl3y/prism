  criteria:
    effort:
      weight: 0.25
      lower_is_better: true
    coverage_gain:
      weight: 0.35
      lower_is_better: false
    mypy_clean_lines:
      weight: 0.20
      lower_is_better: false
    risk_level:
      weight: 0.20
      lower_is_better: true

  scoring:
    option_a:
      effort_score: 1.0 (highest effort)
      coverage_score: 1.0 (100% coverage)
      mypy_clean_score: 1.0 (0 errors)
      risk_score: 0.6 (test changes risky)
      weighted_score: 0.89
    option_b:
      effort_score: 0.5 (medium effort)
      coverage_score: 0.8 (90% production coverage)
      mypy_clean_score: 0.7 (70-80% error reduction)
      risk_score: 0.8 (low risk, stable)
      weighted_score: 0.72  # ⭐ RECOMMENDED
    option_c:
      effort_score: 0.2 (lowest effort)
      coverage_score: 0.3 (narrow plugin scope)
