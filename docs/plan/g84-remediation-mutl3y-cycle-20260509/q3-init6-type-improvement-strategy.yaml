      risk_score: 1.0 (no risk but limited impact)
      weighted_score: 0.35

recommendation:
  selected: option_b
  rationale: |
    Option B (Targeted High-Value) is the recommended path for Q3 Initiative 6.

    **Why B over A?**
    - A is over-engineered for current needs; test layer typing can wait for dedicated Q3b initiative
    - B achieves 90%+ production code type safety with 40% less effort
    - B focuses on high-frequency call paths (extraction, feature detection) → higher ROI
    - Test suite remains validated by CI anyway; mypy on tests is secondary to integration tests

    **Why B over C?**
    - C is too narrow; leaves extraction layer (the heart of the scanner) untyped
    - C only achieves 15% error reduction; not strategic for platform
    - B addresses critical blocker (DI type erasure) that unblocks all downstream
    - B establishes plugin typing as part of broader production coverage, not isolation

    **Key Success Factors for Option B:**
    1. DI type erasure resolution (Phase 1) is CRITICAL blocker
    2. API/CLI alignment (Phase 3) is quick fix with high ROI
    3. Extraction + feature detection (Phases 2a/2b) are the high-frequency paths
    4. Test typing deferred to Q3b (separate initiative with its own scope)

  estimated_timeline: |
    - Week 1: DI blocker + Phase 2a extraction
    - Week 2: Phase 2b feature detection + Phase 3 API alignment
    - Week 3: Buffer + validation
    Total: 2-3 weeks (1 sprint)

  next_steps:
    1. Schedule decision gate: "DI type erasure architecture review"
    2. Draft Phase 1 implementation spec: DI factory overloads / generics / casting strategy
    3. Start Phase 1 (DI) immediately after decision gate
    4. Plan Q3b initiative: "Test Suite Type Safety" (separate)
    5. Plan Q3c initiative: "100% Mypy Clean" (includes test layer + edge cases)

critical_blockers:
  blocker_1_di_type_erasure:
    description: "DIContainer factories return `object`, preventing downstream typing"
    files: [src/prism/scanner_core/di.py, src/prism/scanner_core/di_helpers.py]
    affects: [feature_detection, task_line_parsing, variable_discovery]
    decision_required: true
    decision_options:
      - "Add overloads to factory methods (highest type safety)"
      - "Use TypeVar generics + bounds (medium complexity)"
      - "Accept `cast()` at call sites (low effort, lower safety)"
    estimated_resolution_effort: "0.5-1 week"
    recommendation: "Overloads approach (highest safety with minimal complexity)"

  blocker_2_api_signature_mismatch:
    description: "write_role_scan_output() kwargs don't match call sites in cli.py"
    files: [src/prism/api.py, src/prism/cli.py]
    affects: [CLI layer]
    decision_required: true
    decision_options:
      - "Fix API signature to match calls"
      - "Fix CLI calls to match API"
    estimated_resolution_effort: "0.5 week"
    recommendation: "Audit intention, then align one direction (TBD in Phase 1)"

open_decisions:
  decision_1_test_layer_strategy:
    question: "Should test suite typing be included in Q3 Initiative 6?"
    current_state: "35 errors in test files"
    option_b_approach: "Defer to Q3b (separate initiative)"
    rationale: |
      Tests are already validated by CI integration tests. Mypy on test layer:
      - Provides secondary type safety (redundant vs. runtime validation)
      - High effort (test fixture redesign)
      - Lower ROI than production code typing
      Recommendation: Defer to Q3b, focus Q3 on production code.

  decision_2_di_architecture_pattern:
    question: "How should DI factories express their return types?"
    current_pattern: "Factory returns `object` (type erasure)"
    options:
      - Overloads: factory_task_line_policy() -> PreparedTaskLineParsingPolicy
      - Generics: factory[T](policy_type: type[T]) -> T
      - Casts: cast(PreparedTaskLineParsingPolicy, di.factory_task_line_policy())
    decision_required: true
    estimated_effort: "0.5-1 week"
    recommendation: "Overloads (explicit, no runtime cast overhead)"

  decision_3_protocol_vs_typeddict:
    question: "For policy types, use Protocol (structural) or TypedDict (shape)?"
    current_usage: |
      - PreparedTaskLineParsingPolicy: Protocol
      - PreparedPolicyBundle: TypedDict
      - ScanOptionsDict: TypedDict
    rationale_for_protocols: "Plugin implementations use duck typing; structural contract better"
    rationale_for_typeddicts: "Data shapes need shape validation; TypedDict enforces keys"
    recommendation: "Keep current split (Protocols for plugin contracts, TypedDict for data). Document in contracts_request.py."
