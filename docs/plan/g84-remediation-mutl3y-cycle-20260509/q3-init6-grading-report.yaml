### Phase 1 (DI Fix): 1 DAY ESTIMATE ✅ REALISTIC

**Deliverables:**
1. `di.py`: Add overload signatures to 6+ factory methods
2. `di_helpers.py`: Type 8+ helper functions
3. New test: `test_di_factory_return_types.py` (verify overload narrowing)
4. Type imports: Add TYPE_CHECKING block for policy contracts

**Implementation Pattern (straightforward):**
```python
from typing import overload, TYPE_CHECKING

if TYPE_CHECKING:
    from prism.scanner_data.contracts_request import PreparedTaskLineParsingPolicy

@overload
def factory_task_line_policy(di: DIContainer) -> PreparedTaskLineParsingPolicy: ...
@overload
def factory_task_line_policy(di: DIContainer) -> None: ...

def factory_task_line_policy(di: DIContainer) -> PreparedTaskLineParsingPolicy | None:
    # Implementation unchanged
    ...
```

**Effort Breakdown:**
- Overload signatures: ~30 minutes (copy-paste + modify for each method)
- Type imports: ~15 minutes (add TYPE_CHECKING block once)
- Test file: ~15 minutes (basic verification test)
- Validation: ~15 minutes (mypy run, check error reduction)
- **Total: 1.5 hours** (estimate 1 day includes review + iteration)

**Risk: LOW** (well-understood pattern, no behavior changes)
**Assessment: ACHIEVABLE** ✅

**Expected Mypy Reduction: 80 → 45 errors (44% reduction)**

