## 1. ERROR CLASSIFICATION (80 mypy errors)

### By Severity & Root Cause

**CRITICAL (Silent Bug Risk + Runtime Impact)**
- Count: 35 errors
- Type: "object" has no attribute X
- Root Cause: DI container factories return `object` type
- Impact: 15+ modules affected (extraction layer, feature detection, variable discovery)
- Example: `di.factory_task_line_policy()` → `object` instead of `PreparedTaskLineParsingPolicy`
- Severity Justification: Downstream code cannot safely call methods on policy objects; runtime AttributeError risk if code assumes interface
- Effort: Fix DI → -35 errors (1 day, high leverage)
- Module Impact:
  - feature_detection.py (12 direct errors)
  - task_line_parsing.py (5 direct errors)
  - task_file_traversal.py (4 direct errors)
  - variable_discovery.py (3 direct errors)
  - variable_extractor.py (2 direct errors)
  - 4+ other callers (4 distributed errors)

**HIGH Severity (Type Mismatch, Protocol Violation)**
- Count: 20 errors (type mismatches, arg/return incompatibility)
- Root Cause: API/protocol boundaries undefined; extraction layer returns untyped containers
- Impact: API/CLI layer, extraction return types
- Examples:
  - `write_role_scan_output()` signature mismatch (api.py → cli.py)
  - `expand_include_target_candidates()` returns untyped dict instead of typed container
  - `build_task_catalog()` returns TaskCatalog but not annotated
- Severity Justification: Confuses maintainers; breaks IDE refactoring; makes testing harder
- Effort: Moderate (2-3 functions per module, 1-2 hours per fix)
- Module Impact:
  - api.py (3 errors)
  - cli.py (4 errors)
  - task_annotation_parsing.py (4 errors)
  - task_catalog_assembly.py (3 errors)
  - loader.py (3 errors)
  - extract_policies.py (4 errors)

**MEDIUM Severity (Maintainability, Type Safety)**
- Count: 25 errors
  - 8 errors: Indexing on "object" (requires cast/narrowing)
  - 6 errors: Missing TypedDict keys (ScanOptionsDict, PreparedPolicyBundle)
  - 11 errors: Union/callable incompatibility (rare edge cases)
- Root Cause: Incomplete type narrowing; TypedDict definitions incomplete; generic type variance
- Impact: Type checker not fully confident; future refactoring at risk
- Severity Justification: Not immediate runtime risk but indicates incomplete contract definitions
- Effort: Moderate to Low (mostly adding missing annotations + cast statements)

**LOW Severity (Test Suite, Edge Cases)**
- Count: 35 errors (all in test files)
- Root Cause: Test fixtures untyped; parametrizations lack TypedDict validation
- Impact: Test code does not validate against scanner interfaces; brittle test maintenance
- Severity Justification: Tests already validated by CI; type errors here are informational only
- Effort: High relative to payoff (test infrastructure redesign needed)
- Decision: **Defer to Q3b** (explicit in Option B)

