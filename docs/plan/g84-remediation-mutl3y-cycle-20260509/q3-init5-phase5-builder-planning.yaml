# Plugin Extraction Boundary Seam

## Rationale
scanner_plugins/ansible needs extraction logic that is platform-specific.
The extraction boundary seam (ansible/extract_utils.py) provides a defined
entry point for Ansible-specific extraction without coupling the entire
plugin layer to scanner_extract internals.

