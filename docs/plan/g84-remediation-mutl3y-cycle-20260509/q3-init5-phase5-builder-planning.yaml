# GLOSSARY & REFERENCES

## Key Concepts

- **Layer**: Directory-scoped boundary (scanner_core, scanner_extract, etc.)
- **Plugin Protocol**: Interface contract defining plugin method signatures
- **DI Boundary**: Separation between DI internals and caller-facing APIs
- **Seam**: Intentional bridge point between layers (e.g., ansible/extract_utils.py)
- **Type-Level Boundary**: Enforced via Protocol types + mypy checking

