# PHASE 5B: DI BOUNDARY ENFORCEMENT

## 1. Current DI Coupling Analysis

### 1.1 DI Container Responsibilities

**Location**: `src/prism/scanner_core/di.py`

Current DI owns:
- ✅ Plugin registry injection (`_registry`)
- ✅ Platform key resolution (`_platform_key`)
- ✅ Mock injection for testing (`_mocks`)
- ✅ Factory override injection (`_factory_overrides`)
- ✅ Event bus creation + lifecycle
- ✅ Cache management (thread-safe)
- ✅ Core type instantiation (VariableDiscovery, FeatureDetector)
- ✅ Policy registry/manager (stub)
- ⚠️ **PROBLEM**: Core types leak concrete implementations to callers

### 1.2 PluginResolver Coupling

**Location**: `src/prism/scanner_core/plugin_resolver.py`

Current scope:
- Resolves plugins from registry by slot name + platform key
- Returns concrete plugin instances (not protocols)
- **PROBLEM**: No abstraction between DI and resolver; direct delegation

### 1.3 Boundaries That Need Enforcement

```
┌─────────────────────────────────────────────────┐
│ DIContainer (OWNS FACTORIES)                    │
│ ├─ Must NOT import scanner_core concrete types │
│ │  (except via TYPE_CHECKING)                   │
│ └─ Must NOT know about plugin internals         │
└─────────────────────────────────────────────────┘
              ↓ (delegates to)
┌─────────────────────────────────────────────────┐
│ PluginResolver (PLUGIN LOOKUP ONLY)             │
│ ├─ Must NOT construct plugins                   │
│ └─ Must NOT cache anything                      │
└─────────────────────────────────────────────────┘
              ↓ (returns to)
┌─────────────────────────────────────────────────┐
│ Callers (USE PROTOCOLS)                         │
│ ├─ Must use Protocol types, not concrete types  │
│ └─ Must NOT reach past PluginResolver           │
└─────────────────────────────────────────────────┘
```

**Current Violation**: DI returns `VariableDiscovery` (concrete) instead of `VariableDiscoveryPlugin` (protocol)

### 1.4 Coupling Points to Sever

| Coupling | From | To | Why | Fix |
|----------|------|----|----|-----|
| **C1** | DIContainer | concrete VariableDiscovery | Should use protocol | Return `VariableDiscoveryPlugin` wrapper |
| **C2** | DIContainer | concrete FeatureDetector | Should use protocol | Return `FeatureDetectionPlugin` wrapper |
| **C3** | PluginResolver | Plugin construction logic | Resolver should NOT construct | Move construction to DI factory |
| **C4** | scanner_core.di | scanner_core.protocols_runtime | TYPE_CHECKING only leakage | Audit + validate TYPE_CHECKING usage |
| **C5** | Plugin implementations | DI container details | Plugins tightly coupled to factory shapes | Document stable DI contract |

