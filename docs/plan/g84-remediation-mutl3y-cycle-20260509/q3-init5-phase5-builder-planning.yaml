#### 2.3.2 Add Runtime Validation

**File**: `src/prism/scanner_core/policy_manager.py` (new)

```python
def validate_prepared_policy_bundle(
    bundle: PreparedPolicyBundle | None,
) -> None:
    """Fail-closed: Verify bundle has all required fields.
    
    Raises:
        ValueError: If any required field missing or None
    """
    if bundle is None:
        raise ValueError("PreparedPolicyBundle must not be None")
    
    required_fields = [
        "scan_policy_blocker_facts",
        "comment_doc_marker_prefix",
        "platform_key",
        "task_line_parsing_policy",
        "task_annotation_policy",
        "task_traversal_policy",
        "variable_extractor_policy",
    ]
    
    for field in required_fields:
        value = bundle.get(field)
        if value is None:
            raise ValueError(f"PreparedPolicyBundle.{field} must not be None")
```

**Effort**: 1 hour (validation + tests)

