    task_line_parsing_policy: PreparedTaskLineParsingPolicy
    task_annotation_policy: PreparedTaskAnnotationPolicy
    task_traversal_policy: PreparedTaskTraversalPolicy
    variable_extractor_policy: PreparedVariableExtractorPolicy
