def _validate_plugin_di_contract(
    plugin_class: type[VariableDiscoveryPlugin],
) -> None:
    """Verify plugin class accepts di= parameter in constructor.
    
    Raises:
        PluginConstructorMismatch: If plugin cannot accept di keyword
    """
    signature = inspect.signature(plugin_class.__init__)
    has_di_param = (
        "di" in signature.parameters or
        any(p.kind == Parameter.VAR_KEYWORD for p in signature.parameters.values())
    )
    if not has_di_param:
        raise PluginConstructorMismatch(
            f"Plugin {plugin_class.__name__} must accept di= parameter"
        )
```

**Effort**: 1 hour (add validation + tests)

