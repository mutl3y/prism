### 2.2 DI Wrapper Facade (NEW)

**File**: `src/prism/scanner_core/di_plugin_facades.py`

```python
"""Wrapper facades to enforce protocol boundaries between DI and plugin callers.

Callers should receive Protocol types from DI factories, not concrete types.
These wrappers ensure:
1. DI owns factory methods (plugin instantiation)
2. Callers work with protocols only
3. Plugins can be swapped without caller changes
"""

from prism.scanner_plugins.interfaces import (
    VariableDiscoveryPlugin,
    FeatureDetectionPlugin,
)

class PluginBoundaryFacade:
    """Facade to enforce DI boundary: Callers see protocols, not concrete types."""
    
    def __init__(self, di: "DIContainer") -> None:
        self._di = di
    
    def factory_variable_discovery_as_protocol(self) -> VariableDiscoveryPlugin:
        """Wrap VariableDiscovery as VariableDiscoveryPlugin protocol.
        
        Returns:
            Instance conforming to VariableDiscoveryPlugin protocol
        
        Note:
            Callers must use this method instead of factory_variable_discovery()
            to maintain boundary between DI internals and callers.
        """
        instance = self._di.factory_variable_discovery()
        # Type system validates that VariableDiscovery implements protocol
        return instance  # type: ignore[return-value]
    
    def factory_feature_detection_as_protocol(self) -> FeatureDetectionPlugin:
        """Wrap FeatureDetector as FeatureDetectionPlugin protocol."""
        instance = self._di.factory_feature_detector()
        return instance  # type: ignore[return-value]
```

**Impact**: Callers receive protocols; DI owns concrete types; boundary is explicit

