        function: "def normalize_marker_prefix(marker_prefix: str | None) -> str: return marker_prefix or \"prism\""
      - module: tests/test_comment_doc_plugin_resolution.py
        line: 167
        type: test_mock
        function: "def normalize_marker_prefix(marker_prefix: str | None) -> str: return marker_prefix or \"prism\""
    
    proposed_location: |
      Option A: Import canonical from marker_utils.py (preferred for test realism)
      Option B: Simplify canonical implementation to match test mock (NOT RECOMMENDED)
      
      Recommendation: Option A (import canonical)
    
    consolidation_strategy: |
