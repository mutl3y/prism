      The canonical implementation in marker_utils.py is much stricter:
      - Validates character set: [A-Za-z0-9_.-]+ only
      - Rejects empty strings
      - Rejects strings with spaces
      - Falls back to DEFAULT_DOC_MARKER_PREFIX on validation failure
      
      Test mock at lines 130-131 and 167-168 doesn't enforce these rules,
      which means tests could pass with invalid marker-prefix values that would
      fail at runtime.
    
    current_locations:
