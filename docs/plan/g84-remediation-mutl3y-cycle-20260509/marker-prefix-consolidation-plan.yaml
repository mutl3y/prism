  - item_id: "FINDING-003"
    item_name: "Marker regex building wrapper chain too deep"
    description: |
      Marker regex building involves multiple layers of wrapping that make the
      resolution path complex:
      
      1. Canonical: scanner_plugins/parsers/comment_doc/marker_utils.py
         - get_marker_line_re(marker_prefix) with @lru_cache(128)
         - Uses normalize_marker_prefix() internally
      
      2. Task Line Wrapper: scanner_extract/task_line_parsing.py
         - _normalize_marker_prefix(marker_prefix, di) (policy-backed)
         - _build_marker_line_re(marker_prefix, di) (builds regex via policy)
         - get_marker_line_re(marker_prefix, di) (public wrapper)
      
      3. Runtime Proxy: scanner_extract/task_line_parsing.py
         - _PolicyBackedMarkerLineRegexProxy (module-level proxy)
         - Resolves marker-line regex from policy at call time
      
      4. Module Constants: scanner_extract/task_line_parsing.py
         - MARKER_LINE_REGEX (uses _PolicyBackedMarkerLineRegexProxy)
      
      Impact: Tracing marker-regex resolution is complicated. Five different
      access paths exist (policy attr, _normalize wrapper, wrapper function,
      proxy, module const). This increases maintenance cost and makes debugging harder.
    
    current_locations:
      - module: scanner_plugins/parsers/comment_doc/marker_utils.py
        line: 38
        type: canonical
        description: "get_marker_line_re() with LRU cache"
      - module: scanner_extract/task_line_parsing.py
        line: 143
        type: wrapper
        description: "_build_marker_line_re(marker_prefix, di)"
      - module: scanner_extract/task_line_parsing.py
        line: 154
        type: wrapper
        description: "get_marker_line_re(marker_prefix, di)"
      - module: scanner_extract/task_line_parsing.py
        line: 165
        type: proxy
        description: "_PolicyBackedMarkerLineRegexProxy"
      - module: scanner_extract/task_line_parsing.py
        line: 214
        type: module_constant
        description: "MARKER_LINE_REGEX = _PolicyBackedMarkerLineRegexProxy(...)"
    
    proposed_location: |
      Option A: Simplify wrapper chain
        - Keep _normalize_marker_prefix in place (policy injection needed)
        - Inline _build_marker_line_re logic into get_marker_line_re
        - Keep proxy for backward compatibility
        - Document resolution path with flowchart
      
      Option B: Extract to dedicated marker_regex module
        - New module: scanner_extract/marker_regex_resolver.py
        - Consolidate all regex building logic
        - Simplify task_line_parsing.py by moving proxy logic
    
      Recommendation: Option A (lower-risk refactor)
    
    consolidation_strategy: |
      PHASE 1 ACTION (Option A - Simplify):
      1. Consolidate _build_marker_line_re into get_marker_line_re:
         def get_marker_line_re(marker_prefix, *, di: object | None = None):
             normalized_prefix = _normalize_marker_prefix(marker_prefix, di=di)
             # Directly call canonical function
             return require_prepared_policy(
                 di, "task_annotation_parsing", "task_annotation_parsing"
             ).get_marker_line_re(normalized_prefix)
      
      2. Update callers to use get_marker_line_re directly (no _build prefix)
      
      3. Keep _PolicyBackedMarkerLineRegexProxy for module-level MARKER_LINE_REGEX
         but document that it's a legacy compatibility shim
      
      4. Add docstring flowchart showing resolution path:
         marker_prefix → _normalize_marker_prefix (policy-backed)
                      → get_marker_line_re (canonical)
                      → re.Pattern (cached)
      
      Effort: 1 day
      Risk: Medium (changes hot path, needs comprehensive testing)
    
    duplicated_lines: 3
    duplicated_concepts: 1
    
    effort_estimate:
      working_days: 1.0
      risk_level: medium
      test_coverage_required: comprehensive regex matching tests
      breaking_changes: internal_only (no public API change)
      verification_steps:
        - Verify regex cache still works
        - Benchmark cache hits vs misses
        - Test marker detection with various marker-prefix values
        - Verify module constant MARKER_LINE_REGEX still works
        - Performance profile: no regression expected
    
    dependencies:
      - All code using marker-line regex (task parsing, role notes parsing)
    blockers: []
    owner_recommendation: scanner_extract team
    priority: medium
    risk_assessment: |
      Risk: MEDIUM
      - Affects marker-line regex resolution (hot path)
      - Cache behavior must be preserved
      - Regex matching correctness is critical
      - Need comprehensive regex matching tests
      - Change is internal (no public API change)
    
    acceptance_criteria:
      - _build_marker_line_re logic consolidated into get_marker_line_re
      - Callers updated to use get_marker_line_re (no _build prefix)
      - _PolicyBackedMarkerLineRegexProxy documented as legacy shim
      - Docstring added with resolution flowchart
      - All marker-line regex tests pass
      - Cache hit rate maintained or improved
      - No regression in marker detection accuracy
      - Code review confirms reduced cognitive complexity

  - item_id: "FINDING-004"
    item_name: "Marker-prefix config resolution implicit fallback chain"
    description: |
      In scanner_plugins/bundle_resolver.py (lines 158-171), the marker-prefix
      injection into PreparedPolicyBundle uses an implicit fallback chain:
      
      1. Try scan_options['comment_doc_marker_prefix'] directly
      2. If not found, check policy_context['comment_doc']['marker']['prefix']
      3. If still not found, use DEFAULT_DOC_MARKER_PREFIX
      
      The code implements this fallback but the chain is not documented inline.
      Reader must trace through conditional checks to understand the priority order.
      This is implicit logic that makes maintenance harder.
      
      Additionally, this logic should be documented in relation to
      scanner_config/marker.py::load_readme_marker_prefix() which reads from
      the role config file. The relationship between these two loaders is unclear.
    
    current_locations:
      - module: scanner_plugins/bundle_resolver.py
        line: 158
        type: injection_point
        description: "bundle resolution with implicit fallback chain"
      - module: scanner_config/marker.py
        line: 33
        type: config_loader
        description: "load_readme_marker_prefix() reads from role config"
    
    proposed_location: |
      Option A: Extract fallback chain to dedicated function
        - New function: _resolve_marker_prefix_from_scan_context()
        - Document fallback chain explicitly
        - Add logging at each fallback step
      
      Option B: Add inline documentation with flowchart
        - Keep code as-is but document with comments and docstring
        - Lower effort, but doesn't make code more readable
    
      Recommendation: Option A (more maintainable)
    
    consolidation_strategy: |
      PHASE 1 ACTION (Option A):
      1. Extract marker-prefix resolution to dedicated function in bundle_resolver.py:
         
         def _resolve_marker_prefix_from_scan_context(
             scan_options: dict[str, Any],
             policy_context: dict[str, Any] | None = None,
         ) -> str:
             """Resolve marker-prefix with explicit fallback priority.
             
             Priority order:
             1. scan_options['comment_doc_marker_prefix'] (direct inject)
             2. policy_context['comment_doc']['marker']['prefix'] (policy override)
             3. DEFAULT_DOC_MARKER_PREFIX (ultimate fallback)
             
             Args:
                 scan_options: Ingress scan options dict
                 policy_context: Optional policy context dict
             
             Returns:
                 Resolved marker-prefix string (always valid, never None)
             """
             # Try direct option first
             raw_prefix = scan_options.get("comment_doc_marker_prefix")
             if isinstance(raw_prefix, str):
                 return normalize_marker_prefix(raw_prefix)
             
             # Try policy context if direct option unavailable
             if isinstance(policy_context, dict):
                 cd = policy_context.get("comment_doc")
                 if isinstance(cd, dict):
                     mk = cd.get("marker")
                     if isinstance(mk, dict):
                         p = mk.get("prefix")
                         if isinstance(p, str):
                             return normalize_marker_prefix(p)
             
             # Ultimate fallback
             return DEFAULT_DOC_MARKER_PREFIX
      
      2. Update bundle_resolver.py to use this function:
         if bundle.get("comment_doc_marker_prefix") is None:
             bundle["comment_doc_marker_prefix"] = _resolve_marker_prefix_from_scan_context(
                 scan_options,
                 scan_options.get("policy_context"),
             )
      
      3. Add relationship documentation between load_readme_marker_prefix()
         and _resolve_marker_prefix_from_scan_context():
         
         Module docstring: "How marker-prefix flows into bundle"
         - load_readme_marker_prefix() reads from role config file (.prism.yml)
         - _resolve_marker_prefix_from_scan_context() merges from multiple sources
         - normalize_marker_prefix() validates character set
      
      Effort: 0.25 days
      Risk: Low (refactoring, no behavioral change)
    
    duplicated_lines: 0
    duplicated_concepts: 1
    
    effort_estimate:
      working_days: 0.25
      risk_level: low
      test_coverage_required: existing (no behavior change)
      breaking_changes: none
      verification_steps:
        - Verify function returns expected values for all fallback cases
        - Confirm no behavioral change vs original code
        - Run bundle assembly tests
        - Code review for documentation clarity
    
    dependencies: []
    blockers: []
    owner_recommendation: scanner_plugins team
    priority: low
    risk_assessment: |
      Risk: LOW
      - Pure refactoring (no behavioral change)
      - Function is internal (no public API)
      - Existing tests cover all fallback paths
      - Clear documentation reduces future maintenance cost
    
    acceptance_criteria:
      - _resolve_marker_prefix_from_scan_context() function created
      - Fallback priority documented in docstring
      - bundle_resolver.py updated to use function
      - Relationship between loaders documented
      - All bundle assembly tests pass
      - Code review confirms improved readability

  - item_id: "FINDING-005"
    item_name: "Missing end-to-end test: config file → bundle → extraction"
    description: |
      The test suite has unit tests for individual marker-prefix components:
      - normalize_marker_prefix() validation (test_t1_02_coverage_lift.py)
      - Marker regex building (test_execution_request_builder.py)
      - Adapter contracts (test_comment_doc_plugin_resolution.py)
      
      But there is NO end-to-end integration test that verifies the full flow:
      1. Write .prism.yml file with markers.prefix setting
      2. Load config via load_readme_marker_prefix()
      3. Inject into bundle via bundle_resolver.py
      4. Pass to extraction layer via task_extract_adapters.py
      5. Verify marker detection works with custom prefix
      
      This coverage gap means regressions in the config → bundle → extraction
      flow could go undetected. Critical for Q2 Initiative 3 validation.
    
    current_locations:
      - coverage_gap: true
      - affected_modules:
          - scanner_config/marker.py::load_readme_marker_prefix()
          - scanner_plugins/bundle_resolver.py::ensure_prepared_policy_bundle()
          - scanner_core/task_extract_adapters.py::_extract_task_annotations_for_file()
          - scanner_extract/task_annotation_parsing.py::extract_task_annotations_for_file()
    
    proposed_location: |
      Option A: Add integration test to test_fsrc_scanner_parity.py
        - Use existing parity test infrastructure
        - Test both src and fsrc lanes
      
      Option B: New dedicated test file test_marker_prefix_e2e.py
        - Comprehensive marker-prefix flow tests
        - Fixtures for temporary .prism.yml files
        - Test with various marker-prefix values
      
      Recommendation: Option B (cleaner, more focused)
    
    consolidation_strategy: |
      PHASE 1 ACTION (Option B):
      1. Create new test file: tests/test_marker_prefix_e2e.py
      
      2. Add fixtures:
         - temp_prism_config(tmp_path, marker_prefix: str) → Path
           Creates temporary .prism.yml with given marker_prefix
         - scan_context_with_marker(di, marker_prefix: str) → dict
           Creates scan options with prepared bundle
      
      3. Add test cases:
         def test_marker_prefix_e2e_custom_prefix(temp_prism_config):
             """Verify custom marker-prefix flows through bundle to extraction."""
             # Setup: Create .prism.yml with markers.prefix: "custom"
             config_dir = temp_prism_config
             
             # Load config
             prefix = load_readme_marker_prefix(str(config_dir))
             assert prefix == "custom"
             
             # Inject into bundle
             di = create_di_container(config_dir)
             bundle = ensure_prepared_policy_bundle(di.scan_options, di)
             assert bundle["comment_doc_marker_prefix"] == "custom"
             
             # Extract annotations with custom prefix
             lines = [
                 "# custom ~ task_name: description",
                 "- name: My Task",
             ]
             annotations, _ = _extract_task_annotations_for_file(
                 lines,
                 marker_prefix="custom",
                 di=di,
             )
             assert len(annotations) == 1
             assert annotations[0]["kind"] == "task_name"
         
         def test_marker_prefix_e2e_default_fallback():
             """Verify default marker-prefix when config missing."""
             # No config file, bundle should use DEFAULT_DOC_MARKER_PREFIX
             bundle = ensure_prepared_policy_bundle({}, None)
             assert bundle["comment_doc_marker_prefix"] == "prism"
         
         def test_marker_prefix_e2e_invalid_chars_normalized():
             """Verify invalid marker-prefix chars fall back to default."""
             # Config has invalid prefix with spaces
             config = {"markers": {"prefix": "invalid prefix"}}
             prefix = normalize_marker_prefix(config["markers"]["prefix"])
             assert prefix == "prism"  # Should normalize to default
      
      4. Effort: 0.75 days
      5. Coverage: Full flow from config to extraction
    
    duplicated_lines: 0
    duplicated_concepts: 0
    
    effort_estimate:
      working_days: 0.75
      risk_level: medium
      test_coverage_required: new
      breaking_changes: none (test_only)
      verification_steps:
        - Verify temp .prism.yml creation works
        - Confirm all test cases pass
        - Run test in both src and fsrc lanes (if applicable)
        - Ensure test isolation (temp files cleaned up)
    
    dependencies:
      - All modules in marker-prefix flow
    blockers: []
    owner_recommendation: prism test team
    priority: high
    risk_assessment: |
      Risk: MEDIUM (test_only)
      - New test setup required (temp files, fixtures)
      - Test complexity (requires multiple components)
      - But test_only = no production code risk
      - High value for regression detection
    
    acceptance_criteria:
      - New test file test_marker_prefix_e2e.py created
      - Fixtures for temp config and scan context
      - Test cases cover:
        * Custom marker-prefix from config file
        * Default marker-prefix fallback
        * Invalid marker-prefix normalization
        * End-to-end flow from config to extraction
      - All tests pass
      - Test isolation verified (temp files cleaned)
      - Code review confirms good coverage

