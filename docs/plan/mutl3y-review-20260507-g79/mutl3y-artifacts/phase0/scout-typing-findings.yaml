findings:

  - id: FIND-G79-TYPING-001
    severity: CRITICAL
    category: layer_boundary_typing
    title: DI Container passed as bare `object` throughout codebase
    layer_boundary: scanner_plugins | scanner_core | api_layer
    description: |
      The dependency injection container is passed as `di: object | None` across
      all layer boundaries, completely erasing type information. This prevents
      IDE/mypy from catching incorrect attribute access or method calls on the DI
      container itself.
    
    affected_files:
      - src/prism/scanner_core/di_helpers.py::scan_options_from_di (L58)
      - src/prism/scanner_core/di_helpers.py::get_prepared_policy_or_none (L77)
      - src/prism/scanner_core/di_helpers.py::require_prepared_policy (L104)
      - src/prism/scanner_core/task_extract_adapters.py::_resolve_marker_prefix (L189)
      - src/prism/scanner_plugins/defaults.py (15+ functions with `di: object | None`)
      - src/prism/api_layer/non_collection.py::_ExecutionRequestEnsurePreparedPolicyBundleFn (L47)

    evidence: |
      All DI consumers use `isinstance(di, HasScanOptions)` checks at runtime instead of
      relying on static types. The DIContainer Protocol exists in contracts_request.py
      but is never used as the actual type hint.
      
    correction: |
      Replace `di: object | None` with `di: DIContainer | None` where DIContainer is
      the Protocol defined in scanner_data.contracts_request. For optional DI, callers
      must explicitly handle None rather than relying on type erasure.

  - id: FIND-G79-TYPING-002
    severity: CRITICAL
    category: public_api_weak_typing
    title: OutputOrchestrationPlugin uses `dict[str, Any]` for metadata at public boundary
    layer_boundary: scanner_plugins | api_layer
    description: |
      The OutputOrchestrationPlugin protocol in scanner_plugins/interfaces.py accepts
      `metadata: dict[str, Any]` without specific structure. This is a public plugin
      boundary that allows any key/value combinations without IDE validation.
    
    affected_files:
      - src/prism/scanner_plugins/interfaces.py::OutputOrchestrationPlugin.orchestrate_output (L77-82)
      - src/prism/scanner_plugins/interfaces.py::OrchestratingScanPipelinePlugin.orchestrate_scan_payload (L229)
      - src/prism/scanner_plugins/interfaces.py::ReadmeRendererPlugin (multiple methods with `dict[str, Any]`)

    evidence: |
      Line 80: `metadata: dict[str, Any],`
      Line 229: `preflight_context: ScanMetadata | None = None,`
      
      The protocol declares the metadata parameter but offers zero type information about
      what keys or value types are expected, forcing plugins to use Any-unsafe access patterns.

    correction: |
      Define a TypedDict for metadata shape (e.g., OutputOrchestrationMetadata) and use it
      in the Protocol signature. If metadata is truly extensible, document the required keys
      and expected value types with Required/NotRequired fields.

  - id: FIND-G79-TYPING-003
    severity: CRITICAL
    category: return_type_erasure
    title: Policy resolver functions return untyped `object | None` at layer boundaries
    layer_boundary: scanner_core | scanner_plugins
    description: |
      Functions that retrieve prepared policies from DI return bare `object | None`,
      forcing consumers to isinstance-check or cast. This prevents static type checkers
      from validating correct usage and creates runtime fragility.
    
    affected_files:
      - src/prism/scanner_core/di_helpers.py::get_prepared_policy_or_none (L77) -> `object | None`
      - src/prism/scanner_core/di_helpers.py::require_prepared_policy (L104) -> `Any`
      - src/prism/scanner_plugins/defaults.py::_get_registry_from_di (L55) -> `PluginRegistry | None` (better but inconsistent)

    evidence: |
      Line 77-91: get_prepared_policy_or_none returns `object | None`
      Line 104-114: require_prepared_policy returns `Any`
      
      Callers must cast manually:
        policy = get_prepared_policy_or_none(di, "task_line_parsing")
        if policy is not None:
            assert isinstance(policy, PreparedTaskLineParsingPolicy)  # Runtime check needed

    correction: |
      Use TypeVar with Protocol bound to create generic policy retrievers:
      ```python
      PolicyType = TypeVar('PolicyType')
      def get_prepared_policy_or_none(
          di: DIContainer | None, 
          policy_name: str,
          policy_type: type[PolicyType]
      ) -> PolicyType | None: ...
      ```
      Or define specific functions for each policy type.

  - id: FIND-G79-TYPING-004
    severity: HIGH
    category: internal_types_in_public_sigs
    title: Internal `ScanPipelinePayload` exposed as `dict[str, object]` at plugin boundary
    layer_boundary: scanner_plugins | scanner_kernel
    description: |
      ScanPipelinePayload is defined as a TypeAlias `dict[str, object]` in interfaces.py
      but represents the internal scan payload structure. Plugins can accept and return
      this generic dict without compile-time validation of required keys.
    
    affected_files:
      - src/prism/scanner_plugins/interfaces.py::ScanPipelinePayload (L107)
      - src/prism/scanner_plugins/interfaces.py::OrchestratingScanPipelinePlugin.orchestrate_scan_payload (L228)

    evidence: |
      Line 107: `ScanPipelinePayload: TypeAlias = dict[str, object]`
      
      Any key/value can flow through without static validation. The actual required
      keys (payload, metadata, etc.) are enforced only at runtime through dict access
      in orchestrator.py.

    correction: |
      Define ScanPipelinePayload as a proper TypedDict with Required/NotRequired fields
      for all documented keys, allowing mypy to catch missing or wrong keys at compile time.

  - id: FIND-G79-TYPING-005
    severity: HIGH
    category: callable_param_erasure
    title: Protocol callables use `...` for args in public plugin signatures
    layer_boundary: api_layer | scanner_plugins
    description: |
      Protocol methods in scanner_plugins/interfaces.py define callable shapes with
      ellipsis (`...`) instead of specific parameter types. This is valid Python but
      loses all type information for callers.
    
    affected_files:
      - src/prism/scanner_plugins/interfaces.py::ScanRoleFn (L21-52) - good, fully typed
      - src/prism/scanner_plugins/interfaces.py::ScanPipelinePlugin (L143) - good, fully typed
      - src/prism/api_layer/collection.py (multiple Protocols with full typing) - good

    evidence: |
      Inconsistent protocol definitions: some Protocols in collection.py have fully
      typed parameters while interfaces.py has both patterns mixed.

    correction: |
      Ensure all Protocol method signatures are fully typed with specific parameter
      types and return types. Audit for any remaining `...` usage in public API Protocols.

  - id: FIND-G79-TYPING-006
    severity: MEDIUM
    category: typeddict_any_fields
    title: PreparedPolicyBundle members typed as Any in contract layer
    layer_boundary: scanner_data | scanner_core | scanner_plugins
    description: |
      The PreparedPolicyBundle TypedDict (in scanner_data/contracts_request.py) has
      fields that are typed as `Any`, preventing type checkers from catching incorrect
      policy member access downstream.
    
    affected_files:
      - src/prism/scanner_data/contracts_request.py (PreparedPolicyBundle definition)
      - src/prism/scanner_core/di_helpers.py::require_prepared_policy (L104) returns Any

    evidence: |
      PreparedPolicyBundle is likely defined with Any-typed members. This forces
      downstream code to use isinstance checks or ignore type errors.

    correction: |
      Define specific Protocol types for each prepared policy member (task_line_parsing,
      jinja_analysis, yaml_parsing) and use `NotRequired[SpecificProtocol]` in the
      bundle TypedDict for strict type checking.

  - id: FIND-G79-TYPING-007
    severity: MEDIUM
    category: di_container_protocol_weakness
    title: DIContainer.inject_mock parameter uses `Any` for test seams
    layer_boundary: scanner_core | test_layer
    description: |
      The DIContainer Protocol's inject_mock method accepts `mock: Any` without typing,
      allowing any test mock to be injected without compile-time validation of compatibility.
    
    affected_files:
      - src/prism/scanner_core/di.py::DIContainer.inject_mock (L549)
      - src/prism/scanner_data/contracts_request.py::DIContainer (Protocol definition)

    evidence: |
      di.py line 549: `def inject_mock(self, name: str, mock: Any) -> None:`
      
      Test code can inject incompatible mocks that will fail at runtime discovery time.

    correction: |
      Create specific typing for injectable mocks:
      ```python
      InjectionSlot = Literal["scan_options", "plugin_registry", "event_bus", ...]
      def inject_mock(self, slot: InjectionSlot, mock: object) -> None: ...
      ```
      Limit injectable names and use Protocol validation for mock compatibility.

