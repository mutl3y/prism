summary:
  objective: |
    Track the architecture and extensibility gaps that remained after the
    unified src/prism promotion, then close or defer them with explicit
    ownership decisions.
  outcome: |
    The plan is complete. Production hardening, plugin hardening,
    observability, render-path cleanup, parser and README ownership decisions,
    and property-test expansion all landed or were explicitly deferred.

completed_highlights:
  - id: T1-01
    title: Policy-as-Code audit plugin
    result: Implemented as the supported replacement for the retired feedback integration path.
  - id: T1-02
    title: scanner_core coverage lift
    result: Production-path coverage work completed and the higher quality gate restored.
  - id: T2-01
    title: Plugin API versioning
    result: Compatibility enforcement added for plugin registration.
  - id: T2-02
    title: Scan options schema
    result: Scan-option validation centralized and lifted to the boundary.
  - id: T2-03
    title: Entry-point plugin discovery
    result: External plugin registration no longer requires core source edits.
  - id: T2-04
    title: Stateless plugin enforcement
    result: Singleton eligibility is now explicit and validated.
  - id: T3-01
    title: Scan phase events
    result: Phase events now support progress, telemetry, and follow-on instrumentation.
  - id: T3-02
    title: Large-repo I/O decision
    result: Ordered-parallel YAML loading stays threshold-gated at 128 candidates; unconditional promotion was rejected by benchmark evidence.
  - id: T3-03
    title: Optional scan cache seam
    result: Cache contracts and an in-memory backend landed; broader integration remains optional.
  - id: T3-04
    title: Error boundary audit
    result: Raw boundary exceptions were audited and tightened.
  - id: T3-05
    title: Structured scan telemetry
    result: Telemetry contracts and JSON-mode phase logging landed.
  - id: T3-06
    title: API path validation
    result: Boundary path checks now fail early with typed errors.
  - id: T3-07
    title: README renderer coupling cleanup
    result: Remaining render-path Ansible coupling was narrowed without reopening the older design slice.
  - id: T3-08
    title: Style alias ownership decision
    result: Keep aliases as a neutral parser contract with injected alias data rather than plugin-owned parser state.
  - id: T3-09
    title: doc_insights ownership decision
    result: Keep doc_insights as a shared metadata contract until a second platform proves a dedicated seam is necessary.
  - id: T4-01
    title: Performance benchmark suite
    result: Benchmark coverage now includes the scenarios needed to evaluate future performance experiments.
  - id: T4-03
    title: CLI progress output
    result: CLI scans can stream phase progress to stderr.
  - id: T4-04
    title: Property and fuzz parser testing
    result: YAML and Jinja Hypothesis coverage was expanded across deeper parser edge cases.
  - id: T4-05
    title: Jinja sandbox audit
    result: Role-content handling paths were audited and guarded.
  - id: T4-06
    title: PRISM_* env support
    result: Environment-driven configuration layer landed for CI and container use.

durable_decisions:
  - Keep `api.py`, `cli.py`, and `repo_services.py` as the supported public entry surfaces.
  - Keep scanner implementation package-owned across `scanner_core`, `scanner_kernel`, `scanner_extract`, `scanner_readme`, `scanner_reporting`, `scanner_io`, `scanner_config`, `scanner_plugins`, and `scanner_data`.
  - Keep style aliases as a neutral parser contract with injected request-specific alias maps.
  - Keep `doc_insights` as a shared metadata contract until a second platform consumer proves it insufficient.
  - Keep ordered-parallel YAML loading parked behind the current threshold gate rather than widening it by default.

deferred:
  - id: D-01
    title: Plugin sandboxing or subprocess isolation
    rationale: Expensive relative to the current trusted-plugin model.
  - id: D-02
    title: DI generic slot registration
    rationale: Premature at current container size.
  - id: D-03
    title: HTTP or REST API surface
    rationale: No current consumer demand beyond Python API and CLI.
  - id: D-04
    title: scanner_compat.render_compat import-path cleanup
    rationale: Narrow real-world exposure.

