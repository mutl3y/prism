implementation_blockers:

  blocker_01_policy_constants_extraction:
    issue: Must extract policy_constants from scanner_context safely
    mitigation: |
      Implement accessor method in scanner_context or use .get() with fallback.
      Validate field exists before using.
      
  blocker_02_dual_signature_mutual_exclusivity:
    issue: Must enforce exactly one of (di=, scanner_context=) is provided
    mitigation: |
      Add explicit validation at function entry:
      if (di is None) == (scanner_context is None):
          raise ValueError("Specify exactly one of: di= or scanner_context=")
      
  blocker_03_recursive_inline_function:
    issue: _collect_tasks_recursive is nested inline function; can't refactor separately
    mitigation: |
      Keep nested function as-is; just thread new parameter through outer function signature.
      Nested function will receive parameter via closure.
      
  blocker_04_test_parity_verification:
    issue: Must verify both di= and scanner_context= paths produce identical results
    mitigation: |
      Phase 3 testing must include parity tests for both code paths.
      Run same test with di= vs scanner_context=; assert equal output.
      
  blocker_05_external_callers_discovery:
    issue: Must find all external callers to public API functions
    mitigation: |
      Run grep for: collect_task_handler_catalog|collect_task_files|extract_task_annotations_for_file
      Scan entire src/ and test/ directories.
      Document all callsites in Phase 2 analysis before implementation.

