call_signature_mismatches:
  - location: task_catalog_assembly.py:collect_task_and_handler_catalog
    issue: Public API signature does not expose PolicyConstants parameter
    current_signature: "(role_path, exclude_paths=None, marker_prefix='', *, di=None)"
    proposed_migration: "Add scanner_context or policy_constants param"
    severity: BLOCKER_FOR_PHASE2
    impact: All external callers need update OR dual-signature wrapper needed

  - location: task_file_traversal.py:iter_task_mappings vs _iter_task_mappings
    issue: Public/private pair both accept di=; no dual signature yet
    current_public_sig: "(data, *, di=None)"
    current_private_sig: "(data, *, di=None)"
    proposed: "Dual signature for public; private delegates to plugin directly"
    severity: MEDIUM
    impact: Public API can be updated safely if private caller adapts

  - location: task_annotation_parsing.py:extract_task_annotations_for_file
    issue: Public/private pair both accept di=; no dual signature yet
    current_public_sig: "(lines, marker_prefix, include_task_index=False, *, di=None)"
    current_private_sig: "(lines, marker_prefix, include_task_index=False, *, di=None)"
    proposed: "Dual signature for public; private delegates"
    severity: MEDIUM
    impact: Low risk; mostly internal usage in task_catalog_assembly

recursive_calls_di_threaded:
  - function: _collect_task_handler_catalog
    nested_function: _collect_tasks_recursive (line 63-180)
    di_threaded: true
    hotpath_relevance: CRITICAL
    notes: |
      Recursion through task include edges.
      di= threaded in all recursive calls.
      Nested function not a separate def; inlined recursion.

overall_summary:
  total_hotpath_functions: 19
  functions_with_di_param: 19
  functions_calling_require_prepared_policy: 13
  functions_propagating_di_only: 6
  signature_mismatches_found: 3

  critical_blockers:
    - Public API functions (collect_task_and_handler_catalog, extract_task_annotations_for_file, detect_task_module) do NOT support scanner_context parameter yet.
    - All external callers to these APIs must either keep using di= OR migration requires dual signatures.
    - Internal recursive structure (_collect_tasks_recursive) inlined; cannot be independently refactored.

  risk_assessment_for_phase2:
    option_a_dual_signatures:
      effort: MEDIUM
      risk: LOW
      time_estimate: "2-3 hours"
      notes: |
        Add scanner_context= param alongside di=.
        Requires new policy_constants extraction from scanner_context.
        Callers can opt-in incrementally.
        Backward compat maintained until di= deprecated.

    option_b_single_signature_rewrite:
      effort: HIGH
      risk: MEDIUM
      time_estimate: "4-6 hours"
      notes: |
        Remove di=; require scanner_context= only.
        All callers must update atomically.
        task_extract_adapters.py must be first to migrate (primary caller).
        Recursive _collect_tasks_recursive inlining becomes simpler (remove di forwarding).
        Test suite must verify no di= usages remain in hotpath.

investigation_notes: |
  Phase 2 migration point of highest leverage:
  task_catalog_assembly._collect_task_handler_catalog is the primary hotpath bottleneck.
  It has 13+ internal propagations of di= to file_traversal and annotation_parsing modules.

  Signature options:
  - Option A (Dual): (role_path, exclude_paths, marker_prefix, *, di=None, scanner_context=None)
    Requires mutual-exclusivity enforcement or one-to-one conversion inside function.
  - Option B (Single): (role_path, exclude_paths, marker_prefix, *, scanner_context=None)
    Requires all callers in task_extract_adapters.py and related modules to pass scanner_context.

  Call chain entry points (must migrate together):
  1. task_extract_adapters.py calls collect_task_and_handler_catalog (external)
  2. Internal recursive _collect_tasks_recursive threads di= deeply
  3. Both task_file_traversal and task_annotation_parsing delegate to plugins via require_prepared_policy

  Recommended next step for Builder-Phase2Outline:
  Analyze task_extract_adapters.py to identify all callsites and their current parameter sources.
  This determines whether Option A or Option B is feasible without massive refactor.
