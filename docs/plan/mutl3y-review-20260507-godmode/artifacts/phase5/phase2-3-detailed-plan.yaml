      - All test suite tests still pass
      - New tests verify new path in feature_detector

phase_3_comprehensive_test_strategy:

  test_tier_1_parity_validation: "~2 hours"
    objective: Verify both di= and scanner_context= paths produce identical results
    
    test_cases:
      T3_1_1_detect_task_module_parity:
        - Run with: task dict, di=prepared_di, scanner_context=None → result_A
        - Run with: task dict, di=None, scanner_context=mock_context → result_B
        - Assert: result_A == result_B
        - Coverage: 3 task types (module dict, collection dict, builtin)
      
      T3_1_2_collect_task_handler_catalog_parity:
        - Run with: role_path, exclude_paths, marker_prefix, di=prepared_di → result_A
        - Run with: role_path, exclude_paths, marker_prefix, scanner_context=mock_context → result_B
        - Assert: result_A == result_B (same catalog structure, same order)
        - Coverage: 3 role structures (simple, nested includes, molecule)
      
      T3_1_3_extract_task_annotations_parity:
        - Run with: lines, marker_prefix, di=prepared_di → result_A
        - Run with: lines, marker_prefix, scanner_context=mock_context → result_B
        - Assert: result_A == result_B (same annotations, same format)
        - Coverage: 3 annotation patterns (implicit, explicit, mixed)
      
      T3_1_4_load_yaml_file_parity:
        - Run with: file_path, di=prepared_di → result_A
        - Run with: file_path, scanner_context=mock_context → result_B
        - Assert: result_A == result_B (same parsed data)
        - Coverage: 3 file types (tasks, handlers, molecule)
      
      T3_1_5_iter_task_mappings_parity:
        - Run with: yaml_data, di=prepared_di → result_A
        - Run with: yaml_data, scanner_context=mock_context → result_B
        - Assert: result_A == result_B (same task mappings)
        - Coverage: 2 data types (list of tasks, dict of tasks)
    
    test_infrastructure:
      - Pytest fixture: prepared_di (fully initialized DI container)
      - Pytest fixture: mock_context (mock scanner_context with policy_constants)
      - Pytest fixture: mock_policy_constants (from PolicyConstants dataclass)
      - Parametrize: Each test runs both with real di and mock scanner_context
    
    passing_criteria: 100% of parity tests pass; both paths identical

  test_tier_2_per_scan_isolation: "~2 hours"
    objective: Verify each scan gets independent policy_constants (no cross-contamination)
    
    test_cases:
      T3_2_1_separate_scans_separate_contexts:
        - Scan 1: scanner_context_1 with policy_constants_1
        - Scan 2: scanner_context_2 with policy_constants_2 (different task_include_keys)
        - Assert: Scan 1 uses keys from policy_constants_1
        - Assert: Scan 2 uses keys from policy_constants_2
        - Assert: No cross-contamination of keys
      
      T3_2_2_policy_constants_immutability:
        - Extract policy_constants from scanner_context
        - Attempt modification (should fail; dataclass frozen=True)
        - Assert: PolicyConstants is immutable; no state mutation risk
      
      T3_2_3_concurrent_scan_contexts:
        - Spawn 3 threads; each with own scanner_context + policy_constants
        - Call collect_task_handler_catalog in each thread with different policy
        - Collect results in thread-safe queue
        - Assert: Each result matches its own policy_constants
        - Assert: No data race or cross-thread contamination
      
      T3_2_4_policy_constants_extraction_consistency:
        - Extract policy_constants multiple times from same scanner_context
        - Assert: Same object instance returned (identity check)
        - Assert: Immutable guarantees preserved across extractions
    
    test_infrastructure:
      - Pytest fixture: multiple scanner_contexts with varying policies
      - Pytest fixture: thread pool + concurrent test harness
      - Mock PolicyConstants with different task_include_keys per context
      
    passing_criteria: All isolation tests pass; no cross-scan contamination observed

  test_tier_3_multi_scan_concurrency: "~1.5 hours"
    objective: Verify hotpath functions work correctly under concurrent multi-scan load
    
    test_cases:
      T3_3_1_concurrent_catalog_collection:
        - 5 threads, each collecting task catalog for different role_path
        - Each with unique scanner_context + policy_constants
        - Assert: All 5 catalogs collected without exception
        - Assert: Each catalog matches expected role (no cross-role contamination)
        - Performance check: Total time < 2x sequential time (reasonable parallelism)
      
      T3_3_2_concurrent_yaml_loading:
        - 10 threads, each loading different YAML file
        - Each with unique scanner_context
        - Assert: All 10 files loaded correctly
        - Assert: No file I/O race conditions
        - Assert: YAML parse errors handled per-thread independently
      
      T3_3_3_concurrent_annotation_extraction:
        - 5 threads, each extracting annotations from different file content
        - Each with unique marker_prefix + scanner_context
        - Assert: All annotations extracted correctly
        - Assert: No regex pattern cross-contamination
        - Assert: Marker prefix honored per-thread (no shared state pollution)
      
      T3_3_4_stress_test_deep_recursion:
        - Create deeply nested include structure (30 levels)
        - 3 concurrent threads scanning same role_path simultaneously
        - Each with own scanner_context
        - Assert: No stack overflow or recursion limit hit
        - Assert: Include resolution consistent across threads
        - Assert: Max recursion depth enforced per-scan (not global)
    
    test_infrastructure:
      - ThreadPoolExecutor with 10 workers
      - Concurrent result collection + assertion harness
      - Performance profiler to check thread contention
      - Mock role directories with deep include structures
      
    passing_criteria: All concurrent tests pass; no race conditions; reasonable performance

  test_tier_4_backward_compatibility: "~1 hour"
    objective: Verify di= path continues to work for existing callers
    
    test_cases:
      T3_4_1_di_param_unchanged:
        - All existing tests using di= parameter (current test suite)
        - Assert: All 1171 tests still pass
        - Assert: No behavioral changes to di= path
      
      T3_4_2_di_exclusive_usage:
        - Call functions with only di= (no scanner_context)
        - Assert: Functions work as before
        - Assert: No new exceptions for missing scanner_context
      
      T3_4_3_both_params_mutual_exclusivity:
        - Call with both di= and scanner_context= provided
        - Document expected behavior (scanner_context wins OR error raised)
        - Assert: Consistent behavior across all functions
      
      T3_4_4_both_params_absent:
        - Call with di=None, scanner_context=None
        - Assert: Clear error message (e.g., "require_prepared_policy needs di or scanner_context")
        - Assert: Error traceable to call site
    
    passing_criteria: All 1171 existing tests pass; no regressions

  test_tier_5_error_handling: "~1 hour"
    objective: Verify error paths work correctly with dual signatures
    
    test_cases:
      T3_5_1_yaml_parse_failure_di_path:
        - Load invalid YAML with di= path
        - Assert: Error handled correctly
        - Assert: failure collected in yaml_failure_collector
      
      T3_5_2_yaml_parse_failure_scanner_context_path:
        - Load invalid YAML with scanner_context= path
        - Assert: Same error handling as di= path
        - Assert: failure collected correctly
      
      T3_5_3_missing_policy_extraction:
        - Call with scanner_context that lacks policy_constants attribute
        - Assert: Graceful error (not AttributeError)
        - Assert: Error message guides user to fix
      
      T3_5_4_include_resolution_failure:
        - Create include target that cannot be resolved
        - Assert: Failure recorded in unresolved_edges
        - Assert: Both di= and scanner_context= paths record same failure
      
      T3_5_5_recursion_depth_exceeded:
        - Trigger include depth > 64
        - Assert: Recursion halt message clear
        - Assert: Both di= and scanner_context= paths handle equally
    
    passing_criteria: All error paths tested; consistent behavior in both paths

  test_execution_schedule:
    - Phase 3a: Set up test infrastructure (fixtures, mocks) → 1 hour
    - Phase 3b: Implement Tiers 1-2 parity + isolation tests → 3 hours (overlaps with 3c)
    - Phase 3c: Implement Tiers 3-5 concurrency + error + backward compat → 2.5 hours
    - Phase 3d: Run full test suite; validate all passing → 30 mins
    - Phase 3e: Performance profiling + documentation → 1 hour
    
    TOTAL: ~5.5 hours (plus buffer for debugging)

  test_pass_criteria:
    - All 1171 existing tests pass (zero regressions)
    - All new parity tests pass (both paths produce identical results)
    - All isolation tests pass (no cross-scan contamination)
    - All concurrency tests pass (no race conditions)
    - All error handling tests pass (consistent behavior)
    - No new mypy, ruff, or black violations

risk_assessment:

  risk_1_broken_hotpath_signatures:
    likelihood: MEDIUM
    impact: CRITICAL (breaks all task extraction)
    mitigation: |
      - Phase 2a validates adapters completely before Phase 2b starts
      - Phase 2 commits are atomic per-module to enable rollback
      - Continuous CI validation after each phase
      - Parity tests in Phase 3 catch differences immediately
    status: MITIGATED

  risk_2_incompletely_threaded_params:
    likelihood: MEDIUM
    impact: MEDIUM (some paths use old di=, others use scanner_context=)
    mitigation: |
      - Code review checklist: Verify all propagation points (internal calls)
      - Grep for require_prepared_policy after Phase 2b; ensure count unchanged
      - Parity tests fail if any path skips param threading
    status: MITIGATED

  risk_3_policy_extraction_from_scanner_context_fails:
    likelihood: LOW
    impact: MEDIUM (new scanner_context= path unusable)
    mitigation: |
      - Design policy extraction as explicit fallible operation (try/except)
      - Phase 3 tests verify extraction works reliably
      - Mock scanner_context fixture with correct structure
    status: MITIGATED

  risk_4_test_suite_increases_maintenance_burden:
    likelihood: MEDIUM
    impact: LOW (duplicated test code)
    mitigation: |
      - Use parametrized tests to avoid duplication
      - Shared fixtures for di= and scanner_context= setup
      - Document test structure clearly for future maintainers
    status: MITIGATED

  risk_5_no_external_callers_found_breaking:
    likelihood: LOW
    impact: LOW (Phase 2a/2e are not breaking; public APIs still accept di=)
    mitigation: |
      - Grep search before Phase 2e for all external callers
      - All callers remain compatible (can still use di=)
      - No breaking changes in Phase 2 (only additions)
    status: MITIGATED

  risk_6_performance_regression_from_dual_paths:
    likelihood: LOW
    impact: LOW (both paths should have equivalent performance)
    mitigation: |
      - Phase 3e includes performance profiling
      - Benchmark di= path vs scanner_context= path for equivalence
      - Document any performance differences
    status: MITIGATED

  risk_7_policy_constants_not_immutable_enough:
    likelihood: VERY_LOW
    impact: MEDIUM (state corruption if mutable)
    mitigation: |
      - PolicyConstants dataclass already frozen=True (verified in Phase 1)
      - Phase 3 tests verify immutability guarantees
      - No mutation patterns observed in codebase
    status: MITIGATED

