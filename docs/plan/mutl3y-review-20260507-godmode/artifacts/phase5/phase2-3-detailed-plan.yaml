    duration: "~30-45 mins"
    risk: "LOW"
    files_affected:
      - src/prism/scanner_core/task_extract_adapters.py
    
    changes_required:
      1. Update _extract_task_annotations_for_file
         current: "(raw_lines, *, marker_prefix, include_task_index, di=None)"
         new: "(raw_lines, *, marker_prefix, include_task_index, di=None, scanner_context=None)"
         body_change: Pass both params to extract_task_annotations_for_file
         
      2. Update _collect_task_handler_catalog
         current: "(role_path, exclude_paths, *, marker_prefix, di=None)"
         new: "(role_path, exclude_paths, *, marker_prefix, di=None, scanner_context=None)"
         body_change: Pass both params to collect_task_handler_catalog
         
      3. Update detect_task_module
         current: "(task, *, di=None)"
         new: "(task, *, di=None, scanner_context=None)"
         body_change: Pass both params to detect_task_module
         
      4. Update collect_task_files
         current: "(role_root, *, exclude_paths=None, di=None)"
         new: "(role_root, *, exclude_paths=None, di=None, scanner_context=None)"
         body_change: Pass both params to collect_task_files
         
      5. Update collect_unconstrained_dynamic_role_includes
         current: "(role_path, exclude_paths=None, *, di=None)"
         new: "(role_path, exclude_paths=None, *, di=None, scanner_context=None)"
         body_change: Pass both params
      
      (+ 4 more minor re-exports; same pattern)
    
    testing_strategy:
      - Verify adapters still forward di= correctly (backward compat)
      - Verify adapters forward scanner_context= correctly (new path)
      - No behavioral change; purely API expansion
    
    acceptance_criteria:
      - All 9 adapter functions have dual params
      - Existing tests still pass (di= path untouched)
      - New tests can opt-in to scanner_context= path

  phase_2b_hotpath_assembly:
    objective: "Introduce dual signatures in task_catalog_assembly.py"
    duration: "~1 hour"
    risk: "MEDIUM (hotpath changes; careful implementation required)"
    files_affected:
      - src/prism/scanner_extract/task_catalog_assembly.py
    
    critical_changes:
      1. Update _detect_task_module signature
         current: "(task, *, di=None)"
         new: "(task, *, di=None, scanner_context=None)"
         implementation:
           ```python
           def _detect_task_module(task, *, di=None, scanner_context=None):
               policy_obj = None
               if scanner_context is not None:
                   policy_obj = scanner_context.policy_constants
               if policy_obj is None:
                   policy_obj = require_prepared_policy(
                       di, "task_line_parsing", "task_catalog_assembly"
                   )
               return policy_obj.detect_task_module(task)
           ```
      
      2. Update _collect_task_handler_catalog signature
         current: "(role_path, exclude_paths, marker_prefix, *, di=None)"
         new: "(role_path, exclude_paths, marker_prefix, *, di=None, scanner_context=None)"
         implementation:
           - Extract policy_constants from scanner_context OR di
           - Thread both params through all internal calls
           - Nested _collect_tasks_recursive receives both via closure
           - Call propagations:
             * tft.load_yaml_file(..., di=di, scanner_context=scanner_context)
             * tap.extract_task_annotations_for_file(..., di=di, scanner_context=scanner_context)
             * tft.iter_task_mappings(..., di=di, scanner_context=scanner_context)
      
      3. Update collect_task_handler_catalog public wrapper
         current: "(role_path, exclude_paths, marker_prefix, *, di=None)"
         new: "(role_path, exclude_paths, marker_prefix, *, di=None, scanner_context=None)"
         implementation: Forward both params to _collect_task_handler_catalog
    
    implementation_notes:
      - Mutual exclusivity check: optional (defer to di=None default if both absent)
      - Policy extraction from scanner_context: Use scanner_context.policy_constants
      - Both paths must thread through nested _collect_tasks_recursive function
      - Line 154: require_prepared_policy(di, "task_line_parsing", ...).TASK_INCLUDE_KEYS
        Must become: Extract from policy_obj (either from scanner_context or di)
    
    testing_strategy:
      - Parity test: Same inputs via di= vs scanner_context= produce identical outputs
      - Edge case: Both di= and scanner_context= provided (document behavior)
      - Edge case: Both di= and scanner_context= absent (should fail with clear error)
    
    acceptance_criteria:
      - _collect_task_handler_catalog accepts both params
      - Internal require_prepared_policy calls replaced with policy extraction
      - Nested recursion threads both params correctly
      - No behavioral change to di= path (backward compat)
      - New scanner_context= path produces identical output

  phase_2c_traversal_layer:
    objective: "Dual signatures in task_file_traversal.py"
    duration: "~1.5 hours"
    risk: "LOW-MEDIUM (mostly delegation; complex _iter_task_include_edges fallback logic)"
    files_affected:
      - src/prism/scanner_extract/task_file_traversal.py
    
    functions_to_update: 11+
      - _load_yaml_file
      - _load_yaml_file_with_metadata
      - _iter_task_mappings
      - _iter_task_include_targets
      - _iter_task_include_edges
      - _expand_include_target_candidates
      - _iter_role_include_targets
      - _iter_dynamic_role_include_targets
      - _collect_task_files
      - _collect_task_files_with_unresolved_includes
      - _collect_unconstrained_dynamic_task_includes
    
    special_handling:
      - _load_yaml_file_with_metadata: Complex error handling with 3 parse_yaml_candidate calls
        All 3 must forward both di= and scanner_context=
      - _iter_task_include_edges: Fallback to iter_task_include_targets if iter_task_include_edges missing
        Both paths must handle dual params
      - _collect_task_files_with_unresolved_includes: Nested _visit() function
        Receives both params via closure from outer function
    
    testing_strategy:
      - Parity tests for each function (di= vs scanner_context=)
      - Error path tests (e.g., parse_yaml_candidate with scanner_context)
      - Fallback path tests (_iter_task_include_edges with missing method)
    
    acceptance_criteria:
      - All 11+ functions have dual params
      - Both di= and scanner_context= paths thread correctly through nested functions
      - Error handling paths test successfully
      - Policy extraction from scanner_context works in all contexts

  phase_2d_annotation_layer:
    objective: "Dual signatures in task_annotation_parsing.py"
    duration: "~45 mins"
    risk: "LOW"
    files_affected:
      - src/prism/scanner_extract/task_annotation_parsing.py
    
    functions_to_update: 5
      - _split_task_annotation_label
      - _split_task_target_payload
      - _annotation_payload_looks_yaml
      - _extract_task_annotations_for_file
      - _task_anchor
    
    implementation: Straightforward delegation pattern
      Each function: Add scanner_context= param, forward to require_prepared_policy or extract from context
    
    testing_strategy:
      - Parity tests for each function
      - Verify plugin resolution works for both di= and scanner_context= paths
    
    acceptance_criteria:
      - All 5 functions have dual params
      - Both paths work identically

  phase_2e_caller_integration:
    objective: "Update entry points to support new scanner_context= path"
    duration: "~45 mins"
    risk: "LOW"
    files_affected:
      - src/prism/scanner_core/feature_detector.py
