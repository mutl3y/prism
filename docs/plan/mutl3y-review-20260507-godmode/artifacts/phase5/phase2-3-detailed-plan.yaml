         new: Must determine if scanner_context available in feature_detector
         option_a: Extract from self._di: policy_const = self._di.policy_constants
         option_b: Pass self._di as before; allow collect_task_handler_catalog to extract
      
      2. Scan for all other callers to public APIs
         grep results: Likely only feature_detector + test suite
         
    testing_strategy:
