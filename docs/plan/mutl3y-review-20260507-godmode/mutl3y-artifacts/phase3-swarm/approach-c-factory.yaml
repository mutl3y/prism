- Called during task catalog assembly (iterates all tasks)
- Uses require_prepared_policy(di, ...) NOT module proxy
- Lookup happens ~1x per task (hundreds per role)

2. **Secondary hotpath: task_catalog_assembly.py:17** (HELPER)
```python
def _detect_task_module(task: dict, *, di: object | None = None) -> str | None:
    return require_prepared_policy(
        di, "task_line_parsing", "task_catalog_assembly"
    ).detect_task_module(task)
```
- Helper used by catalog assembly
- Also uses require_prepared_policy(di, ...) NOT proxy

3. **Tertiary sites: task_line_parsing.py** (HELPERS + DEAD CODE)
```python
def get_task_include_keys(di: object | None = None) -> object:
    return _task_line_policy_attr(di, "TASK_INCLUDE_KEYS")
```
- Helper functions exist but are only called from tests
- Production code calls require_prepared_policy directly (not these helpers)
- Line 23 in extract_policies.py uses module proxy: `_ANSIBLE_TASK_INCLUDE_KEYS = task_line_parsing_module.TASK_INCLUDE_KEYS`
  - This is initialization-time (once per process), NOT hotpath

**Module-Level Proxy Usage:**
```python
TASK_INCLUDE_KEYS: Collection[str] = _PolicyBackedCollectionProxy("TASK_INCLUDE_KEYS")  # task_line_parsing.py:74
ROLE_INCLUDE_KEYS: Collection[str] = _PolicyBackedCollectionProxy("ROLE_INCLUDE_KEYS")  # task_line_parsing.py:75
```
- ONLY used in test assertions (test_task_line_parsing.py)
- NOT used on production hotpath (task_catalog_assembly uses require_prepared_policy)
- Dead code for production scans

**Hotpath Concentration:**
- task_catalog_assembly.py: ~95% of policy constant lookups on hot path
- task_line_parsing.py helpers: used by task_catalog_assembly OR tests only
- Module proxies: dead code for production

### Conclusion: **HIGHLY LOCALIZED — Can update 2-3 sites to use factory-resolved constants**

