## Risk Assessment

### Blocking Risks: NONE ✓

**Previous concerns eliminated:**
1. ✓ Bootstrap order: prepared_policy_bundle is available via ensure_prepared_policy_bundle_fn
2. ✓ Thread safety: per-scan isolation is built-in
3. ✓ Dead code: factory targets actual hotpath (task_catalog_assembly), not unused proxies

### Medium Risks

1. **Hotpath performance assumptions**
   - Risk: What if access pattern is different than expected?
   - Mitigation: Profiling before/after factory implementation; verify ~4.7µs savings per lookup
   - Likelihood: LOW (require_prepared_policy cost is documented)

2. **Test coverage gaps**
   - Risk: Tests may miss edge cases in PolicyConstants initialization
   - Mitigation: Add unit tests for PolicyConstants factory + concurrent scan tests
   - Likelihood: MEDIUM (test infrastructure changes needed)

3. **Policy bundle mutation**
   - Risk: Could prepared_policy_bundle change during scan?
   - Mitigation: Document as immutable; assert at factory creation
   - Likelihood: LOW (design shows immutability post-ensure)

### Low Risks

1. **Backward compatibility**
   - Risk: Older code expecting module proxies could break
   - Mitigation: Add deprecation warning to proxies before removal; provide period for migration
   - Likelihood: LOW (proxies are dead code for production)

2. **Initialization order bugs**
   - Risk: Policy constants used before factory initialization
   - Mitigation: Explicit initialization point; assert in consumers; test coverage
   - Likelihood: LOW (clear initialization semantics)

