investigation_title: "Static Factory Pattern for Policy Constants Resolution"
probe_name: "Probe-Factory-Pattern"
finding_reference: "CRITICAL - Misuse of Policy-Backed Proxies"
scope: "Single-angle investigation into static factory approach to resolve policy constants once per scan"

## Executive Summary
The static factory pattern pre-resolves policy constants from prepared_policy_bundle
into a PolicyConstants dataclass at scan initialization, then passes it through
the execution context (ScanOptions or ScannerContext). This approach is HIGH feasibility:
prepared_policy_bundle is available AFTER DIContainer creation (via ensure_prepared_policy_bundle_fn),
thread-safe (per-scan isolation), and eliminates proxy overhead entirely on production hot paths.
Unlike the DI-based approach, the factory pattern replaces the proxy pattern with a simpler
direct-value approach.

---

## Question 1: Is ScanContext Per-Scan (Thread-Safe)?

### Finding: YES — ScannerContext is Per-Scan, Thread-Safe ✓

**Evidence:**
- ScannerContext is created fresh per scan in `_assemble_execution_request()` (execution_request_builder.py)
- Each ScannerContext receives its own DIContainer instance
- DIContainer is per-scan (lines ~562, ~697 in execution_request_builder.py)
- Each DIContainer holds scan_options (including prepared_policy_bundle after ensure_prepared_policy_bundle_fn)
- Per-scan isolation is the default: multiple concurrent scans get independent ScannerContext + DIContainer pairs

**Thread-Safety Details:**
- DIContainer uses threading.RLock for cache management (di.py)
- ScanOptions are copied per scan (non_collection.py: _copy_scan_options())
- No shared mutable state across scans: prepared_policy_bundle, policy constants are scan-local
- Test cases show concurrent scan execution without contention (test_scanner_context.py)

**Implication for Factory Pattern:**
- PolicyConstants can be created once per ScannerContext initialization (safe)
- Can be stored as instance attribute on ScannerContext or passed via ScanOptions (safe)
- No cache invalidation needed (constants immutable within scan lifecycle)
- Multiple concurrent scans have isolated policy constants

### Conclusion: **THREAD-SAFE — Factory pattern is safe to implement**

