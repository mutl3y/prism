## Question 3: Could This Stepping Stone Remove Proxies?

### Finding: YES — Factory Pattern Enables Complete Proxy Removal ✓

**How Factory Pattern Removes Proxies:**

**Step 1: Define Factory**
```python
# In scanner_plugins/bundle_resolver.py (or scanner_core/policy_constants.py):
class PolicyConstants:
    """Stateless snapshot of resolved policy constants from a prepared_policy_bundle."""
    
    def __init__(self, prepared_policy_bundle):
        self.TASK_INCLUDE_KEYS = prepared_policy_bundle["task_line_parsing"].TASK_INCLUDE_KEYS
        self.ROLE_INCLUDE_KEYS = prepared_policy_bundle["task_line_parsing"].ROLE_INCLUDE_KEYS
        self.INCLUDE_VARS_KEYS = prepared_policy_bundle["task_line_parsing"].INCLUDE_VARS_KEYS
        self.SET_FACT_KEYS = prepared_policy_bundle["task_line_parsing"].SET_FACT_KEYS
        self.TASK_BLOCK_KEYS = prepared_policy_bundle["task_line_parsing"].TASK_BLOCK_KEYS
        self.TASK_META_KEYS = prepared_policy_bundle["task_line_parsing"].TASK_META_KEYS
        self.MARKER_LINE_REGEX = prepared_policy_bundle["task_line_parsing"].MARKER_LINE_REGEX

def build_policy_constants(prepared_policy_bundle):
    """Factory to build resolved PolicyConstants once per scan."""
    return PolicyConstants(prepared_policy_bundle)
```

**Step 2: Resolve at Scan Init (after prepared_policy_bundle available)**
```python
# In scanner_core/scanner_context.py or execution_request_builder.py, AFTER ensure_prepared_policy_bundle_fn:
policy_constants = build_policy_constants(scan_options["prepared_policy_bundle"])
# Option A: Store in scan_options
scan_options["policy_constants"] = policy_constants
# Option B: Pass to ScannerContext
scanner_context = ScannerContext(di=di, role_path=..., scan_options=..., policy_constants=policy_constants)
```

**Step 3: Update Hotpath Callers**
```python
# Before (using require_prepared_policy):
for include_key in require_prepared_policy(di, "task_line_parsing", "task_catalog_assembly").TASK_INCLUDE_KEYS:
    ...

# After (using factory-resolved constants):
# Option A: From ScanOptions
policy_constants = scan_options.get("policy_constants")
for include_key in policy_constants.TASK_INCLUDE_KEYS:
    ...

# Option B: From ScannerContext (cleaner)
for include_key in self.policy_constants.TASK_INCLUDE_KEYS:
    ...
```

**Step 4: Remove Module Proxies**
```python
# BEFORE (task_line_parsing.py):
TASK_INCLUDE_KEYS: Collection[str] = _PolicyBackedCollectionProxy("TASK_INCLUDE_KEYS")
ROLE_INCLUDE_KEYS: Collection[str] = _PolicyBackedCollectionProxy("ROLE_INCLUDE_KEYS")
# ... (proxies are dead code)

# AFTER (task_line_parsing.py):
# DELETE proxies entirely
# Tests now import from policy_constants module or mock directly
```

**Stepping Stone Benefits:**
1. Factory resolves to concrete values (no proxy magic needed)
2. Clear initialization point: `build_policy_constants()` is explicit
3. Easy to test: PolicyConstants is a simple dataclass
4. Simple to migrate: 2-3 hotpath sites updated, tests adjusted
5. No DI coupling: factory doesn't depend on DIContainer internals
6. Per-scan isolation automatic: new factory instance per scan

**Migration Path:**
1. Wave 1: Introduce PolicyConstants factory + initialize at scan start
2. Wave 2: Update task_catalog_assembly to use policy_constants (fallback to require_prepared_policy)
3. Wave 3: Remove fallback, verify hotpath works
4. Wave 4: Remove module proxies, delete _PolicyBackedCollectionProxy class
5. Wave 5: Update tests to use new approach

### Conclusion: **YES — Factory pattern is an excellent stepping stone to complete proxy elimination**

