## Recommended Implementation Flow

### Wave 1: Factory Definition + Initialization
1. Create `scanner_core/policy_constants.py` with PolicyConstants class
2. Add factory function `build_policy_constants(prepared_policy_bundle)`
3. Identify exact initialization point in execution_request_builder.py (after ensure_prepared_policy_bundle_fn)
4. Store policy_constants in scan_options: `scan_options["policy_constants"] = factory_result`
5. Add assertions to catch missing policy_constants in consumers

### Wave 2: Hotpath Migration (with fallback)
1. Add policy_constants parameter to ScannerContext.__init__ (optional, with fallback)
2. Update task_catalog_assembly._detect_task_module() to try factory, fall back to require_prepared_policy
3. Update task_catalog_assembly loop (line 156) same pattern
4. Add performance tests to verify ~4.7µs savings per lookup

### Wave 3: Proxy Deprecation
1. Add deprecation warning to module proxies
2. Update test imports to use factory-resolved constants
3. Run full test suite; verify no production paths use proxies

### Wave 4: Proxy Removal (cleanup)
1. Delete _PolicyBackedCollectionProxy class
2. Delete module-level TASK_INCLUDE_KEYS, ROLE_INCLUDE_KEYS, etc. proxies
3. Delete test utilities that mock proxies
4. Final full test run

---

## Conclusion

**Static Factory Pattern achieves:**
1. ✓ HIGH feasibility — prepared_policy_bundle available at natural init point
2. ✓ SIGNIFICANT performance improvement — 7-14ms per collection scan
3. ✓ COMPLETE proxy elimination — stepping stone removes dead code
4. ✓ CLEAR architectural ownership — PolicyConstants is explicit and testable
5. ✓ THREAD-SAFE — per-scan isolation built-in
6. ✓ LOW complexity — simple dataclass + 2-3 hotpath updates

**One-sentence summary**: Static factory pattern resolves policy constants once per scan,
eliminates proxy overhead (7-14ms per collection), and provides a clean stepping stone
to remove the entire proxy pattern while maintaining thread safety and per-scan isolation.

