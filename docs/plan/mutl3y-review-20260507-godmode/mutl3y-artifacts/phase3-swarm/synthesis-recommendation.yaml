## Executive Summary

Four competing approaches investigated for resolving policy-backed proxy runtime overhead and architectural issues:

| Approach | Feasibility | Risk | Performance | Recommendation |
|----------|-------------|------|-------------|-----------------|
| A: Caching Layer | Medium | High | Marginal (4.7µs/call) | ❌ NO |
| B: DI-Based Resolution | Medium | High | Zero (dead code) | ❌ NO |
| C: Static Factory Pattern | **HIGH** | **LOW** | **7-14ms savings** | ✅ **YES** |
| D: Lazy Properties | Medium | **CRITICAL** | Modest | ❌ NO |

---

## Detailed Findings

### Approach A: Caching Layer
**Conclusion**: Technically feasible but architecturally wrong

- **Pros**: Minimal code change (~4 lines), low effort
- **Cons**: 
  - Doesn't eliminate root cause (dynamic resolution)
  - Masks architectural issue with optimization band-aid
  - Thread-safety issues with `di=None` cache key strategy
  - Cache invalidation complexity
- **Risk Level**: MEDIUM (thread safety issues)
- **Performance Gain**: 4.7µs/call → 7-14ms per 150-300k calls in large scan (marginal)
- **Verdict**: Optimization masking real problem; not recommended

---

### Approach B: DI-Based Resolution
**Conclusion**: Bootstrap ordering blocker, plus zero real benefit

- **Pros**: Conceptually clean (DI-resolved constants)
- **Cons**:
  - prepared_policy_bundle NOT available at DIContainer init time (50+ lines later)
  - Forces post-creation lazy-init coupling to bootstrap flow
  - Module-level proxies are DEAD CODE (only used in tests)
  - Production code calls require_prepared_policy(di, ...) directly in task_catalog_assembly
  - Optimizing proxies yields ZERO production benefit
- **Risk Level**: HIGH (bootstrap ordering, dead code optimization)
- **Performance Gain**: Zero (proxies aren't the actual bottleneck)
- **Verdict**: Solves wrong problem; real overhead is hotpath require_prepared_policy() calls

---

### Approach C: Static Factory Pattern ✅ RECOMMENDED
**Conclusion**: Clean, feasible, eliminates real overhead, enables future proxy removal

- **Pros**:
  - Creates policy constants factory that resolves once per scan
  - Eliminates all proxy overhead per-scan (one-time ~100µs startup cost)
  - Caches constants in per-scan ScanContext (thread-safe, isolated)
  - Stepping stone to complete proxy removal
  - Targets actual hotpath (task_catalog_assembly.py, 2-3 production callsites)
  - Natural initialization point (after ensure_prepared_policy_bundle)
- **Cons**:
  - ~30-40 lines factory code + 2-3 hotpath updates
  - Requires ScanContext field addition
  - Moderate coupling to scanner initialization flow
- **Risk Level**: LOW (per-scan isolation, well-understood pattern)
- **Performance Gain**: 7-14ms per collection scan (4.7µs × 150-300 hotpath lookups)
- **Thread Safety**: ✅ SAFE (ScanContext is per-scan, no cross-scan sharing)
- **Effort**: 16-24 hours (1-2 days of focused work)
- **Future Roadmap**:
  - Wave 2: Deploy factory, migrate hotpaths, cache results
  - Wave 3+: Deprecate proxy classes entirely
  - End state: Pure DI-resolved policy constants (no proxies)
- **Verdict**: **YES — Recommended for Wave 2 implementation**

---

### Approach D: Lazy Property Decorators
**Conclusion**: CRITICAL flaw — causes cross-scan cache poisoning

- **Pros**: 
  - Simple decorator pattern (~10 lines)
  - Transparent to callers
  - Low effort
- **Cons**:
  - **CRITICAL**: Module-singleton proxies cache results on first access forever
  - No cache invalidation between scans
  - Concurrent scans with different policies silently share wrong constants
  - **DATA CORRUPTION RISK**: First scan to access proxy owns cached value; subsequent scans see wrong constants without error
  - **Multi-platform incompatible**: Kubernetes scans see Ansible constants cached from prior scan
  - Breaks audit trail integrity
- **Risk Level**: **CRITICAL** (silent data corruption, cache poisoning)
- **Performance Gain**: Modest per-scan (one hit per cached property), but risk outweighs benefit
- **Verdict**: ❌ NO — REJECT (unacceptable correctness risk)

