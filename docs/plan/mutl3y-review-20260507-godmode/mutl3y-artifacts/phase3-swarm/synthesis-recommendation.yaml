## Recommended Path Forward

### Wave 2 Implementation: Static Factory Pattern (Approach C)

**Phase 1: Factory Scaffolding**
1. Create `PolicyConstants` dataclass in scanner_data/policy_constants.py
2. Add factory function `build_policy_constants(prepared_policy) -> PolicyConstants`
3. Add `policy_constants` field to ScannerContext
4. Initialize in scanner_context init or scan_request ensure_prepared_policy_bundle flow

**Phase 2: Hotpath Migration**
1. Update task_catalog_assembly.py to use `context.policy_constants.TASK_INCLUDE_KEYS`
2. Update task_traversal.py to use factory-resolved constants
3. Update task_annotation_parsing.py to use factory-resolved constants

**Phase 3: Testing & Validation**
1. Add unit tests for PolicyConstants factory
2. Add integration tests for per-scan isolation
3. Verify no cross-scan cache pollution
4. Validate performance improvement (7-14ms per scan)

**Phase 4: Deprecation & Cleanup** (future wave)
1. Mark proxy classes as deprecated
2. Emit deprecation warnings on proxy access
3. Plan removal for Q2 2026

