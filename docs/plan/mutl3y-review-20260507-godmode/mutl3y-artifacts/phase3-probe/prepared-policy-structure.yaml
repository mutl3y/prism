recommendation_for_factory:
  issue: Wave 2 attempted prepare_policy_bundle.TASK_INCLUDE_KEYS but this is not valid dict access
  root_cause: TASK_INCLUDE_KEYS is not a top-level key; it is an attribute of the nested task_line_parsing policy object
  correct_access_patterns:
    - direct_access: prepared_policy_bundle['task_line_parsing'].TASK_INCLUDE_KEYS
    - via_helper: get_task_include_keys(di)
    - via_proxy: task_line_parsing.TASK_INCLUDE_KEYS (module-level proxy)
  refactoring_approach:
    option_1:
      name: Extract constants from nested policy at factory
      description: |
        Create flat constants at module level by resolving the nested policy early.
        This moves the dig-through into the factory, not the runtime code.
      location: src/prism/scanner_plugins/defaults.py (factory layer)
      complexity: low
      impact: Cleaner factory interface; flat constants in namespace
      example: |
        def factory_task_line_constants(di):
            policy = resolve_task_line_parsing_policy_plugin(di)
            return {
                'TASK_INCLUDE_KEYS': policy.TASK_INCLUDE_KEYS,
                'ROLE_INCLUDE_KEYS': policy.ROLE_INCLUDE_KEYS,
                # ... etc
            }
    option_2:
      name: Use prepared_policy_bundle['task_line_parsing'] accessors directly
      description: |
        Keep nested structure; use consistent accessors throughout.
        Existing _PolicyBackedCollectionProxy already does this.
      complexity: low
      impact: Maintains canonical structure; existing patterns work
      example: |
        prepared_policy_bundle['task_line_parsing'].TASK_INCLUDE_KEYS

refactoring_complexity: low

