              self,
              scan_options: ScanOptionsDict,
              scan_context: ScanMetadata,
          ) -> ScanMetadata: ...

      def _is_process_scan_pipeline_plugin(value: object) -> TypeGuard[...]:
          return isinstance(value, _ProcessScanPipelinePlugin)

  - test_result: "isinstance check PASSES despite signature incompatibility"
    details: |
      DefaultScanPipelinePlugin uses dict[str, Any] instead of typed contract
      - isinstance(default_plugin, _ProcessScanPipelinePlugin) returns True
      - Method exists and is callable but signature mismatches ignored
      - isinstance() only checks attribute presence, not signature compatibility

  - runtime_risk: "HIGH - Delayed TypeError at orchestration time"
    evidence: |
      1. Plugin may have method name but incompatible parameter signature
      2. isinstance check passes (attribute existence only)
      3. Runtime call at line 305 or 417 fails with TypeError
      4. Critical scanner_kernel orchestration flow affected
      5. No early validation prevents incompatible plugins from reaching runtime

  - test_coverage: "PARTIAL - Structure checks only, no signature validation"
    findings: |
      - test_kernel.py: isinstance(plugin, KernelLifecyclePlugin) validates presence, not signature
      - test_api_cli_repo_parity.py: Uses inspect.signature() for API parity, not plugin protocols
      - NO tests validate _ProcessScanPipelinePlugin method signature match
      - NO tests for orchestrate_scan_payload signature mismatch detection
      - DefaultScanPipelinePlugin uses Any types; no guard prevents misuse

  - failure_example: |
      A plugin with incompatible method signature:
        def process_scan_pipeline(self):  # Missing required parameters!
            return None

      Result: isinstance passes, runtime call at line 305 fails with TypeError
      The validation gap allows incompatible implementations to reach orchestration

recommendations:
