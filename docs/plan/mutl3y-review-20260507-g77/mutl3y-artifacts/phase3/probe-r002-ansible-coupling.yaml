      step: "Stabilize the remaining 13 essential imports as the permanent scanner_plugins.ansible ↔ scanner_extract boundary"
      reasoning: "These core functions are deep in the task/role traversal, module detection, and annotation extraction paths; abstracting them would require significant scanner_extract refactoring or new plugin protocols"
      options_explored:
        - "Option A: Create scanner_plugins.ansible.traversal submodule to wrap iter/collect patterns — requires plugin protocol redesign for traversal contracts"
        - "Option B: Keep core imports but document the implicit boundary as a maintenance contract"
      recommendation: "Option B (maintain + document) for now; Option A deferred to future architecture review"
      risk_level: "low (maintenance debt, not functional risk)"
