    RISK ASSESSMENT: NONE

    Evidence:
    1. Extract→Core→Plugins forms a strict one-way acyclic dependency
    2. Plugins layer has ZERO back-imports to extract or core
    3. All scanner_extract→scanner_core imports are static/simple di_helpers access
    4. All scanner_core→scanner_extract imports are function-wrapped (lazy)
    5. All scanner_core→scanner_plugins imports either:
       - TYPE_CHECKING (compile-time only, no runtime init)
       - Or wrapped in factory methods (deferred to first-call, not at import time)
    6. Bootstrap facade ensures registry stays uninitialized until explicit access
    7. Multiple AST-based guardrail tests enforce the layering
    8. Manual import testing confirms successful load sequence

    No registry access happens during module initialization of any layer.
    Therefore, policy resolution cannot trigger circular imports during extract init.

