class InMemoryLRUScanCache:
    def __init__(self, maxsize: int = 64, max_memory_bytes: int | None = None) -> None:
        self._hits = 0
        self._misses = 0
        self._evictions = 0  # NEW
        self._current_memory = 0  # NEW (from Phase 5c)
        # ... rest
    
    def _evict_lru_single(self) -> None:
        """Evict LRU entry and track eviction."""
        # ... existing eviction code ...
        self._evictions += 1  # NEW
    
    def stats(self) -> dict[str, int | float]:
        """Return comprehensive cache statistics."""
        with self._lock:
            total_ops = self._hits + self._misses
            hit_rate = self._hits / total_ops if total_ops > 0 else 0.0
            return {
                "hits": self._hits,
                "misses": self._misses,
                "hit_rate": hit_rate,
                "hit_rate_percent": round(hit_rate * 100, 2),
                "evictions": self._evictions,
                "entries": len(self._store),
                "memory_bytes": self._current_memory,
            }
```

