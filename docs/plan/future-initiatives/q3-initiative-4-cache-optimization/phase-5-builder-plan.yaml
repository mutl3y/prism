def test_cache_key_type_collision_prevention():
    """Keys with same value but different types must produce different cache keys."""
    cache_key_1 = compute_scan_cache_key(
        role_content_hash="abc123",
        scan_options={"data": {1: "int_key"}},
    )
    cache_key_2 = compute_scan_cache_key(
        role_content_hash="abc123",
        scan_options={"data": {"1": "str_key"}},  # Different key type
