def test_cache_respects_memory_limit():
    """Cache must evict entries when memory limit is exceeded."""
    backend = InMemoryLRUScanCache(
        maxsize=1000,
        max_memory_bytes=1_000_000,  # 1MB limit
    )
    
    large_value = {"data": "x" * 500_000}  # ~500KB entry
    
    # First entry should succeed
    cache_key_1 = compute_scan_cache_key(
        role_content_hash="role1",
        scan_options={"data": large_value},
    )
    backend.set(cache_key_1, {"result": large_value})
    assert len(backend._store) == 1
    
    # Second entry should trigger memory-based eviction
    cache_key_2 = compute_scan_cache_key(
        role_content_hash="role2",
        scan_options={"data": large_value},
    )
    backend.set(cache_key_2, {"result": large_value})
    assert len(backend._store) <= 2  # May have evicted first entry
    assert backend._current_memory <= 1_000_000 * 1.1  # Allow 10% overage during set
```

