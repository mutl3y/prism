def test_cache_metrics_comprehensive():
    """Cache must track all relevant metrics."""
    backend = InMemoryLRUScanCache(maxsize=3, max_memory_bytes=10_000_000)
    
    # 3 cache misses
    for i in range(3):
        key = compute_scan_cache_key(
            role_content_hash=f"role{i}",
            scan_options={"data": f"value{i}"},
        )
        backend.set(key, {"result": f"data{i}"})
    
    # 2 cache hits
    key_0 = compute_scan_cache_key(
        role_content_hash="role0",
        scan_options={"data": "value0"},
    )
    result1 = backend.get(key_0)
    result2 = backend.get(key_0)
    
    stats = backend.stats()
    assert stats["hits"] == 2
    assert stats["misses"] == 3
    assert stats["hit_rate"] == pytest.approx(0.4)
    assert stats["hit_rate_percent"] == 40.0
    assert stats["entries"] == 3
    assert stats["evictions"] >= 0
    
    # report_stats() should be human-readable
    report = backend.report_stats()
    assert "40.0%" in report
    assert "hits=2" in report

def test_cache_eviction_counted():
    """Evictions must be tracked."""
    backend = InMemoryLRUScanCache(maxsize=2)
    
    # Add 3 entries; 1 should be evicted
    for i in range(3):
        key = compute_scan_cache_key(
            role_content_hash=f"role{i}",
            scan_options={"data": f"value{i}"},
        )
        backend.set(key, {"result": f"data{i}"})
    
    stats = backend.stats()
    assert stats["evictions"] >= 1
    assert stats["entries"] == 2
```

