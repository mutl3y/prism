## Known Unknowns & Blockers

### Decision Points for Builders
1. **Size Estimation Heuristic**: sys.getsizeof() vs. actual heap inspection?
   - Recommendation: Use sys.getsizeof() (simple, portable)
   - Alternative: introspect with pympler (adds dependency)

2. **Memory Limit Default**: 100MB, 512MB, or unlimited?
   - Recommendation: unlimited by default (no behavior change)
   - Users opt-in to memory bounds via config

3. **Eviction Policy on Memory Pressure**: Evict 1 entry or 10%?
   - Recommendation: Evict 1 LRU entry per insertion (simple, predictable)
   - Alternative: Batch-evict to 90% capacity (reduces churn)

### No External Blockers Found ✅
- All cache code is isolated in `scanner_core/scan_cache.py`
- No upstream APIs need changes
- Test infrastructure already in place

