**Risk**: Low

### Current Implementation

**File**: `src/prism/scanner_core/scan_cache.py` (lines 110-120)

```python
@property
def hits(self) -> int:
    with self._lock:
        return self._hits

@property
def misses(self) -> int:
    with self._lock:
        return self._misses

def stats(self) -> tuple[int, int]:
    """Return (hits, misses) atomically."""
    with self._lock:
        return self._hits, self._misses
```

