from typing import Protocol, runtime_checkable

@runtime_checkable
class CacheKeyProvider(Protocol):
    """Protocol for custom objects to provide stable cache keys.
    
    Implement this protocol if your object's cache identity must be stable
    across process runs and not depend on memory address (id()).
    
    Returns:
        str: A stable, deterministic string that uniquely identifies this object's
             cache key. Must be identical for objects with identical semantic state.
    
    Example:
        class MyConfig:
            def __init__(self, version: str):
                self.version = version
            
            def __cache_key__(self) -> str:
                # Stable key based on semantic state, not id()
                return f"MyConfig@v{self.version}"
    """
    def __cache_key__(self) -> str: ...
```

