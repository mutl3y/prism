## Phase 5a: Deterministic Cache Keys (Verification & Solidification)

**Status**: Already working, needs documentation + edge-case coverage
**Effort**: 1-2 days
**Risk**: Low

### Current Implementation

**File**: `src/prism/scanner_core/scan_cache.py` (lines 266-376)

#### Key Generation Flow
```python
# Current (GOOD):
def compute_scan_cache_key(
    *,
    role_content_hash: str,
    scan_options: Mapping[str, Any],
) -> str:
    """Build a stable cache key from a role content hash and scan options."""
    
    def _canonicalize(value: object, depth: int = 0) -> object:
        # Primitives: returned as-is (str, int, float, bool, None)
        if isinstance(value, (str, int, float, bool)) or value is None:
            return value
        
        # Containers: recursively canonicalized
        if isinstance(value, dict):
            return {
                f"__key__:{type(key).__name__}:{str(key)}": _canonicalize(item, depth + 1)
                for key, item in value.items()
            }
        
        # Custom objects: CRITICAL FIX (GILF-NODE3-04)
        # 1. Check for __cache_key__() protocol (preferred)
        if hasattr(value, "__cache_key__") and callable(value.__cache_key__):
            cache_key = value.__cache_key__()
            return {"__custom_cache_key__": f"{module}.{qualname}::{cache_key}"}
        
        # 2. Try hashability with custom __hash__/__eq__
        # 3. Fall back to type-only (with WARNING)
    
    options_blob = json.dumps(_canonicalize(dict(scan_options)), sort_keys=True)
    options_hash = hashlib.sha256(options_blob.encode("utf-8")).hexdigest()
    return f"{role_content_hash}:{options_hash}"
```

#### Issue Found: Key Collision Edge Case
Current code detects `__key__:type:value` pattern by type inspection, but dict keys are re-serialized.
**Risk**: Two semantically different dicts (e.g., `{1: "a"}` vs `{"1": "a"}`) may produce the same key if type info is lost in serialization.

### Phase 5a Deliverables

#### 1. Add Type-Safe Key Serialization (1 file change)
**File**: `src/prism/scanner_core/scan_cache.py`

**Before**:
```python
# Current: Keys are stringified with type hint, but JSON loses type
{
    f"__key__:{type(key).__name__}:{str(key)}": _canonicalize(item, depth + 1)
    for key, item in value.items()
}
# Result: {"__key__:int:1": ...} and {"__key__:str:1": ...} both serialize to same JSON
```

**After**:
```python
# Fixed: Use JSON-safe type markers in the key tuple itself
def _safe_dict_key(key: object) -> str:
    """Serialize dict key with type safety for JSON round-trip."""
    key_type = type(key).__name__
    key_value = json.dumps(key)  # Use JSON to handle nested types
    return f"__{key_type}__:{key_value}"

# In dict canonicalization:
return {
    _safe_dict_key(key): _canonicalize(item, depth + 1)
    for key, item in value.items()
}
```

