### Problem
- No memory bounding (can grow unbounded per entry value size)
- Large cache entries can cause OOM on resource-constrained systems
- No way to configure memory limits for CI/CD pipelines

### Phase 5c Deliverables

#### 1. Add Size Estimation Function (1 file)
**File**: `src/prism/scanner_core/scan_cache.py` (ADD, ~100 lines)

```python
import sys

def estimate_object_size_bytes(value: Any) -> int:
    """Estimate memory size of a Python object in bytes.
    
    Uses sys.getsizeof() for base objects + recursive estimation for containers.
    Provides reasonable approximations for caching decisions.
    
    Args:
        value: Any Python object
    
    Returns:
        Estimated size in bytes (conservative upper bound)
    
    Limitations:
        - Does not account for external memory (e.g., large numpy arrays)
        - Over-estimates for shared/interned objects
        - Best-effort approximation, not exact
    """
    visited = set()
    
    def _size_of(obj: Any) -> int:
        obj_id = id(obj)
        if obj_id in visited:
            return 0  # Avoid double-counting cycles
        visited.add(obj_id)
        
        # Base size
        size = sys.getsizeof(obj)
        
        # Recurse for containers
        if isinstance(obj, dict):
            for k, v in obj.items():
                size += _size_of(k) + _size_of(v)
        elif isinstance(obj, (list, tuple)):
            size += sum(_size_of(item) for item in obj)
        elif isinstance(obj, set):
            size += sum(_size_of(item) for item in obj)
        
        return size
    
    return max(1, _size_of(value))  # Min 1 byte to avoid empty entries
```

