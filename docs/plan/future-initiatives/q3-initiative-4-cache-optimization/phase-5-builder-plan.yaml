```

**After**:
```python
class InMemoryLRUScanCache:
    def __init__(
        self,
        maxsize: int = 64,
        max_memory_bytes: int | None = None,
    ) -> None:
        """Initialize LRU scan cache.
        
        Args:
            maxsize: Maximum number of entries (default 64)
            max_memory_bytes: Maximum total memory in bytes (default None = unlimited).
                              Common values: 100MB (100_000_000), 512MB (536_870_912)
        """
        self._maxsize = maxsize
        self._max_memory_bytes = max_memory_bytes
        self._store: OrderedDict[str, Any] = OrderedDict()
        self._entry_sizes: dict[str, int] = {}  # Track size per entry
        self._current_memory = 0
    
    def set(self, key: str, value: Any) -> None:
        """Set value, evicting by memory pressure if needed."""
        # ... existing code ...
        
        # Size tracking
        value_size = estimate_object_size_bytes(value)
        
        # Evict by memory pressure BEFORE adding new entry
        while (
            self._max_memory_bytes is not None
            and self._current_memory + value_size > self._max_memory_bytes
            and len(self._store) > 0
        ):
            self._evict_lru_single()
        
        # Add entry and update memory
        self._store[key] = _clone_container_structure(value)
        self._entry_sizes[key] = value_size
        self._current_memory += value_size
    
    def _evict_lru_single(self) -> None:
        """Evict least-recently-used entry."""
        if not self._store:
            return
        lru_key = next(iter(self._store))  # First key in OrderedDict
        evicted_size = self._entry_sizes.pop(lru_key, 0)
        self._store.pop(lru_key)
        self._current_memory -= evicted_size
```

