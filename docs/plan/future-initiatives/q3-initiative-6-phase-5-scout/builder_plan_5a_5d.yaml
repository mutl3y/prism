# PHASE 5d: Ownership Consolidation (2-3 days)
# ============================================================================

ownership_map:

  marker_prefix_authority:
    current_authority: "scanner_plugins/bundle_resolver.py::ensure_prepared_policy_bundle()"
    ownership_flow:
      1: "Ingress: scan_options['comment_doc_marker_prefix'] (optional, direct caller input)"
      2: "Policy: scan_options['policy_context']['comment_doc']['marker']['prefix'] (optional, config override)"
      3: "Role config: .prism.yml markers.prefix (fallback via load_readme_marker_prefix())"
      4: "Default: scanner_config/section.py::DEFAULT_DOC_MARKER_PREFIX = 'prism'"
    
    resolution_logic:
      step_1: "Check ingress ['comment_doc_marker_prefix'] if present"
      step_2: "Check policy_context.comment_doc.marker.prefix if ingress missing"
      step_3: "Check .prism.yml via load_readme_marker_prefix() if both missing"
      step_4: "Fall back to DEFAULT_DOC_MARKER_PREFIX"
    
    enforcement:
      fail_closed: "All fallback paths tested; ValueError raised if bundle missing at runtime"
      bundle_project: "ensure_prepared_policy_bundle() projects final value into PreparedPolicyBundle['comment_doc_marker_prefix']"
      runtime_enforcement: "task_extract_adapters._resolve_marker_prefix() reads ONLY from bundle, never from policy_context directly"
    
    consolidation_target: "Single authority: PreparedPolicyBundle is the canonical runtime source"
    files_involved:
      - "scanner_config/marker.py (load_readme_marker_prefix)"
      - "scanner_plugins/bundle_resolver.py (ensure_prepared_policy_bundle)"
      - "scanner_core/task_extract_adapters.py (_resolve_marker_prefix)"

  policy_authority:
    prepared_policy_bundle_ownership: "scanner_plugins/bundle_resolver.py::ensure_prepared_policy_bundle()"
    
    policy_kinds_consolidated:
      - name: "comment_doc_marker_prefix"
        authority: "bundle_resolver.py"
        enforcer: "task_extract_adapters._resolve_marker_prefix()"
        status: "✅ CONSOLIDATED"

      - name: "task_annotation_policy"
        authority: "plugin_resolver → factory_task_annotation_policy_plugin()"
        enforcer: "scanner_extract/task_extract_adapters.py (reads from bundle)"
        status: "✅ CONSOLIDATED"

      - name: "task_line_parsing_policy"
        authority: "plugin_resolver → factory_task_line_parsing_policy_plugin()"
        enforcer: "scanner_extract/task_line_parsing.py (reads from bundle)"
        status: "✅ CONSOLIDATED"

      - name: "task_traversal_policy"
        authority: "plugin_resolver → factory_task_traversal_policy_plugin()"
        enforcer: "scanner_extract/task_traversal_*.py"
        status: "✅ CONSOLIDATED"

      - name: "variable_extractor_policy"
        authority: "plugin_resolver → factory_variable_extractor_policy_plugin()"
        enforcer: "scanner_extract/variable_extractor.py"
        status: "⚠️  RETAINED SHIM (see below)"

    fail_closed_checklist:
      - "✅ prepare_policy functions in scanner_core/scanner_extract raise ValueError on missing bundle"
      - "✅ No silent DEFAULT_* fallbacks in critical paths"
      - "✅ bundle_resolver is single orchestrator for policy bundle creation"
      - "⚠️  variable_extractor.py retains legacy fallback seam (documented, kept for backward compat)"

  error_authority:
    error_contract: "scanner_data/contracts_request.py::ErrorContract (TypedDict)"
    error_fields:
      - { field: "error_type", values: "validation|system|config|plugin", ownership: "caller layer" }
      - { field: "layer", values: "config|core|plugins|io", ownership: "origin layer" }
      - { field: "message", required: true, ownership: "error originator" }
      - { field: "recoverable", type: "bool", ownership: "layer + caller context" }

    error_authority_layers:
      config_layer:
        owner: "scanner_config/marker.py, scanner_config/section.py"
        errors: ["README_MARKER_CONFIG_YAML_INVALID", "README_MARKER_CONFIG_IO_ERROR"]
        classification: "config / validation"

      core_layer:
        owner: "scanner_core/di.py, scanner_core/task_extract_adapters.py"
        errors: ["di_factory_override_failed", "missing_plugin_registry", "unregistered_plugin"]
        classification: "system / validation"
        uses_prismeruntimeerror: true

      plugins_layer:
        owner: "scanner_plugins/bundle_resolver.py, scanner_plugins/*.py"
        errors: ["prepared_policy_bundle_malformed"]
        classification: "plugin / validation"

    standardization_status: "✅ PARTIAL (core uses PrismRuntimeError; config uses warnings; plugins mixed)"
    consolidation_needed: "Standardize exception types across layers (ADR candidate)"

  default_ownership:
    marker_prefix_default: "scanner_config/section.py::DEFAULT_DOC_MARKER_PREFIX = 'prism'"
    default_authorities:
      - { default: "DEFAULT_DOC_MARKER_PREFIX", owner: "scanner_config/section.py", consumers: "3+" }
      - { default: "DEFAULT_VARIABLE_DISCOVERY_PLUGIN", owner: "di.py", consumers: "DI wiring" }
      - { default: "DEFAULT_FEATURE_DETECTION_PLUGIN", owner: "di.py", consumers: "DI wiring" }

    consolidation_status: "✅ COMPLETE (all defaults declared in scanner_config/section.py)"

