# Immutability Strategy Recommendations

## Strategy 1: Frozen Dataclass (Recommended for Structured Output)

**Applies to**: ScanMetadata, ScanErrorEntry

```python
from dataclasses import dataclass, field
from typing import Frozen

@dataclass(frozen=True)
class ScanMetadata:
    """Immutable scan metadata payload."""
    plugin_name: str | None = None
    features: dict[str, object] | None = None
    scan_errors: tuple[ScanErrorEntry, ...] = field(default_factory=tuple)
    scan_degraded: bool = False
    # ... other fields as immutable properties
```

**Pros**:
- Runtime enforcement (attempt to mutate raises FrozenInstanceError)
- Type-safe field access
- Backward-compatible representation (still dict-like via field access)
- Supports validation in __post_init__

**Cons**:
- Breaking change: callers cannot use dict-style `metadata["key"] = value`
- Requires gradual migration via compatibility layer

**Phase**: Phase 1-2 (Builder pattern first, then frozen dataclass)

---

## Strategy 2: @property-Only Access (Current + Enhance)

**Applies to**: All internal mutation fields

```python
class ScannerContext:
    def __init__(self, ...):
        self.__discovered_variables: tuple[Any, ...] = ()
        self.__detected_features: FeaturesContext = _build_empty_features_context()
        self.__scan_metadata: ScanMetadata = ScanMetadata()
        self.__scan_errors: list[ScanErrorEntry] = []
    
    @property
    def discovered_variables(self) -> tuple[Any, ...]:
        """Read-only access to discovered variables."""
        return self.__discovered_variables
    
    # ... no setter, no direct access
```

**Pros**:
- No breaking changes (external API unchanged)
- Prevents accidental mutations from outside
- Can refactor internals without affecting callers

**Cons**:
- Still allows internal mutation (not enforced at runtime)
- Requires discipline to not mutate via internal methods

**Phase**: Phase 0-1 (Immediate, low-risk)

---

## Strategy 3: Builder Pattern (Recommended for Payload Assembly)

**Applies to**: ScanMetadata assembly during _build_output_payload()

```python
class ScanMetadataBuilder:
    def __init__(self, initial: ScanMetadata) -> None:
        self._data = dict(initial)
    
    def with_features(self, features: dict[str, object]) -> "ScanMetadataBuilder":
        self._data["features"] = features
        return self
    
    def with_errors(self, errors: list[ScanErrorEntry]) -> "ScanMetadataBuilder":
        self._data["scan_errors"] = errors
        return self
    
    def build(self) -> ScanMetadata:
        """Return immutable ScanMetadata."""
        return ScanMetadata(**self._data)

# Usage in _build_output_payload:
metadata = (
    ScanMetadataBuilder(context_payload.get("metadata"))
    .with_features(_copy_features_metadata(self._detected_features))
    .with_errors(list(self._scan_errors))
    .with_policy_warnings(policy_warning_list)
    .build()
)
```

**Pros**:
- Explicit, chainable API for payload assembly
- Clear immutability boundary at .build()
- Enables step-by-step validation

**Cons**:
- Requires refactoring of _build_output_payload() flow
- Adds abstraction layer

**Phase**: Phase 1-2 (After frozen dataclass in place)

