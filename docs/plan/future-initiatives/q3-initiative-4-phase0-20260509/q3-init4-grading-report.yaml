#### 1.2: Immutability Enforcement (MUST PASS)

```yaml
test_category: "Immutability Enforcement"
description: "Prove Phase 1 prevents external mutations"

test_cases:
  - name: "test_scanner_context_fields_read_only"
    scope: "Verify cannot assign to properties"
    example: |
      context = ScannerContext(...)
      with pytest.raises(AttributeError):
          context.discovered_variables = ()
      with pytest.raises(AttributeError):
          context.scan_metadata = {}
    expected_result: "✅ @property blocks assignment"

  - name: "test_scanner_context_defensive_copies_prevent_mutation"
    scope: "Verify returned data can't mutate internal state"
    example: |
      context = ScannerContext(...)
      context.orchestrate_scan()
      
      # Mutate returned metadata
      metadata = context.scan_metadata
      metadata["scan_degraded"] = True
      
      # Internal state unchanged
      fresh = context.scan_metadata
      assert fresh.get("scan_degraded") == False (original value)
    expected_result: "✅ Deepcopy protects internal state"

  - name: "test_scanner_context_policy_constants_read_only"
    scope: "Verify policy_constants cannot be reassigned"
    example: |
      # Build context with policy bundle
      context = ScannerContext(..., scan_options={"prepared_policy_bundle": ...})
      original = context.policy_constants
      
      with pytest.raises(AttributeError):
          context.policy_constants = different_constants
    expected_result: "✅ policy_constants read-only"

measurement: "0 mutations succeed; all attempts blocked"
pass_threshold: "✅ MUST be 100% (no external mutations possible)"
