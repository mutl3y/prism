risks_and_mitigations:
  - risk: "Test reorganization breaks existing CI/CD workflows"
    severity: medium
    mitigation: "Update tox.ini and CI configs before moving tests"
    
  - risk: "K8s/Terraform adapters exceed complexity estimate"
    severity: medium
    mitigation: "Use Ansible adapter as strict template, limit feature scope to error codes only"
    
  - risk: "Fixture scenarios insufficient for error detection coverage"
    severity: low
    mitigation: "Add fixtures incrementally as gaps discovered during testing"
    
  - risk: "Documentation updates diverge from implementation"
    severity: low
    mitigation: "Update docs in parallel with implementation, not after"

success_criteria:
  - Multi-platform support: Kubernetes and Terraform adapters fully implemented
  - Error parity: All 3 platforms emit consistent error envelope structure
  - Test coverage: 1450+ tests passing (80+ new plugin tests)
  - Test organization: Clear core vs plugin vs integration boundaries
  - Documentation: PRD, README, architecture docs current and accurate
  - Housekeeping: docs/plan/ spillage reduced by 40%+
  - Code quality: Zero regressions, lint clean, type-safe
  - Commit hygiene: Conventional commits with clear change narrative

next_steps:
