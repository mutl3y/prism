notes: |
  This plan uses auto-tier-selection as an experiment. The foreman should:
  1. Start with tier_0_free for simple tasks (housekeeping, docs)
  2. Allow escalation to tier_1_low_cost for medium complexity (test org, doc audit)
  3. Allow escalation to tier_2_balanced for high reasoning (design, implementation)
  
  The plan structure follows Mutl3y workflow patterns:
  - Explicit phase gates with validation criteria
  - DAG-based task sequencing with parallel opportunities
  - Risk mitigation strategies for each phase
  - Success criteria tied to measurable outcomes
