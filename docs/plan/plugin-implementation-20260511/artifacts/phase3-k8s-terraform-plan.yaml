tldr: |
  Four-wave DAG for K8s/Terraform adapter implementation:
  Wave 1 (Analysis/Design): Audit stubs, map error codes (10 per platform), design fixtures
  Wave 2 (K8s Implementation): Adapter core, fixtures, tests, registry wiring (parallel execution)
  Wave 3 (Terraform Implementation): Adapter core, fixtures, tests, registry wiring (parallel to Wave 2)
  Wave 4 (Validation): Cross-platform parity tests, integration gates, closure artifacts

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: "K8s/Terraform error codes overlap or conflict with Ansible codes"
      likelihood: low
      impact: high
      mitigation: "Reserve code ranges: K8s 300-310, Terraform 400-410, validate no collisions"
    - scenario: "Fixture design diverges from Ansible patterns, breaks parity tests"
      likelihood: medium
      impact: high
      mitigation: "Design Phase D2 explicitly references Ansible fixture structure; V1 parity gate catches divergence"
    - scenario: "Secret sanitization patterns incomplete for K8s kubeconfig or Terraform state files"
      likelihood: medium
      impact: critical
      mitigation: "D1 error code spec includes secret pattern catalog per platform; I_K8S_2/I_TF_2 implement with explicit test coverage"
    - scenario: "DI registry wiring conflicts between K8s and Terraform adapters"
      likelihood: low
      impact: medium
      mitigation: "I_K8S_4 and I_TF_4 run sequentially (Wave 2 then Wave 3 completion); shared registry code frozen after K8s wiring"
  assumptions:
    - Ansible adapter implementation patterns are stable and reusable
    - PlatformErrorAdapter protocol is complete and won't change during implementation
    - Existing 21-code error envelope can accommodate K8s/Terraform without redesign
    - Test infrastructure markers and tox envs support new platform markers without changes

implementation_specification:
  code_structure: |
    src/prism/scanner_plugins/kubernetes/
      adapter.py          # PlatformErrorAdapter implementation (~200 lines)
      error_codes.py      # 10 K8s error code definitions
      __init__.py         # Plugin registry entry point
    src/prism/scanner_plugins/terraform/
      adapter.py          # PlatformErrorAdapter implementation (~200 lines)
      error_codes.py      # 10 Terraform error code definitions
      __init__.py         # Plugin registry entry point
    src/prism/tests/fixtures/
      fixtures_k8s_base.py
      fixtures_k8s_errors.py
      fixtures_k8s_edge_cases.py
      fixtures_tf_base.py
      fixtures_tf_errors.py
      fixtures_tf_edge_cases.py
    src/prism/tests/integration/
      test_k8s_adapter.py         # 20 K8s adapter tests
      test_k8s_parity.py          # 10 K8s parity tests
      test_tf_adapter.py          # 20 Terraform adapter tests
      test_tf_parity.py           # 10 Terraform parity tests
      test_multi_platform_parity.py  # 30 cross-platform parity tests
  affected_areas:
    - scanner_plugins.kubernetes (new implementation)
    - scanner_plugins.terraform (new implementation)
    - tests.fixtures (6 new fixture modules)
    - tests.integration (5 new test modules)
    - conftest.py (marker registration for kubernetes/terraform)
  component_details:
    - component: PlatformErrorAdapter (K8s)
      responsibility: "Detect K8s errors, map to error codes, extract 7-field provenance, sanitize kubeconfig secrets"
      interfaces:
        - detect_error(scan_result) -> ErrorEnvelope | None
        - extract_provenance(error_context) -> ProvenanceFields
        - sanitize_secrets(error_message) -> str
      dependencies:
        - component: error_codes.py
          relationship: imports K8s error code definitions
        - component: PlatformErrorAdapter protocol
          relationship: implements protocol contract
      integration_points:
        - PluginRegistry.resolve_platform_adapter("kubernetes")
        - DI container factory methods
    - component: PlatformErrorAdapter (Terraform)
      responsibility: "Detect Terraform errors, map to error codes, extract 7-field provenance, sanitize state file secrets"
      interfaces:
        - detect_error(scan_result) -> ErrorEnvelope | None
        - extract_provenance(error_context) -> ProvenanceFields
        - sanitize_secrets(error_message) -> str
      dependencies:
        - component: error_codes.py
          relationship: imports Terraform error code definitions
        - component: PlatformErrorAdapter protocol
          relationship: implements protocol contract
      integration_points:
        - PluginRegistry.resolve_platform_adapter("terraform")
        - DI container factory methods
    - component: K8s Fixtures
      responsibility: "Provide pod manifests, deployment errors, config errors, kubeconfig sanitization scenarios"
      interfaces:
        - fixture_k8s_pod_error() -> dict
        - fixture_k8s_deployment_error() -> dict
        - fixture_k8s_kubeconfig_with_token() -> str
      dependencies:
        - component: Ansible fixtures
          relationship: mirrors structure and naming conventions
      integration_points:
        - pytest fixture resolution in test_k8s_*.py
    - component: Terraform Fixtures
      responsibility: "Provide plan errors, apply failures, state file issues, HCL syntax scenarios"
      interfaces:
        - fixture_tf_plan_error() -> dict
        - fixture_tf_apply_failure() -> dict
        - fixture_tf_state_with_keys() -> str
      dependencies:
        - component: Ansible fixtures
          relationship: mirrors structure and naming conventions
      integration_points:
        - pytest fixture resolution in test_tf_*.py

