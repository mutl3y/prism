effort_summary:
  analysis: "6h (A1: 2h, A2: 2h, A3: 1h)"
  design: "4.5h (D1: 1.5h, D2: 2h, D3: 1h)"
  implementation_kubernetes: "8.5h (I_K8S_1: 3h, I_K8S_2: 2h, I_K8S_3: 2.5h, I_K8S_4: 1h)"
  implementation_terraform: "8.5h (I_TF_1: 3h, I_TF_2: 2h, I_TF_3: 2.5h, I_TF_4: 1h)"
  validation: "3h (V1: 1.5h, V2: 1h, V3: 0.5h)"
  total_hours: 30.5

wave_decomposition: |
  Wave 1 (Analysis & Design): A1, A2, A3, D1, D2, D3
    - A1 has no dependencies (parallel start)
    - A2 depends on A1
    - A3 depends on A2
    - D1 depends on A2 (parallel with A3)
    - D2 depends on A3 (parallel with D1 completion)
    - D3 depends on A3 (parallel with D1, D2)
    - Expected duration: ~6h (longest path: A1 → A2 → A3 → D2)
  
  Wave 2 (K8s Implementation): I_K8S_1, I_K8S_2, I_K8S_3, I_K8S_4
    - I_K8S_1 depends on D1 (adapter core)
    - I_K8S_2 depends on D2 (fixtures, parallel to I_K8S_1)
    - I_K8S_3 depends on I_K8S_2 and D3 (tests after fixtures)
    - I_K8S_4 depends on I_K8S_1 (wiring after adapter)
    - Expected duration: ~5h (longest path: I_K8S_1 → I_K8S_4 or I_K8S_2 → I_K8S_3)
  
  Wave 3 (Terraform Implementation): I_TF_1, I_TF_2, I_TF_3, I_TF_4
    - I_TF_1 depends on D1 (adapter core, parallel to I_K8S_1)
    - I_TF_2 depends on D2 (fixtures, parallel to I_TF_1 and I_K8S_2)
    - I_TF_3 depends on I_TF_2 and D3 (tests after fixtures, parallel to I_K8S_3)
    - I_TF_4 depends on I_TF_1 AND I_K8S_4 (wiring after K8s wiring completes)
    - Expected duration: ~5h (longest path: I_TF_1 → I_TF_4, blocked by I_K8S_4)
  
  Wave 4 (Validation): V1, V2, V3
    - V1 depends on I_K8S_3 and I_TF_3 (parity after all tests)
    - V2 depends on V1 (integration gate after parity)
    - V3 depends on V2 (closure after validation)
    - Expected duration: ~3h (sequential)

sequencing_strategy: |
  Parallel Execution Opportunities:
  - Wave 1: A1 starts immediately; A2/D1 can run after A1; A3/D2/D3 can overlap
  - Wave 2 and 3 run in parallel (disjoint file sets)
  - Within Wave 2: I_K8S_1 and I_K8S_2 can run in parallel (adapter core vs fixtures)
  - Within Wave 3: I_TF_1 and I_TF_2 can run in parallel (adapter core vs fixtures)
  
  Sequential Dependencies:
  - I_K8S_3 must wait for I_K8S_2 (tests need fixtures)
  - I_TF_3 must wait for I_TF_2 (tests need fixtures)
  - I_TF_4 must wait for I_K8S_4 (avoid registry wiring conflicts)
  - V1 must wait for both I_K8S_3 and I_TF_3 (parity needs both platforms)
  - V2/V3 are strictly sequential
  
  Critical Path:
  A1 → A2 → D1 → I_K8S_1 → I_K8S_4 → I_TF_4 → V1 → V2 → V3 (~17h)
  
  Optimization:
  - Use 2-3 parallel gem-implementer agents for Wave 2/3
  - One agent per platform + shared fixture work
  - Sequential validation prevents conflicts

