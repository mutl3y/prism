  - path: src/prism/scanner_plugins/defaults.py
    evidence: "Module-level Ansible fallback singletons are hardcoded; comment notes missing platform-declared default-provider seam."
missing_hook_points:
  - name: per-container_platform_bundle_registration
    description: "A DIContainer-level API to register platform plugin bundles deterministically at composition time (instead of mutating global registry or requiring preconfigured PluginRegistry)."
  - name: test_scoped_registry_context_manager
    description: "A context-manager/helper to temporarily replace or stage the bootstrap singleton registry for tests, ensuring deterministic registry state and safe restoration."
  - name: platform_default_provider_seam
    description: "Registry or DI hook to supply platform-specific fallback provider factories (so defaults.py need not hardcode Ansible singletons)."
  - name: documented_factory_override_keys_and_helpers
    description: "Canonical constants and helper functions for factory_overrides and inject_mock keys (so tests can inject doubles without relying on private _mocks names)."
  - name: registry_level_test_double_helpers
    description: "Convenience helpers to register test-double plugin classes or deferred loaders into a per-container registry, without needing to mutate global canonical registry."
implementation_risk: "medium — changes touch DI composition and bootstrap ordering; must preserve fail-closed semantics and singleton-invariant checks. Risk mitigations: add feature gates, unit tests, and test-only helpers under a clear API."
