key_evidence:
  - path: src/prism/scanner_core/di.py
    evidence: "DIContainer accepts a PluginRegistry but has no helper to register platform bundles per-container; relies on external registry or bootstrap singleton. factory_overrides/_mocks exist but keys are implicit."
  - path: src/prism/scanner_core/di_helpers.py
