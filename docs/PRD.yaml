prd_id: prism-unified-src-plugin-architecture-20260422
version: 6.0.0
status: active

user_stories:
  - as_a: ansible role author
    i_want: prism to scan my role and generate an accurate README and runbook context
    so_that: my role is self-documenting with minimal manual effort
  - as_a: collection maintainer
    i_want: prism to scan all roles in a collection and produce collection-level documentation
    so_that: downstream users can browse the whole collection from one artifact
  - as_a: platform engineer
    i_want: Prism outputs and audit seams to be structured enough for policy checks and automation workflows
    so_that: documentation quality can be enforced in CI
  - as_a: prism maintainer
    i_want: package-owned scanner layers with stable public entry surfaces and explicit repo-intake ownership
    so_that: the package can evolve without constantly rewriting its public API

scope:
  in_scope:
    - single canonical src/prism/ codebase
    - stable public entry surfaces in api.py, cli.py, and repo_services.py
    - repository-intake ownership consolidated in repo_services.py
    - plugin-driven scanner execution with package-owned core, kernel, extract, config, IO, README, and reporting layers
    - explicit runtime ownership split across scanner_core, scanner_kernel, and scanner_plugins
    - role, collection, and repo scans
    - markdown, report, and machine-readable output generation
    - comment-driven documentation and runbook generation
    - public policy and audit hooks for local workflows and CI
  out_of_scope:
    - Kubernetes and Terraform scanner implementations
    - prism-learn integration tests and separate-repo operational flows

acceptance_criteria:
  - criterion: Public entry surfaces remain stable
    verification: api.py, cli.py, and repo_services.py retain the supported entrypoints used by current tests and callers
  - criterion: Scanner behavior is package-owned
    verification: runtime behavior is implemented through scanner packages rather than a monolithic top-level runtime module
  - criterion: Repo intake and policy seams stay explicit
    verification: repo_services.py remains the shared repo-intake owner, while public audit-rule entry handling stays at the API/CLI boundary rather than moving into scanner_core
  - criterion: Quality gates remain green
    verification: pytest, ruff, black --check, and tox -e typecheck pass for the live package
  - criterion: Core docs match the live tree
    verification: current-facing docs describe api.py, cli.py, repo_services.py, cli_app, api_layer, and scanner_* ownership accurately

features:
  - name: Role scanning
    overview: Generate role documentation, scanner reports, and optional runbook artifacts from static analysis.
    status: complete

  - name: Collection scanning
    overview: Scan collections, aggregate role results, and render collection-level documentation and dependency views.
    status: complete

  - name: Repo scanning
    overview: Clone or inspect repository sources, resolve repo-relative targets safely, and run downstream role scans through shared repo intake helpers.
    status: complete

  - name: Comment-driven documentation
    overview: Render task notes, warnings, and runbook context from Prism comment markers.
    status: complete

  - name: Policy and audit hooks
    overview: Support policy-config input and public audit rule evaluation so teams can enforce documentation quality in automation.
    status: complete

  - name: Plugin-driven execution architecture
    overview: Keep scanner orchestration generic while platform-specific behavior lives in plugin-owned modules.
    status: complete

  - name: Shared repository intake
    overview: Resolve repo-relative targets, workspace lifecycle, and downstream role scans through repo_services-owned seams.
    status: complete

error_envelope:
  status: implemented
  description: "Protocol-based error adapter interface with 5 categories and 21 error codes. Provides unified error provenance, secret sanitization, and structured error payloads."

platform_adapters:
  ansible:
    status: "reference implementation (stable)"
  kubernetes:
    status: "adapter stub present (not yet implemented)"
  terraform:
    status: "adapter stub present (not yet implemented)"

test_infrastructure:
  structure: "Tests organized into 4 boundaries: core/, plugins/, plugins/ansible/, integration/"
  marker_selection:
    - "pytest -m core     # 36 tests: DI, caching, policies, config"
    - "pytest -m plugins  # 14 tests: plugin API, discovery, schema"
    - "pytest -m integration  # 69 tests: parity, e2e, boundary"
  tox_envs:
    - "test-core"
    - "test-plugins"
    - "test-integration"

errors:
  - code: LEGACY_SECTION_CONFIG_UNSUPPORTED
    message: "Legacy section config file `.ansible_role_doc.yml` is no longer supported. Rename or migrate to `.prism.yml`."
    when: Triggered when legacy section config is detected in user-provided role content.
  - code: LEGACY_RUNTIME_PATH_UNAVAILABLE
    message: Legacy ansible_role_doc compatibility path has been retired. Use canonical Prism behavior.
    when: Triggered when a user-facing command or input requests a retired legacy mode.

decisions:
  - decision: Keep public entry surfaces stable
    rationale: api.py, cli.py, and repo_services.py are the supported top-level boundaries for callers.
  - decision: Keep scanner implementation package-owned
    rationale: package-owned layers are easier to evolve, test, and guard than a monolithic runtime module.
  - decision: Keep detailed execution history out of the PRD
    rationale: wave-by-wave change history belongs in git and docs/plan, not in the current product definition.

changes:
  - version: 6.0.0
    change: "2026-05-05 -- Refreshed docs to reflect the live package layout, explicit repo-intake ownership, public policy/audit seams, and current supported feature set."
