[metadata]
name = prism-ansible
version = 0.1.0

[tool:pytest]
python_files = test_*.py
testpaths =
	src/prism/tests
markers =
	boundary: architectural boundary guardrail tests that should remain flat
	core: core functionality tests for scanner_core, scanner_extract, DI, and policy behavior
	plugins: plugin adapter tests for ansible, kubernetes, terraform, and related plugin seams
	ansible: Ansible-specific tests and fixtures
	kubernetes: Kubernetes-specific tests and fixtures
	terraform: Terraform-specific tests and fixtures
	integration: cross-platform parity, entrypoint, and end-to-end tests
	mp1_blocking: Phase 1 acceptance gate for MP1 marker-prefix enforcement

[coverage:run]
branch = True
source =
	src/prism
omit =
	*/tests/*
	*/__pycache__/*
	*/init.py

[coverage:report]
show_missing = True
skip_covered = True
precision = 1
exclude_lines =
	pragma: no cover
	if __name__ == .__main__.:
